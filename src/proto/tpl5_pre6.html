<style>

const wds=s=>String(s||'').toLowerCase().split(/[^a-zäöüß0-9]+/).filter(Boolean);

function score(f,terms){let tot=0;for(const t of terms){let b=0;const L=t.length;
const nm=String(f.n||'').toLowerCase();
if(nm.startsWith(t))b=100;else if(wst(f.n,t))b=80;else if(wst(f.a,t))b=60;
else if(L>=3&&wst(f.i,t))b=50;else if(L>=3&&wst(f.k,t))b=20;
else if(L>=3&&(wst(f.v,t)||wst(f.b,t)||wst(f.z,t)))b=10;else if(L>=4&&((f.v||'')+(f.b||'')+(f.z||'')).toLowerCase().includes(t))b=6;
if(!b)return 0;tot+=b}return tot}
function fields(i){const c=i.cid?CM[i.cid]:null;return {n:i.name,i:i.inci,k:i.kat,a:c?c.a:'',v:i.verw,b:i.beschr,z:i.notiz+' '+i.quelle}}
function match(i,q){const terms=q.toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length)return {ok:true,s:0};const f=fields(i);const s=score(f,terms);if(!s)return {ok:false};
let hit='';const t=terms.find(t=>t.length>=3&&!wst(f.n,t)&&!wst(f.i,t)&&!wst(f.a,t));
if(t){for(const [lb,tx] of [['Verwendung',i.verw],['Beschreibung',i.beschr],['Notiz',i.notiz]]){const p=String(tx||'').toLowerCase().indexOf(t);if(p>=0){hit=lb+': …'+tx.slice(Math.max(0,p-14),p+30)+'…';break}}}
return {ok:true,s,hit}}

let body='';
if(E.mode==='liste'){let est=0;
body=`<div class="card" style="margin-top:14px;overflow:hidden">${rows.map(s=>{const i=getI(s.item);const ls=[...new Set(i.bezug.map(x=>x.lief))];const c=s.lief?cost(s,s.lief):null;const pr=ls.map(x=>({x,c:cost(s,x)}));const valid=pr.filter(p=>p.c!=null).map(p=>p.c);const minc=valid.length?Math.min(...valid):Infinity;if(c!=null)est+=c;else if(isFinite(minc))est+=minc;
return `<div style="padding:12px 14px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0;cursor:pointer" onclick="go('artikel','${i.id}')"><div style="font-weight:500;font-size:.92rem;overflow-wrap:anywhere">${esc(i.name)}</div><div class="s">${fmt(s.menge,i.kind)} · im Lager ${fmt(i.total,i.kind)}${c!=null?' · <b style="color:var(--txt);font-weight:600">'+eur(c)+'</b>':''}</div></div><div style="display:flex;flex:none"><button class="gk" onclick="sheetBought('${s.id}')">${ic('import','#fff',19)}Gekauft</button><button class="ib" style="width:34px;height:34px" onclick="delShop('${s.id}')" aria-label="Entfernen">${ic('trash','var(--sub)',17)}</button></div></div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${pr.map(p=>`<button class="pill ${p.x===s.lief?'on':''}" data-l="${esc(p.x)}" onclick="setLief('${s.id}',this.dataset.l)">${esc(p.x)} · ${p.c!=null?eur(p.c):'–'}${ls.length>1&&p.c===minc?' ✓':''}</button>`).join('')||'<span class="s">Kein Bezug erfasst</span>'}</div></div>`}).join('')}</div>
<div style="display:flex;justify-content:space-between;margin:12px 4px 0"><span class="s">Geschätzte Summe (ohne Versand)</span><b style="font-weight:600">${eur(est)}</b></div>`}
else{const groups={};rows.forEach(s=>{(groups[s.lief||'']=groups[s.lief||'']||[]).push(s)});const order=Object.keys(groups).sort((a,b)=>(a===''?1:0)-(b===''?1:0));
body=order.map(l=>{const g=groups[l];const sum=g.reduce((a,s)=>a+(cost(s,l)||0),0);const cfg=S.lief[l]||{frei:0,versand:0};let prog='';
if(l){if(cfg.frei>0){const rest=cfg.frei-sum;prog=`<div class="bar"><div style="width:${Math.min(100,sum/cfg.frei*100)}%"></div></div><div class="s" style="margin-top:6px;color:${rest>0?'var(--ambt)':'var(--pri)'}">${rest>0?`Noch ${eur(rest)} bis versandkostenfrei`:'Versandkostenfrei erreicht'}</div>`}else prog=`<div class="s" style="margin-top:6px">Versandregeln nicht hinterlegt</div>`}
const total=sum+(l&&cfg.frei>0&&sum<cfg.frei?cfg.versand:0);
return `<div class="card" style="margin-top:14px;overflow:hidden"><div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><b style="font-weight:600">${l?esc(l):'Lieferant offen'}</b>${l?`<button class="lnk" data-l="${esc(l)}" onclick="sheetLief(this.dataset.l)">Versand ›</button>`:''}</div>
${g.map(s=>{const i=getI(s.item);const c=l?cost(s,l):null;return `<div style="padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px"><div style="font-size:.9rem;font-weight:500;min-width:0;overflow-wrap:anywhere">${esc(i.name)}<div class="s" style="font-weight:400">${fmt(s.menge,i.kind)}</div></div><div style="font-size:.88rem">${c!=null?eur(c):'–'}</div></div>`}).join('')}
<div style="padding:12px 14px"><div style="display:flex;justify-content:space-between"><span class="s">Summe${l&&cfg.frei>0&&sum<cfg.frei?' inkl. '+eur(cfg.versand)+' Versand':''}</span><b style="font-weight:600">${l?eur(total):'–'}</b></div>${prog}</div></div>`}).join('')}
m.innerHTML=head+body+`<button class="btn" style="width:100%;margin-top:16px" onclick="sheetExport()">Einkaufsliste exportieren …</button>`}

if(it){it.total+=ab}else{it=c?mk(c,{kind,total:ab}):mk(null,{name,kind,total:ab});S.items.push(it)}

function doExport(){const j=JSON.stringify(S);openSheet(`<h2>Sicherung</h2><div class="hint" style="margin:0 0 8px">Kopiere den Text und speichere ihn in einer Datei (.json). Zum Wiederherstellen unter Mehr › Import wählen.</div><textarea id="bk" readonly style="width:100%;height:140px;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit;font-size:.72rem">${esc(j)}</textarea><div class="btns"><button class="btn" onclick="cp()">Kopieren</button><button class="btn sec" onclick="closeSheet()">Schließen</button></div>`)}
function doImport(inp){const f=inp.files[0];if(!f)return;f.text().then(t=>{try{const d=JSON.parse(t);if(!d.items)throw 0;S=d;S.items=S.items.map(normI);save();tab('lager');toast('Sicherung eingelesen')}catch(e){toast('Datei nicht lesbar')}})}
function sheetSettings(){openSheet(`<h2>Einstellungen</h2><div class="cap" style="margin:0 0 4px">Lagerorte</div><div class="s" style="margin-bottom:6px">Diese Orte kannst du bei Gefäßen auswählen.</div>${S.orte.map((o,n)=>`<div class="row" style="padding:0 2px;cursor:default"><div class="t"><b>${esc(o)}</b></div><button class="ib" style="color:var(--sub)" onclick="delOrt(${n})" aria-label="Entfernen">${ic('x','var(--sub)',20)}</button></div>`).join('')||'<div class="s">Noch keine Orte.</div>'}
<div style="display:flex;gap:8px;margin-top:12px"><input id="no" placeholder="Neuer Lagerort, z. B. Schuhkarton" style="flex:1;min-width:0;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit"><button class="btn" onclick="addOrt()">Hinzufügen</button></div><div style="height:22px"></div><label class="chk" style="margin:0 0 4px"><input type="checkbox" ${S.expert?'checked':''} onchange="S.expert=this.checked;save();sheetSettings()"> Expertenmodus (Entwickleroptionen)</label>${S.expert?`<div class="card" style="padding:4px 14px;margin:8px 0 18px">${[['Einheitensystem: metrisch (SI)'],['Dichte je Rohstoff (ml ↔ g)'],['Menüleiste anpassen']].map(x=>`<div class="kv"><span>${x[0]}</span><span class="pillbtn">in Vorbereitung</span></div>`).join('')}</div>`:'<div style="height:14px"></div>'}`)}
function addOrt(){const v=val('no').trim();if(!v)return;if(!S.orte.includes(v))S.orte.push(v);save();sheetSettings()}
function delOrt(n){S.orte.splice(n,1);save();sheetSettings()}
function sheetClear(){openSheet(`<h2>Alle Daten löschen?</h2><div style="font-size:.9rem">Entfernt die Beispielartikel und alles, was du angelegt hast. Der Katalog bleibt.</div><div class="btns"><button class="btn danger" onclick="S={items:[],shop:[],lief:{'Dragon Spice':{frei:0,versand:0},'Spinnrad':{frei:0,versand:0}},seeded:true};save();tab('lager')">Alles löschen</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}
function sheetInfo(){openSheet(`<h2>INCIheinz – Prototyp</h2><div style="font-size:.88rem;line-height:1.5">Version 0.3 (Bedienkonzept)<br>Katalog 0.3 · ${CAT.length} Einträge<br><br>Alle Lagerdaten und eigenen Texte bleiben auf diesem Gerät im Browser. Preise und Artikelnummern der Beispieldaten sind Platzhalter. Der Katalog enthält nur Namen, INCI und Kategorien; unbestätigte INCI sind als „ungeprüft“ markiert.</div>`)}
function scan(){$('#main').innerHTML=`<div class="scan"><div class="vf"></div><div style="font-size:.88rem">Kamera-Scan (Barcode, QR, Etikett) ist in diesem Prototyp noch nicht aktiv.</div><button class="btn" style="margin-top:18px;background:#7FC59B;color:#0F1A14" onclick="sheetNeu()">Stattdessen Rohstoff per Name anlegen</button></div>`}
(async()=>{await load();if(!S.seeded){seed();save()}draw()})();
</script></body></html>

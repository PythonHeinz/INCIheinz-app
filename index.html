<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>INCIheinz Prototyp</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F8F5;--surf:#fff;--line:#E1E8E2;--pri:#2D5A43;--onpri:#fff;--txt:#1E2621;--sub:#4B5A51;--amb:#D97706;--ambt:#B45309;--muted:#E8F2EC;--dim:rgba(30,38,33,.45);--err:#B42318}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16.5px;font-weight:440;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
#app{max-width:480px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
header{flex:none;min-height:58px;background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 8px}
header .logo{display:flex;align-items:center;gap:10px}
header .ring{width:32px;height:32px;border:1.8px solid var(--pri);border-radius:50%;display:flex;align-items:center;justify-content:center}
header b{font-size:1.15rem;font-weight:600;color:var(--pri);line-height:1;letter-spacing:-.02em}header b span{color:var(--txt);font-weight:500}
header small{display:block;font-size:.6rem;letter-spacing:.2em;color:var(--sub);margin-top:3px;font-weight:500}
.ib{background:none;border:0;color:var(--pri);width:44px;height:44px;display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer}
main{flex:1;overflow-y:auto;padding:14px 16px 100px;-webkit-overflow-scrolling:touch}
nav{flex:none;height:72px;background:var(--surf);border-top:1px solid var(--line);display:flex;align-items:flex-start}
nav button{flex:1;background:none;border:0;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:3px;font:inherit;font-size:.74rem;font-weight:500;padding:9px 0 0;min-height:44px;cursor:pointer}
nav button.on{color:var(--pri);font-weight:600}
nav .plus{width:56px;height:56px;border-radius:50%;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center;margin-top:-26px;box-shadow:0 0 0 6px var(--bg);flex:none;padding:0;min-height:0}
.cap{font-size:.76rem;letter-spacing:.12em;color:#3C4E43;text-transform:uppercase;font-weight:650}
.card{background:var(--surf);border:1px solid var(--line);border-radius:14px}
.search{height:46px;border:1px solid var(--line);border-radius:12px;display:flex;align-items:center;background:var(--surf)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:.95rem;color:var(--txt);height:44px}
.seg{margin-top:10px;padding:4px;background:var(--muted);border-radius:12px;display:flex;gap:4px}
.seg button{flex:1;min-width:0;height:38px;border:0;border-radius:9px;background:none;color:var(--sub);font:inherit;font-size:.9rem;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--onpri)}
.seg i{font-style:normal;font-size:.68rem;padding:1px 7px;border-radius:99px;background:var(--muted);color:var(--sub)}
.seg button.on i{background:rgba(255,255,255,.22);color:var(--onpri)}
.row{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:1rem;font-weight:520;overflow-wrap:anywhere}
.s{font-size:.84rem;color:var(--sub)}
.chip{width:34px;height:34px;border-radius:9px;background:var(--muted);display:flex;align-items:center;justify-content:center;flex:none}
.btn{height:46px;border-radius:12px;border:0;background:var(--pri);color:var(--onpri);font:inherit;font-size:.9rem;font-weight:500;padding:0 14px;cursor:pointer}
.btn.sec{background:var(--surf);color:var(--txt);border:1px solid var(--line)}
.btn.danger{background:var(--surf);color:var(--err);border:1px solid var(--line)}
.btns{display:flex;gap:10px;margin-top:14px}.btns .btn{flex:1;min-width:0}
.lnk{background:none;border:0;color:var(--pri);font:inherit;font-size:.82rem;font-weight:500;cursor:pointer;padding:6px 0;text-decoration:none}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.7rem;font-weight:500;background:var(--muted);color:var(--pri)}
.badge.u{background:#F3EFE6;color:var(--ambt)}
.amb{color:var(--ambt);font-weight:500}
.bar{height:5px;border-radius:3px;background:var(--muted);overflow:hidden;margin-top:10px}.bar>div{height:5px;background:var(--pri)}
.dim{position:absolute;inset:0;background:var(--dim);z-index:20}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;overflow-y:auto;background:var(--surf);border-radius:22px 22px 0 0;border-top:1px solid var(--line);padding:10px 16px 22px;z-index:21}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:1.05rem;font-weight:600;margin:0 0 12px;letter-spacing:-.01em}
.fld{display:block;margin-top:10px}.fld>span{display:block;font-size:.8rem;color:var(--sub);margin-bottom:4px;font-weight:500}
.fld input,.fld select,.fld textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:0 12px;font:inherit;font-size:.95rem;background:var(--surf);color:var(--txt)}
.fld input,.fld select{height:46px}
.fld textarea{padding:10px 12px;min-height:76px;resize:vertical;line-height:1.4}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.two{display:flex;gap:10px}.two>*{flex:1;min-width:0}.two>.u{flex:0 0 40%}
.err{color:var(--err);font-size:.82rem;margin-top:10px}
.hit{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.hit b{font-size:.92rem;font-weight:500}.hit.on{background:var(--muted);margin:0 -8px;padding:10px 8px;border-radius:8px}
#toast{position:absolute;left:16px;right:16px;bottom:88px;background:var(--txt);color:#fff;border-radius:12px;padding:12px 14px;font-size:.85rem;z-index:40;display:none}
.pill{border:1px solid var(--line);background:var(--surf);border-radius:99px;padding:7px 12px;font:inherit;font-size:.78rem;cursor:pointer;color:var(--txt);text-decoration:none;display:inline-block}
.pill.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.scan{background:#0b100d;color:#9DB0A4;border-radius:14px;padding:40px 16px;text-align:center}
.vf{width:230px;height:230px;margin:0 auto 18px;border:2px dashed #3a4a42;border-radius:14px}
details.acc{background:var(--surf);border:1px solid var(--line);border-radius:14px;margin-top:12px}
details.acc>summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:14px 14px;cursor:pointer;font-size:.92rem;font-weight:500}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary::after{content:'';width:8px;height:8px;border-right:1.8px solid var(--sub);border-bottom:1.8px solid var(--sub);transform:rotate(45deg);margin:-4px 4px 0 0;transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
details.acc>.in{padding:0 14px 14px}
details.acc>summary small{font-weight:400;color:var(--sub);font-size:.75rem;margin-left:8px}
.savebar{position:absolute;left:16px;right:16px;bottom:88px;z-index:15;background:var(--txt);border-radius:14px;padding:8px 8px 8px 16px;display:none;align-items:center;gap:8px;color:#fff;font-size:.85rem;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.savebar span{flex:1}.savebar .btn{height:40px;background:#7FC59B;color:#0F1A14}.savebar .btn.g{background:none;color:#fff;border:1px solid #4a5a50}
.tb{display:flex;gap:8px;margin-top:10px}
.tb select{height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surf);font:inherit;font-size:.82rem;padding:0 8px;color:var(--txt);min-width:0;flex:1}
.tb button{width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--surf);color:var(--pri);font-size:1rem;cursor:pointer;flex:none}
.th,.tr{display:flex;align-items:center;gap:8px}
.th{padding:8px 14px;border-bottom:1px solid var(--line);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:500}
.th span{cursor:pointer}.th .on{color:var(--pri)}
.tr{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;min-height:52px}.tr:last-child{border-bottom:0}
.c1{flex:1;min-width:0}.c2{flex:0 0 58px;text-align:right;display:flex;justify-content:flex-end;align-items:center}.th .c2{display:block}
.vt{display:flex;gap:6px;margin-top:6px}.vt button{flex:1;min-width:0;border:1px solid var(--line);background:var(--surf);border-radius:12px;padding:8px 0 6px;font:inherit;font-size:.64rem;color:var(--sub);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.vt button.on{border-color:var(--pri);background:var(--muted);color:var(--pri);font-weight:500}
input[type=range]{width:100%;accent-color:var(--pri)}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:.88rem}.chk input{width:20px;height:20px;accent-color:var(--pri)}
.hint{font-size:.76rem;color:var(--sub);margin-top:6px}

.sheet .x{position:absolute;right:8px;top:6px;width:44px;height:44px;background:none;border:0;color:var(--sub);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.sheet h2{padding-right:44px;min-height:30px}
#dim2{z-index:30}#sheet2{z-index:31}
.selbtn{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surf);font:inherit;font-size:.95rem;color:var(--txt);display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;cursor:pointer}
.tb .selbtn{height:40px;font-size:.82rem;border-radius:10px;padding:0 10px;flex:1;min-width:0}
.tb .selbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editbar{position:sticky;top:-14px;z-index:12;margin:-14px -16px 12px;padding:6px 8px;background:var(--surf);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.editbar span{flex:1;font-size:.88rem;font-weight:500}
.editbar .btn{height:38px}
.btn:disabled{background:var(--line);color:#9aa8a0;cursor:default}
.nm{font-weight:500;font-size:.92rem;overflow-wrap:anywhere}
.ri{display:flex;gap:7px;align-items:center;margin-top:4px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}.kv:last-child{border-bottom:0}.kv span:first-child{color:var(--sub);flex:none}.kv span:last-child{text-align:right;overflow-wrap:anywhere}
.txt{padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem;white-space:pre-wrap;overflow-wrap:anywhere}.txt:last-child{border-bottom:0}
.opt{display:flex;align-items:center;gap:12px;min-height:50px;padding:0 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.92rem}
.opt.on{color:var(--pri);font-weight:500}.opt .ck{margin-left:auto}
.tg{width:48px;height:48px;border-radius:14px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none;background:var(--surf)}.tg.on{background:var(--pri);border-color:var(--pri)}.ckrow{min-height:64px;transition:background .1s}.ckrow.on{background:#E3F2E8;box-shadow:inset 4px 0 0 var(--pri)}.ckrow:active{background:#d4ebdb}
.pillbtn{border:1px solid var(--line);background:var(--muted);color:var(--sub);border-radius:99px;padding:3px 10px;font-size:.7rem}
.ckrow{min-height:72px}.ckrow .t b{font-size:1.04rem;font-weight:560;overflow-wrap:break-word;hyphens:auto;-webkit-hyphens:auto}.ckrow .s{font-size:.88rem}
.gk{height:36px;border-radius:18px;background:var(--pri);color:#fff;border:0;padding:0 12px 0 9px;font:inherit;font-size:.84rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;cursor:pointer;flex:none}

.pic{width:30px;height:30px;border-radius:7px;object-fit:cover;vertical-align:middle;margin-right:8px}
.hero{margin-top:14px}.btns.col{flex-direction:column}.btns.col .btn{flex:none;width:100%}
.hero img{width:100%;max-width:240px;aspect-ratio:1;object-fit:cover;border-radius:16px;display:block;margin:0 auto;border:1px solid var(--line)}
.camov{position:absolute;inset:0;background:#000;z-index:40;display:flex;flex-direction:column}.camov video{flex:1;width:100%;min-height:0;object-fit:cover}
.camfr{position:absolute;left:50%;top:40%;width:240px;height:240px;margin:-120px 0 0 -120px;border:3px solid #7FC59B;border-radius:18px;pointer-events:none}
.camtx{position:absolute;top:24px;left:0;right:0;text-align:center;color:#fff;font-size:.9rem}.cambt{padding:14px;display:flex;gap:10px;background:#000}
details.ac{border-bottom:1px solid var(--line)}details.ac summary{padding:14px 2px;font-weight:600;cursor:pointer;list-style:none;display:flex;justify-content:space-between}details.ac summary::after{content:'▾';color:var(--sub)}details.ac[open] summary::after{content:'▴'}details.ac p{margin:0 0 14px;font-size:.92rem;line-height:1.5}
.label{display:flex;align-items:center;gap:1.5mm;padding:1.5mm;overflow:hidden;background:#fff;color:#000;border:1px dashed #aaa;box-sizing:border-box;break-inside:avoid}
.label .lq{flex:none}.label .lq svg{display:block;width:100%;height:100%}.label .lt{min-width:0;line-height:1.1}
.label .ln{font-weight:700;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.label .lc{font:700 6pt/1 ui-monospace,Menlo,Consolas,monospace;margin-top:.8mm;letter-spacing:.06em}
.label .lin{margin-top:.8mm;color:#222;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;word-break:break-word;line-height:1.1}
.label .ln{font-size:calc(var(--fs,7pt)*var(--k,1));hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;word-break:normal}
.size-S{--fs:6.5pt;width:38mm;height:21mm}.size-S .lq{width:17mm;height:17mm}.size-S .lin{font-size:4.6pt;-webkit-line-clamp:2}
.size-M{--fs:7.5pt;width:48mm;height:25mm}.size-M .lq{width:21mm;height:21mm}.size-M .lin{font-size:5pt;-webkit-line-clamp:3}
.size-L{--fs:9.5pt;width:63mm;height:38mm}.size-L .lq{width:30mm;height:30mm}.size-L .ln{-webkit-line-clamp:3}.size-L .lin{font-size:6.5pt;-webkit-line-clamp:5}
#prt{display:none}
@media print{@page{size:A4;margin:8mm}html,body{height:auto!important;overflow:visible!important;background:#fff!important}#app{display:none!important}#prt{display:block!important}.lsheet{display:flex;flex-wrap:wrap;gap:2mm;align-content:flex-start}}

#app.artpg{--bg:#DCE4DD;--line:#BFCCC2}
#app.artpg .card,#app.artpg details.acc{background:#FCFBF7;box-shadow:0 1px 2px rgba(30,38,33,.10)}
#app.artpg .fld input,#app.artpg .fld textarea,#app.artpg .fld select,#app.artpg .selbtn{background:#fff;border-color:#AEBDB2}

.th{align-items:center}.th span{white-space:nowrap}
.c2{flex:0 0 62px!important}.th .c2{display:flex!important;justify-content:flex-end;align-items:center;font-size:.62rem;letter-spacing:.03em}
.lead{flex:0 0 22px;display:flex;align-items:center;justify-content:center}
.ph{flex:0 0 34px;height:34px}.ph .pic{width:34px;height:34px;margin:0;border-radius:9px;display:block;object-fit:cover}
.tr{min-height:58px}.tr .nm{display:flex;align-items:center;gap:6px}.tr .nm .ri{flex:none;display:inline-flex;margin:0;gap:5px}.tr .nm .t{min-width:0}
input::placeholder,textarea::placeholder{color:#C3CBC5;opacity:1}

.wgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.wg{padding:12px 14px;cursor:pointer;min-width:0;overflow:hidden}.wg.w2{grid-column:span 2}
.wg h3{margin:0 0 8px;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;color:var(--sub);font-weight:500}
.big{font-size:1.5rem;font-weight:600;letter-spacing:-.02em}
.card.sc{-webkit-overflow-scrolling:touch}.card.sc .th,.card.sc .tr{min-width:var(--w)}.card.sc .c1{position:sticky;left:0;z-index:2;background:var(--surf,#fff);flex:0 0 150px!important;min-width:150px;box-shadow:6px 0 6px -6px rgba(0,0,0,.15)}#toast{top:60px!important;bottom:auto!important;text-align:center;background:#24332b!important}.nm{display:block!important;overflow-wrap:break-word!important;word-break:normal!important;-webkit-hyphens:auto;hyphens:auto}.nm .t{display:block;overflow-wrap:break-word;word-break:normal;-webkit-hyphens:auto;hyphens:auto}.ri{margin-top:3px}.card.nl .lead{display:none}.card.nl .th,.card.nl .tr{padding-left:12px;padding-right:12px;gap:6px}.card.sc .nm{overflow-wrap:break-word!important}/* ===== Rezeptbuch ===== */
header.h2{display:block;padding:0;min-height:0}
header.h2 .hr{display:flex;align-items:center;justify-content:space-between;padding:0 8px;min-height:52px}
.reg{display:flex;gap:6px;padding:0 12px 9px}

#app.rez{--bg:#FAF4E8;--surf:#FFFCF5;--line:#E6D9C0;--pri:#8B4A2B;--onpri:#FFF8EE;--txt:#2B2118;--sub:#6A5846;--muted:#F3E8D2;--amb:#B45309;--ambt:#92400E;--err:#A32A1E;--dim:rgba(43,33,24,.45)}

= Katalog-Fassung übernehmen.": "Tick = take the catalog version.", "Aktualisieren": "Update", "Es ist gerade kein Katalog-Update erreichbar. Prüfe die Internetverbindung und versuche es später noch einmal.": "No catalog update is reachable right now. Check your internet connection and try again later.", "Katalog aktualisiert": "Catalog updated", "Etiketten &amp; Druck": "Labels &amp; print", "Keine Rohstoffe": "No raw materials", "Lege zuerst Rohstoffe an, dann kannst du Etiketten drucken.": "Add raw materials first, then you can print labels.", "Größe": "Size", "Vorschau": "Preview", "Rohstoffe wählen": "Choose raw materials", "Keine": "None", "Noch nicht gedruckt": "Not yet printed", "Danach als gedruckt markieren": "Mark as printed afterwards", "Drucken": "Print", "Bitte Rohstoffe auswählen": "Please select raw materials", "Klein 38×21 mm": "Small 38×21 mm", "Mittel 48×25 mm": "Medium 48×25 mm", "Groß 63×38 mm": "Large 63×38 mm", "Der Druckdialog deines Geräts öffnet sich. Wähle dort „Tatsächliche Größe“ bzw. 100 %, damit die Etiketten maßgetreu bleiben.": "Your device’s print dialog opens. Choose “Actual size” or 100 % there so the labels keep their exact size.", "Code lesen oder ein Bild für einen Rohstoff aufnehmen.": "Read a code or take a picture for a raw material.", "Barcode / QR-Code": "Barcode / QR code", "Etikett oder Verpackung scannen": "Scan a label or packaging", "Foto aufnehmen": "Take photo", "Als Bild für einen Rohstoff": "As picture for a raw material", "Foto aus Galerie": "Photo from gallery", "Vorhandenes Bild zuordnen": "Assign an existing picture", "Code von Hand eingeben": "Enter code manually", "Artikelcode oder EAN": "Article code or EAN", "Öffnen": "Open", "Unbekannter Code": "Unknown code", "Dieser Code gehört noch zu keinem Rohstoff. Neu anlegen?": "This code does not belong to any raw material yet. Create a new one?", "Neuen Rohstoff anlegen": "Create new raw material", "Vorhandenem Rohstoff zuordnen": "Assign to existing raw material", "Zu welchem Rohstoff gehört der Code?": "Which raw material does the code belong to?", "Code gespeichert": "Code saved", "Zu welchem Rohstoff?": "Which raw material?", "Das Bild wird für diesen Rohstoff verwendet.": "The picture is used for this raw material.", "Code in den Rahmen halten": "Hold the code inside the frame", "Automatisches Scannen ist hier nicht möglich – bitte Code von Hand eingeben": "Automatic scanning is not possible here – please enter the code manually", "Kamera nicht erlaubt oder nicht verfügbar": "Camera not allowed or not available", "Ausschnitt wählen": "Choose crop", "Bild mit dem Finger verschieben, mit dem Regler vergrößern.": "Drag the picture with your finger, zoom with the slider.", "Weiter": "Next", "Bild nicht lesbar": "Image not readable", "Foto gespeichert": "Photo saved", "Foto entfernen": "Remove photo", "Überblick": "Overview", "Rohstoffe anlegen": "Add raw materials", "Bestand, Gefäße und Preise": "Stock, containers and prices", "Etiketten drucken": "Printing labels", "Scannen und Fotos": "Scanning and photos", "Sichern und Import": "Backup and import", "Wenn etwas nicht klappt": "If something does not work", "INCIheinz ist dein privates Rohstofflager für Naturkosmetik: Du siehst, was da ist, was knapp wird, was bald abläuft und was du nachkaufen willst. Alle Daten bleiben auf diesem Gerät. Die App verwaltet nur dein Lager. Verwendung, Notizen und Beschreibungen schreibst du selbst.": "INCIheinz is your private raw-material store for natural cosmetics: you see what you have, what is running low, what expires soon and what you want to reorder. All data stays on this device. The app only manages your stock. You write usage, notes and descriptions yourself.", "Tippe in der Mitte auf „Neu“. Gib einen Namen ein und wähle einen Katalogtreffer, dann kommen INCI und Kategorie automatisch mit. Findest du nichts, legst du einen eigenen Rohstoff an. Die Menge darf leer bleiben. Alles Weitere ergänzt du auf der Rohstoff-Seite über den Stift.": "Tap “New” in the middle. Enter a name and pick a catalog match; INCI and category come along automatically. If you find nothing, create your own raw material. The quantity may stay empty. Add everything else on the raw material page with the pencil.", "Unter „Lager“ findest du den Regal-Check: Kategorie wählen, Regal durchgehen und antippen, was du hast. Die Mengen sind dann zunächst „?“ und werden nachgetragen, wenn du sie kennst.": "Under “Stock” you find the shelf check: choose a category, go through your shelf and tap what you have. Quantities show “?” at first and can be added later.", "Mit „Bestand ändern“ buchst du Zu- und Abgänge. Gefäße sind optional und nur nötig, wenn du Teilmengen getrennt verwalten willst. Bei „Bezugsquelle“ trägst du Lieferant, Preis und Menge ein. Jeder Preis wird mit Datum gespeichert, daraus entstehen Preisverlauf und Preis je 100 g/ml.": "Use “Change stock” to book additions and withdrawals. Containers are optional and only needed if you want to track partial quantities separately. Under “Source” you enter supplier, price and quantity. Every price is saved with a date, which gives you a price history and the price per 100 g/ml.", "Unter Mehr › Einstellungen verwaltest du deine Lieferanten mit Versandkosten, Grenze für kostenfreien Versand und Webseite. Neue Lieferanten legst du auch direkt bei der Bezugsquelle an. Die Lieferanten aus bereits erfassten Preisen werden automatisch übernommen.": "Under More › Settings you manage your suppliers with shipping costs, free-shipping threshold and website. You can also add new suppliers directly in the source dialog. Suppliers from prices already entered are adopted automatically.", "Rohstoffe setzt du über „Auf Einkaufsliste“ oder die Kachel „Knapp“. Die Liste ist nach Lieferant gruppiert und zeigt Versandkosten. Mit „Gekauft“ wird die Menge im Lager gebucht.": "Add raw materials via “Add to shopping list” or the “Low” tile. The list is grouped by supplier and shows shipping costs. “Bought” books the quantity into your stock.", "Unter Mehr › Etiketten & Druck wählst du eine Größe (klein 38×21, mittel 48×25, groß 63×38 mm) und die Rohstoffe. Auf jedem Etikett stehen QR-Code, Artikelcode, Name und INCI. Gedruckt wird über den Druckdialog deines Geräts, am besten mit „Tatsächliche Größe“ auf Etikettenbogen oder Papier zum Ausschneiden.": "Under More › Labels & print you choose a size (small 38×21, medium 48×25, large 63×38 mm) and the raw materials. Each label shows QR code, article code, name and INCI. Printing uses your device’s print dialog, best with “Actual size” on label sheets or paper to cut out.", "Im Tab „Scannen“ liest du QR- und Barcodes. Ein eigenes Etikett öffnet sofort den Rohstoff. Einen fremden Code, etwa den Barcode einer Verpackung, kannst du einem Rohstoff zuordnen oder dafür einen neuen anlegen. Mit „Foto aufnehmen“ oder „Foto aus Galerie“ gibst du einem Rohstoff ein kleines quadratisches Bild. Fotos bleiben auf dem Gerät.": "In the “Scan” tab you read QR codes and barcodes. One of your own labels opens the raw material immediately. A foreign code, such as a packaging barcode, can be assigned to a raw material or used to create a new one. With “Take photo” or “Photo from gallery” you give a raw material a small square picture. Photos stay on the device.", "Unter Mehr › Sicherung speicherst du eine Datei mit allen Daten inklusive Fotos. Mache das regelmäßig und vor einem Handywechsel. Zum Wiederherstellen wählst du Mehr › Import und die Datei. Mit dem Import kannst du auch eine Tabelle (CSV) einlesen. Sie braucht Überschriften, mindestens „Name“, gern auch INCI, Menge, Einheit, Preis, Quelle oder EAN. Doppelte Einträge werden übersprungen, vor dem Einlesen siehst du eine Vorschau.": "Under More › Backup you save a file with all data including photos. Do this regularly and before changing phones. To restore, choose More › Import and the file. Import can also read a table (CSV). It needs headings, at least “Name”, optionally INCI, quantity, unit, price, source or EAN. Duplicates are skipped, and you see a preview before importing.", "Unter Mehr › Katalog aktualisieren holt die App neue Katalogeinträge und INCI-Korrekturen. Deine Mengen, Preise, Texte und Fotos werden dabei nie verändert. Hast du eine INCI selbst geändert, fragt die App nach.": "Under More › Update catalog the app fetches new catalog entries and INCI corrections. Your quantities, prices, texts and photos are never changed. If you changed an INCI yourself, the app asks.", "Kamera geht nicht: Erlaube den Kamerazugriff in den Browser- oder App-Einstellungen oder gib den Code von Hand ein. Die Daten liegen im Browser dieses Geräts: Lösche keine Browserdaten, ohne vorher eine Sicherung zu machen. Zum Installieren wählst du im Browsermenü „Zum Startbildschirm hinzufügen“.": "Camera does not work: allow camera access in the browser or app settings, or enter the code by hand. The data lives in this device’s browser: do not delete browser data without making a backup first. To install, choose “Add to home screen” in the browser menu.", "Bestandstabelle exportieren": "Export stock table", "Aufbau": "Layout", "sortiert und gruppiert je Lieferant": "sorted and grouped by supplier", "eine Liste, alphabetisch": "one list, alphabetical", "Format": "Format", "Excel (.xlsx)": "Excel (.xlsx)", "empfohlen, öffnet sich überall korrekt": "recommended, opens correctly everywhere", "CSV (.csv)": "CSV (.csv)", "für Tabellen-Programme, UTF-8 mit Semikolon": "for spreadsheet programs, UTF-8 with semicolon", "Text": "Text", "zum Kopieren oder Teilen, z. B. per Messenger": "to copy or share, e.g. via messenger", "Nach Lieferant oder als ganze Liste": "By supplier or as one list", "Bestandstabelle": "Stock table", "Mit Filter, als Excel, CSV oder Text": "With filter, as Excel, CSV or text", "Sicherung der ganzen App": "Backup of the whole app", "Zum Wiederherstellen, z. B. auf einem neuen Handy": "For restoring, e.g. on a new phone", "Welche Rohstoffe?": "Which raw materials?", "Alle (auch aufgebrauchte)": "All (including used up)", "Nur mit Bestand": "Only with stock", "Nur knappe (unter Mindestmenge)": "Only low (below minimum)", "Läuft in 30 Tagen ab oder abgelaufen": "Expires within 30 days or expired", "Nur abgelaufene": "Only expired", "Nur aufgebrauchte": "Only used up", "Preis ab (€)": "Price from (€)", "Preis bis (€)": "Price to (€)", "Der Preis bezieht sich auf den zuletzt erfassten Bezug.": "The price refers to the most recently recorded source.", "Exportieren": "Export", "Kein Rohstoff passt zum Filter": "No raw material matches the filter", "Bitte mindestens eine Spalte wählen": "Please choose at least one column", "Einkaufsliste leer": "Shopping list empty", "Es gibt nichts zu exportieren.": "There is nothing to export.", "Excel-Datei gespeichert": "Excel file saved", "CSV-Datei gespeichert": "CSV file saved", "Teilen": "Share", "Sicherung jetzt speichern": "Save backup now", "Noch keine Sicherung erstellt.": "No backup created yet.", "Sicherung im Ordner „Downloads“ gespeichert": "Backup saved in the “Downloads” folder", "Aus Galerie": "From gallery", "Wo liegt meine Sicherung?": "Where is my backup?", "Export als Excel, CSV oder Text": "Export as Excel, CSV or text", "Die Sicherung ist eine .json-Datei und landet im Download-Ordner deines Handys. Die Daten der App selbst liegen nur im Browser dieses Handys und sind weg, wenn du die App deinstallierst oder Browserdaten löschst. Kopiere die Sicherungsdatei deshalb nach außen, zum Beispiel in dein Google Drive, per E-Mail an dich selbst oder auf den PC. Auf einem neuen Handy installierst du die App, wählst Mehr › Import und die Datei und dann „Alles ersetzen“.": "The backup is a .json file and lands in your phone’s Downloads folder. The app’s data itself lives only in this phone’s browser and is gone if you uninstall the app or clear browser data. So copy the backup file elsewhere, for example to your Google Drive, by email to yourself or to your PC. On a new phone you install the app, choose More › Import and the file, then “Replace everything”.", "Unter Mehr › Export bekommst du die Einkaufsliste (nach Lieferant oder als ganze Liste) und die Bestandstabelle. Du wählst vorher das Format: Excel (empfohlen), CSV oder Text zum Kopieren und Teilen. Bei der Bestandstabelle filterst du, welche Rohstoffe und welche Spalten dabei sein sollen, zum Beispiel nur abgelaufene oder nur Rohstoffe über einem Preis. Das ist etwas anderes als die Sicherung, die immer die ganze App enthält.": "Under More › Export you get the shopping list (by supplier or as one list) and the stock table. You choose the format first: Excel (recommended), CSV or text to copy and share. For the stock table you filter which raw materials and columns to include, for example only expired ones or only raw materials above a price. This is different from the backup, which always contains the whole app.", "Aus Produktseite übernehmen": "Take from product page", "Produktseite einfügen": "Paste product page", "Text einer Lieferantenseite übernehmen": "Take over text from a supplier page", "Stammdaten": "Master data", "Auslesen": "Read", "Das wurde gefunden": "This was found", "Abgewählte Angaben werden nicht übernommen.": "Deselected items are not applied.", "Artikelnummer (beim Bezug)": "Article number (at source)", "Link (Quelle)": "Link (source)", "Preise": "Prices", "Lieferant für diese Preise": "Supplier for these prices", "Rohstoff anlegen": "Create raw material", "Übernommen – bitte kurz prüfen": "Applied – please check briefly", "Rohstoff angelegt – bitte kurz prüfen": "Raw material created – please check briefly", "Bitte einen Lieferanten für die Preise wählen oder die Preise abwählen.": "Please choose a supplier for the prices or deselect the prices.", "Es wurden keine verwertbaren Angaben gefunden. Kopiere bitte etwas mehr Text der Seite, z. B. mit Produktname, INCI und Preisen.": "No usable details found. Please copy more text from the page, e.g. with product name, INCI and prices.", "Öffne die Produktseite deines Lieferanten, kopiere den Text (oder die wichtigen Teile) und füge ihn hier ein. Die App liest nur Fakten aus: Name, INCI, Artikelnummer, Form und Preise. Beschreibungstexte werden nicht übernommen. Du siehst vorher eine Vorschau.": "Open your supplier’s product page, copy the text (or the important parts) and paste it here. The app only reads facts: name, INCI, article number, form and prices. Description texts are not taken over. You see a preview first.", "Achtung: Haltbarkeit abgelaufen": "Warning: expired", "Produktseite übernehmen": "Import product page", "Text einfügen oder Foto/Screenshot lesen": "Paste text or read a photo/screenshot", "Menge unter Mindestbestand": "Below minimum stock", "Menge über Mindestbestand": "Above minimum stock", "Menge in Ordnung": "Quantity OK", "Nicht vorrätig": "Out of stock", "Vorrätig": "In stock", "Kein Haltbarkeitsdatum": "No expiry date", "Eingabe": "Input", "EINGABE": "INPUT", "Code scannen": "Scan code", "Barcode oder QR-Code von Etikett oder Verpackung": "Barcode or QR code from a label or packaging", "Produktseite lesen": "Read product page", "Foto, Screenshot oder Text einer Lieferantenseite": "Photo, screenshot or text of a supplier page", "Codes scannen und Produktseiten lesen. Neue Rohstoffe legst du mit „+“ an.": "Scan codes and read product pages. Add new raw materials with “+”.", "Eingabe und Fotos": "Input and photos", "Im Tab „Eingabe“ scannst du QR- und Barcodes und liest Produktseiten. Ein eigenes Etikett öffnet sofort den Rohstoff. Einen fremden Code, etwa den Barcode einer Verpackung, kannst du einem Rohstoff zuordnen oder dafür einen neuen anlegen. Ein Bild für einen Rohstoff änderst du auf der Artikelseite über das Kamera-Symbol, für einen neuen Rohstoff nimmst du es mit „+“ › „Mit Foto anlegen“ auf. Fotos bleiben auf dem Gerät.": "In the “Input” tab you scan QR codes and barcodes and read product pages. Your own label opens the raw material right away. A foreign code, such as a packaging barcode, can be assigned to a raw material or used to create a new one. You change a raw material’s picture on its page with the camera icon; for a new one, take it with “+” › “Add with photo”. Photos stay on the device.", "Mit Foto anlegen": "Add with photo", "Foto ändern": "Change photo", "Hol Listen in dein Lager. Neue Rohstoffe werden angelegt, bei vorhandenen kommen neue Preise dazu. Du siehst vorher eine Vorschau, es wird nichts ohne Bestätigung geändert.": "Bring lists into your stock. New raw materials are created, existing ones get new prices. You see a preview first; nothing changes without your confirmation.", "Diese Formate kann die App lesen": "Formats the app can read", "Typische Quellen": "Typical sources", "Diese Spalten werden erkannt": "Recognised columns", "Name, INCI, Kategorie, Menge, Einheit, Preis, Datum, Lieferant, EAN, MHD, Verwendung, Notiz. Die Überschriften müssen nicht exakt so heißen.": "Name, INCI, category, quantity, unit, price, date, supplier, EAN, expiry, use, note. Headings do not have to match exactly.", "Eine Sicherung der ganzen App lädst du unter Mehr › Sicherung.": "You load a backup of the whole app under More › Backup.", "Datei auswählen": "Choose file", "Vorlage (CSV)": "Template (CSV)", "Vorlage gespeichert": "Template saved", "Tabellen zum Bestellen, Weitergeben oder Weiterarbeiten. Formate: Excel, CSV, PDF oder Text zum Teilen per E-Mail oder Messenger.": "Tables for ordering, sharing or further work. Formats: Excel, CSV, PDF or text to share by e-mail or messenger.", "Mit Filter und Spaltenauswahl": "With filter and column choice", "Eine Sicherung der ganzen App speicherst du unter Mehr › Sicherung.": "You save a backup of the whole app under More › Backup.", "öffnet sich überall korrekt": "opens correctly everywhere", "UTF-8 mit Semikolon, für Tabellen-Programme": "UTF-8 with semicolon, for spreadsheet programs", "PDF": "PDF", "zum Ansehen, Drucken oder Senden": "to view, print or send", "kopieren oder per E-Mail und Messenger teilen": "copy or share by e-mail and messenger", "Drucken nicht möglich": "Printing not possible", "Deine Daten liegen nur auf diesem Gerät, es gibt keine Cloud. Ein Backup ist eine einzige Datei mit allem, auch den Fotos. Du brauchst sie für ein neues Handy oder nach dem Löschen der App-Daten.": "Your data is only on this device; there is no cloud. A backup is a single file with everything, photos included. You need it for a new phone or after clearing the app data.", "Backup speichern": "Save backup", "Datei im Ordner „Downloads“, danach an einen sicheren Ort kopieren": "File in the “Downloads” folder; then copy it to a safe place", "Backup laden": "Load backup", "Stellt den Stand einer Sicherungsdatei wieder her (.json)": "Restores the state of a backup file (.json)", "Letzte Änderung rückgängig": "Undo last change", "Gefahrenbereich": "Danger zone", "Speichere vorher ein Backup": "Save a backup first", "Erhältliche Packungen": "Available pack sizes", "Rückgängig": "Undo", "Noch keine Tabelle?": "No table yet?", "Vorlage herunterladen": "Download template", "Die Vorlage ist eine leere CSV-Datei mit den richtigen Spalten und einer Beispielzeile. Du speicherst sie, füllst sie in Excel oder Google Sheets aus und wählst sie dann mit „Datei auswählen“. Beim Speichern der Vorlage wird nichts importiert.": "The template is an empty CSV file with the right columns and an example row. Save it, fill it in with Excel or Google Sheets, then pick it with “Choose file”. Saving the template imports nothing.", "Suche nach Name, INCI, Kategorie, Verwendung, Beschreibung oder Notiz": "Search by name, INCI, category, use, description or note", "Zurücksetzen": "Reset", "Ohne Menge": "No quantity", "Je mehr du einträgst, desto nützlicher werden dein Lager und später dein Katalog. Ab 80 % wird der Kreis grün.": "The more you enter, the more useful your stock and later your catalog become. The circle turns green from 8 es noch einmal.": "No se pudo cargar el módulo de lectura. Comprueba la conexión e inténtalo de nuevo.", "Lesen nicht möglich": "No se pudo leer", "Das Bild konnte nicht gelesen werden. Möglicherweise unterstützt dieses Gerät das Lesemodul nicht. Du kannst den Text stattdessen kopieren und einfügen.": "No se pudo leer la imagen. Puede que este dispositivo no admita el módulo. Puedes copiar y pegar el texto.", "Neuen Lieferanten anlegen …": "Añadir proveedor nuevo …", "+ Neuen Lieferanten anlegen …": "+ Añadir proveedor nuevo …", "– wählen –": "– elegir –", "Lieferanten": "Proveedores", "Neuer Lieferant": "Proveedor nuevo", "+ Lieferant hinzufügen": "+ Añadir proveedor", "Noch keine Lieferanten.": "Aún no hay proveedores.", "Versandkosten und Webseite je Lieferant. Neue legst du auch direkt bei der Bezugsquelle an.": "Gastos de envío y página web por proveedor. También puedes añadirlos directamente en la fuente de compra.", "Versandkosten (€)": "Gastos de envío (€)", "Kostenfrei ab (€)": "Envío gratis desde (€)", "Webseite (optional)": "Página web (opcional)", "Bitte einen Namen eingeben.": "Introduce un nombre.", "Diesen Lieferanten gibt es schon.": "Este proveedor ya existe.", "Lieferant entfernen": "Quitar proveedor", "Wird noch bei Rohstoffen verwendet": "Aún se usa en materias primas", "EAN / Barcode (optional)": "EAN / código de barras (opcional)", "EAN / Barcode": "EAN / código de barras", "Sicherung (Datei)": "Copia de seguridad (archivo)", "Alles inklusive Fotos, zum Wiederherstellen": "Todo, con fotos, para restaurar", "Bestandsliste (Tabelle)": "Lista de existencias (tabla)", "CSV für Excel oder Tabellen": "CSV para Excel u hojas de cálculo", "Sicherung gespeichert": "Copia guardada", "Tabelle gespeichert": "Tabla guardada", "Wähle bis zu 5 Rohstoffe, deren Preis du verfolgen willst. Tippe hier.": "Elige hasta 5 materias primas cuyo precio quieras seguir. Toca aquí.", "Änderung in %": "Cambio en %", "Rohstoff hinzufügen": "Añadir materia prima", "Noch kein Internetverbindung und versuche es später noch einmal.": "Ahora no hay actualización del catálogo disponible. Revisa tu conexión a internet e inténtalo más tarde.", "Katalog aktualisiert": "Catálogo actualizado", "Etiketten &amp; Druck": "Etiquetas e impresión", "Keine Rohstoffe": "Sin materias primas", "Lege zuerst Rohstoffe an, dann kannst du Etiketten drucken.": "Primero añade materias primas; luego podrás imprimir etiquetas.", "Größe": "Tamaño", "Vorschau": "Vista previa", "Rohstoffe wählen": "Elegir materias primas", "Keine": "Ninguna", "Noch nicht gedruckt": "Aún no impresas", "Danach als gedruckt markieren": "Marcar como impresa después", "Drucken": "Imprimir", "Bitte Rohstoffe auswählen": "Selecciona materias primas", "Klein 38×21 mm": "Pequeña 38×21 mm", "Mittel 48×25 mm": "Mediana 48×25 mm", "Groß 63×38 mm": "Grande 63×38 mm", "Der Druckdialog deines Geräts öffnet sich. Wähle dort „Tatsächliche Größe“ bzw. 100 %, damit die Etiketten maßgetreu bleiben.": "Se abre el diálogo de impresión de tu dispositivo. Elige allí „Tamaño real“ o 100 % para que las etiquetas mantengan su medida.", "Code lesen oder ein Bild für einen Rohstoff aufnehmen.": "Lee un código o toma una foto para una materia prima.", "Barcode / QR-Code": "Código de barras / QR", "Etikett oder Verpackung scannen": "Escanea una etiqueta o un envase", "Foto aufnehmen": "Tomar foto", "Als Bild für einen Rohstoff": "Como imagen de una materia prima", "Foto aus Galerie": "Foto de la galería", "Vorhandenes Bild zuordnen": "Asignar una imagen existente", "Code von Hand eingeben": "Introducir código a mano", "Artikelcode oder EAN": "Código de artículo o EAN", "Öffnen": "Abrir", "Unbekannter Code": "Código desconocido", "Dieser Code gehört noch zu keinem Rohstoff. Neu anlegen?": "Este código aún no pertenece a ninguna materia prima. ¿Crear una nueva?", "Neuen Rohstoff anlegen": "Crear materia prima nueva", "Vorhandenem Rohstoff zuordnen": "Asignar a una materia prima existente", "Zu welchem Rohstoff gehört der Code?": "¿A qué materia prima pertenece el código?", "Code gespeichert": "Código guardado", "Zu welchem Rohstoff?": "¿A qué materia prima?", "Das Bild wird für diesen Rohstoff verwendet.": "La imagen se usará para esta materia prima.", "Code in den Rahmen halten": "Sitúa el código dentro del marco", "Automatisches Scannen ist hier nicht möglich – bitte Code von Hand eingeben": "Aquí no se puede escanear automáticamente: introduce el código a mano", "Kamera nicht erlaubt oder nicht verfügbar": "Cámara no permitida o no disponible", "Ausschnitt wählen": "Elegir recorte", "Bild mit dem Finger verschieben, mit dem Regler vergrößern.": "Mueve la imagen con el dedo y amplíala con el control.", "Weiter": "Siguiente", "Bild nicht lesbar": "Imagen ilegible", "Foto gespeichert": "Foto guardada", "Foto entfernen": "Quitar foto", "Überblick": "Resumen", "Rohstoffe anlegen": "Añadir materias primas", "Bestand, Gefäße und Preise": "Existencias, recipientes y precios", "Etiketten drucken": "Imprimir etiquetas", "Scannen und Fotos": "Escanear y fotos", "Sichern und Import": "Copia e importación", "Wenn etwas nicht klappt": "Si algo no funciona", "INCIheinz ist dein privates Rohstofflager für Naturkosmetik: Du siehst, was da ist, was knapp wird, was bald abläuft und was du nachkaufen willst. Alle Daten bleiben auf diesem Gerät. Die App verwaltet nur dein Lager. Verwendung, Notizen und Beschreibungen schreibst du selbst.": "INCIheinz es tu almacén privado de materias primas para cosmética natural: ves lo que tienes, lo que se acaba, lo que caduca pronto y lo que quieres volver a comprar. Todos los datos se quedan en este dispositivo. La app solo gestiona tus existencias. El uso, las notas y las descripciones los escribes tú.", "Tippe in der Mitte auf „Neu“. Gib einen Namen ein und wähle einen Katalogtreffer, dann kommen INCI und Kategorie automatisch mit. Findest du nichts, legst du einen eigenen Rohstoff an. Die Menge darf leer bleiben. Alles Weitere ergänzt du auf der Rohstoff-Seite über den Stift.": "Toca „Nuevo“ en el centro. Escribe un nombre y elige una coincidencia del catálogo; el INCI y la categoría se añaden solos. Si no encuentras nada, crea tu propia materia prima. La cantidad puede quedar vacía. Lo demás lo añades en la página de la materia prima con el lápiz.", "Unter „Lager“ findest du den Regal-Check: Kategorie wählen, Regal durchgehen und antippen, was du hast. Die Mengen sind dann zunächst „?“ und werden nachgetragen, wenn du sie kennst.": "En „Almacén“ está la revisión de estantes: elige una categoría, repasa tu estante y toca lo que tienes. Las cantidades aparecen primero como „?“ y las añades cuando las sepas.", "Mit „Bestand ändern“ buchst du Zu- und Abgänge. Gefäße sind optional und nur nötig, wenn du Teilmengen getrennt verwalten willst. Bei „Bezugsquelle“ trägst du Lieferant, Preis und Menge ein. Jeder Preis wird mit Datum gespeichert, daraus entstehen Preisverlauf und Preis je 100 g/ml.": "Con „Cambiar existencias“ registras entradas y salidas. Los recipientes son opcionales y solo hacen falta si quieres gestionar cantidades parciales por separado. En „Fuente de compra“ introduces proveedor, precio y cantidad. Cada precio se guarda con fecha; así se crea el historial de precios y el precio por 100 g/ml.", "Unter Mehr › Einstellungen verwaltest du deine Lieferanten mit Versandkosten, Grenze für kostenfreien Versand und Webseite. Neue Lieferanten legst du auch direkt bei der Bezugsquelle an. Die Lieferanten aus bereits erfassten Preisen werden automatisch übernommen.": "En Más › Ajustes gestionas tus proveedores con gastos de envío, límite de envío gratis y página web. También puedes añadir proveedores nuevos directamente en la fuente de compra. Los proveedores de precios ya introducidos se adoptan automáticamente.", "Rohstoffe setzt du über „Auf Einkaufsliste“ oder die Kachel „Knapp“. Die Liste ist nach Lieferant gruppiert und zeigt Versandkosten. Mit „Gekauft“ wird die Menge im Lager gebucht.": "Añade materias primas con „A la lista de la compra“ o con el icono „Poco“. La lista está agrupada por proveedor y muestra los gastos de envío. Con „Comprado“ se registra la cantidad en el almacén.", "Unter Mehr › Etiketten & Druck wählst du eine Größe (klein 38×21, mittel 48×25, groß 63×38 mm) und die Rohstoffe. Auf jedem Etikett stehen QR-Code, Artikelcode, Name und INCI. Gedruckt wird über den Druckdialog deines Geräts, am besten mit „Tatsächliche Größe“ auf Etikettenbogen oder Papier zum Ausschneiden.": "En Más › Etiquetas e impresión eliges un tamaño (pequeña 38×21, mediana 48×25, grande 63×38 mm) y las materias primas. Cada etiqueta lleva código QR, código de artículo, nombre e INCI. Se imprime con el diálogo de impresión del dispositivo, mejor con „Tamaño real“ en hojas de etiquetas o papel para recortar.", "Im Tab „Scannen“ liest du QR- und Barcodes. Ein eigenes Etikett öffnet sofort den Rohstoff. Einen fremden Code, etwa den Barcode einer Verpackung, kannst du einem Rohstoff zuordnen oder dafür einen neuen anlegen. Mit „Foto aufnehmen“ oder „Foto aus Galerie“ gibst du einem Rohstoff ein kleines quadratisches Bild. Fotos bleiben auf dem Gerät.": "En la pestaña „Escanear“ lees códigos QR y de barras. Una etiqueta propia abre la materia prima al instante. Un código ajeno, por ejemplo el de un envase, puedes asignarlo a una materia prima o crear una nueva. Con „Tomar foto“ o „Foto de la galería“ das a una materia prima una pequeña imagen cuadrada. Las fotos se quedan en el dispositivo.", "Unter Mehr › Sicherung speicherst du eine Datei mit allen Daten inklusive Fotos. Mache das regelmäßig und vor einem Handywechsel. Zum Wiederherstellen wählst du Mehr › Import und die Datei. Mit dem Import kannst du auch eine Tabelle (CSV) einlesen. Sie braucht Überschriften, mindestens „Name“, gern auch INCI, Menge, Einheit, Preis, Quelle oder EAN. Doppelte Einträge werden übersprungen, vor dem Einlesen siehst du eine Vorschau.": "En Más › Copia guardas un archivo con todos los datos, fotos incluidas. Hazlo con regularidad y antes de cambiar de móvil. Para restaurar, elige Más › Importar y el archivo. La importación también lee tablas (CSV). Necesita encabezados, como mínimo „Name“, y opcionalmente INCI, cantidad, unidad, precio, fuente o EAN. Los duplicados se omiten y antes de importar ves una vista previa.", "Unter Mehr › Katalog aktualisieren holt die App neue Katalogeinträge und INCI-Korrekturen. Deine Mengen, Preise, Texte und Fotos werden dabei nie verändert. Hast du eine INCI selbst geändert, fragt die App nach.": "En Más › Actualizar catálogo la app descarga entradas nuevas e correcciones de INCI. Tus cantidades, precios, textos y fotos nunca se modifican. Si cambiaste un INCI tú mismo, la app pregunta.", "Kamera geht nicht: Erlaube den Kamerazugriff in den Browser- oder App-Einstellungen oder gib den Code von Hand ein. Die Daten liegen im Browser dieses Geräts: Lösche keine Browserdaten, ohne vorher eine Sicherung zu machen. Zum Installieren wählst du im Browsermenü „Zum Startbildschirm hinzufügen“.": "La cámara no funciona: permite el acceso a la cámara en los ajustes del navegador o de la app, o introduce el código a mano. Los datos están en el navegador de este dispositivo: no borres los datos del navegador sin hacer antes una copia. Para instalarla, elige „Añadir a la pantalla de inicio“ en el menú del navegador.", "Bestandstabelle exportieren": "Exportar tabla de existencias", "Aufbau": "Estructura", "sortiert und gruppiert je Lieferant": "ordenada y agrupada por proveedor", "eine Liste, alphabetisch": "una lista, alfabética", "Format": "Formato", "Excel (.xlsx)": "Excel (.xlsx)", "empfohlen, öffnet sich überall korrekt": "recomendado, se abre bien en todas partes", "CSV (.csv)": "CSV (.csv)", "für Tabellen-Programme, UTF-8 mit Semikolon": "para programas de hojas de cálculo, UTF-8 con punto y coma", "Text": "Texto", "zum Kopieren oder Teilen, z. B. per Messenger": "para copiar o compartir, p. ej. por mensajería", "Nach Lieferant oder als ganze Liste": "Por proveedor o como una sola lista", "Bestandstabelle": "Tabla de existencias", "Mit Filter, als Excel, CSV oder Text": "Con filtro, como Excel, CSV o texto", "Sicherung der ganzen App": "Copia de seguridad de toda la app", "Zum Wiederherstellen, z. B. auf einem neuen Handy": "Para restaurar, p. ej. en un móvil nuevo", "Welche Rohstoffe?": "¿Qué materias primas?", "Alle (auch aufgebrauchte)": "Todas (también las agotadas)", "Nur mit Bestand": "Solo con existencias", "Nur knappe (unter Mindestmenge)": "Solo las escasas (bajo el mínimo)", "Läuft in 30 Tagen ab oder abgelaufen": "Caduca en 30 días o ya caducada", "Nur abgelaufene": "Solo caducadas", "Nur aufgebrauchte": "Solo agotadas", "Preis ab (€)": "Precio desde (€)", "Preis bis (€)": "Precio hasta (€)", "Der Preis bezieht sich auf den zuletzt erfassten Bezug.": "El precio se refiere a la última compra registrada.", "Exportieren": "Exportar", "Kein Rohstoff passt zum Filter": "Ninguna materia prima coincide con el filtro", "Bitte mindestens eine Spalte wählen": "Elige al menos una columna", "Einkaufsliste leer": "Lista de la compra vacía", "Es gibt nichts zu exportieren.": "No hay nada que exportar.", "Excel-Datei gespeichert": "Archivo Excel guardado", "CSV-Datei gespeichert": "Archivo CSV guardado", "Teilen": "Compartir", "Sicherung jetzt speichern": "Guardar copia ahora", "Noch keine Sicherung erstellt.": "Aún no se ha creado ninguna copia.", "Sicherung im Ordner „Downloads“ gespeichert": "Copia guardada en la carpeta „Descargas“", "Aus Galerie": "De la galería", "Wo liegt meine Sicherung?": "¿Dónde está mi copia de seguridad?", "Export als Excel, CSV oder Text": "Exportar como Excel, CSV o texto", "Die Sicherung ist eine .json-Datei und landet im Download-Ordner deines Handys. Die Daten der App selbst liegen nur im Browser dieses Handys und sind weg, wenn du die App deinstallierst oder Browserdaten löschst. Kopiere die Sicherungsdatei deshalb nach außen, zum Beispiel in dein Google Drive, per E-Mail an dich selbst oder auf den PC. Auf einem neuen Handy installierst du die App, wählst Mehr › Import und die Datei und dann „Alles ersetzen“.": "La copia es un archivo .json y se guarda en la carpeta de descargas del móvil. Los datos de la app solo están en el navegador de este móvil y se pierden si desinstalas la app o borras los datos del navegador. Por eso copia el archivo a otro sitio, por ejemplo a tu Google Drive, por correo a ti mismo o al PC. En un móvil nuevo instalas la app, eliges Más › Importar y el archivo, y luego „Reemplazarlo todo“.", "Unter Mehr › Export bekommst du die Einkaufsliste (nach Lieferant oder als ganze Liste) und die Bestandstabelle. Du wählst vorher das Format: Excel (empfohlen), CSV oder Text zum Kopieren und Teilen. Bei der Bestandstabelle filterst du, welche Rohstoffe und welche Spalten dabei sein sollen, zum Beispiel nur abgelaufene oder nur Rohstoffe über einem Preis. Das ist etwas anderes als die Sicherung, die immer die ganze App enthält.": "En Más › Exportar obtienes la lista de la compra (por proveedor o como una lista) y la tabla de existencias. Primero eliges el formato: Excel (recomendado), CSV o texto para copiar y compartir. En la tabla de existencias filtras qué materias primas y columnas incluir, por ejemplo solo caducadas o solo por encima de un precio. Es distinto de la copia de seguridad, que siempre contiene toda la app.", "Aus Produktseite übernehmen": "Tomar de la página del producto", "Produktseite einfügen": "Pegar página del producto", "Text einer Lieferantenseite übernehmen": "Usar el texto de la página de un proveedor", "Stammdaten": "Datos básicos", "Auslesen": "Leer", "Das wurde gefunden": "Esto se encontró", "Abgewählte Angaben werden nicht übernommen.": "Lo desmarcado no se aplica.", "Artikelnummer (beim Bezug)": "Número de artículo (en la compra)", "Link (Quelle)": "Enlace (fuente)", "Preise": "Precios", "Lieferant für diese Preise": "Proveedor para estos precios", "Rohstoff anlegen": "Crear materia prima", "Übernommen – bitte kurz prüfen": "Aplicado: revísalo un momento", "Rohstoff angelegt – bitte kurz prüfen": "Materia prima creada: revísala un momento", "Bitte einen Lieferanten für die Preise wählen oder die Preise abwählen.": "Elige un proveedor para los precios o desmarca los precios.", "Es wurden keine verwertbaren Angaben gefunden. Kopiere bitte etwas mehr Text der Seite, z. B. mit Produktname, INCI und Preisen.": "No se encontraron datos útiles. Copia algo más de texto de la página, p. ej. con nombre del producto, INCI y precios.", "Öffne die Produktseite deines Lieferanten, kopiere den Text (oder die wichtigen Teile) und füge ihn hier ein. Die App liest nur Fakten aus: Name, INCI, Artikelnummer, Form und Preise. Beschreibungstexte werden nicht übernommen. Du siehst vorher eine Vorschau.": "Abre la página del producto de tu proveedor, copia el texto (o las partes importantes) y pégalo aquí. La app solo lee datos: nombre, INCI, número de artículo, forma y precios. Los textos descriptivos no se copian. Antes verás una vista previa.", "Achtung: Haltbarkeit abgelaufen": "Atención: caducado", "Produktseite übernehmen": "Importar página del producto", "Text einfügen oder Foto/Screenshot lesen": "Pegar texto o leer foto/captura", "Menge unter Mindestbestand": "Por debajo del mínimo", "Menge über Mindestbestand": "Por encima del mínimo", "Menge in Ordnung": "Cantidad correcta", "Nicht vorrätig": "Sin existencias", "Vorrätig": "En existencias", "Kein Haltbarkeitsdatum": "Sin fecha de caducidad", "Eingabe": "Entrada", "EINGABE": "ENTRADA", "Code scannen": "Escanear código", "Barcode oder QR-Code von Etikett oder Verpackung": "Código de barras o QR de etiqueta o envase", "Produktseite lesen": "Leer página del producto", "Foto, Screenshot oder Text einer Lieferantenseite": "Foto, captura o texto de la página de un proveedor", "Codes scannen und Produktseiten lesen. Neue Rohstoffe legst du mit „+“ an.": "Escanea códigos y lee páginas de producto. Añade materias nuevas con «+».", "Eingabe und Fotos": "Entrada y fotos", "Im Tab „Eingabe“ scannst du QR- und Barcodes und liest Produktseiten. Ein eigenes Etikett öffnet sofort den Rohstoff. Einen fremden Code, etwa den Barcode einer Verpackung, kannst du einem Rohstoff zuordnen oder dafür einen neuen anlegen. Ein Bild für einen Rohstoff änderst du auf der Artikelseite über das Kamera-Symbol, für einen neuen Rohstoff nimmst du es mit „+“ › „Mit Foto anlegen“ auf. Fotos bleiben auf dem Gerät.": "En la pestaña «Entrada» escaneas códigos QR y de barras y lees páginas de producto. Una etiqueta propia abre la materia al instante. Un código ajeno, como el de un envase, puedes asignarlo a una materia o crear una nueva. La imagen de una materia la cambias en su página con el icono de la cámara; para una nueva, hazla con «+» › «Añadir con foto». Las fotos se quedan en el dispositivo.", "Mit Foto anlegen": "Añadir con foto", "Foto ändern": "Cambiar foto", "Hol Listen in dein Lager. Neue Rohstoffe werden angelegt, bei vorhandenen kommen neue Preise dazu. Du siehst vorher eine Vorschau, es wird nichts ohne Bestätigung geändert.": "Trae listas a tu almacén. Las materias nuevas se crean y las existentes reciben precios nuevos. Antes ves una vista previa; nada cambia sin tu confirmación.", "Diese Formate kann die App lesen": "Formatos que la app puede leer", "Typische Quellen": "Fuentes habituales", "Diese Spalten werden erkannt": "Columnas reconocidas", "Name, INCI, Kategorie, Menge, Einheit, Preis, Datum, Lieferant, EAN, MHD, Verwendung, Notiz. Die Überschriften müssen nicht exakt so heißen.": "Nombre, INCI, categoría, cantidad, unidad, precio, fecha, proveedor, EAN, caducidad, uso, nota. Los encabezados no tienen que coincidir exactamente.", "Eine Sicherung der ganzen App lädst du unter Mehr › Sicherung.": "Una copia de toda la app se carga en Más › Copia de seguridad.", "Datei auswählen": "Elegir archivo", "Vorlage (CSV)": "Plantilla (CSV)", "Vorlage gespeichert": "Plantilla guardada", "Tabellen function score(f,terms){let tot=0;for(const t of terms){let b=0;const L=t.length;
const nm=String(f.n||'').toLowerCase();
if(nm.startsWith(t))b=100;else if(wst(f.n,t))b=80;else if(wst(f.a,t))b=60;
else if(L>=2&&L<=5&&inits(f).includes(t))b=55;else if(ABBR[t]&&String(f.i||'').toLowerCase().includes(ABBR[t]))b=55;else if(L>=3&&wst(f.i,t))b=50;else if(L>=3&&wst(f.k,t))b=20;
else if(L>=3&&(wst(f.v,t)||wst(f.b,t)||wst(f.z,t)))b=10;else if(L>=4&&((f.v||'')+(f.b||'')+(f.z||'')).toLowerCase().includes(t))b=6;

function used(id){const i=getI(id);i.unk=false;i.total=0;i.vessels.forEach(v=>v.amount=0);save();draw();toast('Als aufgebraucht markiert')}
function parseInci(text){const t=String(text||'');const m=t.match(/(?:INCI(?:[- ](?:Deklaration|Bezeichnung|Name|Liste))?|Inhaltsstoffe|Ingredients|Zusammensetzung)\s*[:：]\s*([^\n]+)/i);return m?m[1].replace(/https?:\/\/\S+/g,'').replace(/\s+/g,' ').trim().replace(/[.;]+$/,''):''}

openSheet(`<h2>INCI aus Text übernehmen</h2><div class="hint" style="margin:0 0 8px">Kopiere den Text der Produktseite oder nur die Zeile mit den Inhaltsstoffen und füge ihn hier ein. Gesucht wird nach „INCI:“, „Inhaltsstoffe:“ oder „Ingredients:“. Bitte das Ergebnis kurz prüfen.</div><textarea id="pt" rows="6" style="width:100%;border:1px solid var(--line);border-radius:12px;padding:10px;font:inherit" placeholder="Text hier einfügen"></textarea><div class="err" id="er"></div><div class="btns"><button class="btn" id="pg">Übernehmen</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`);
$('#pg').onclick=()=>{const r=parseInci(val('pt'));if(!r){$('#er').textContent='Keine INCI-Zeile gefunden. Bitte von Hand eintragen.';return}closeSheet();$('#f_inci').value=r;$('#f_ok').checked=false;dirty();toast('INCI übernommen – bitte prüfen')}}
function sheetMenge(id){const i=getI(id);const u=pickU(i.total,i.kind);openSheet(`<h2>Bestand ändern</h2>
<div class="two"><label class="fld"><span>Gesamtmenge</span><input id="f1" inputmode="decimal" value="${nf(i.total/U[u].f,3)}"></label><label class="fld u"><span>Einheit</span><select id="f2">${allUnits(u)}</select></label></div>
<div class="hint">Einheiten: Feststoff (mg, g, kg), Flüssigkeit (ml, l), Länge (mm, cm), Stück oder Tropfen.</div>
<div class="err" id="er"></div><div class="btns"><button class="btn" onclick="saveMenge('${id}')">Speichern</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}
function saveMenge(id){const i=getI(id);let u=val('f2');let t=num(val('f1'));{const c=densC(i,t,u);if(c){t=c.n;u=c.u}}if(t==null||t<0){$('#er').textContent='Bitte eine Menge eingeben.';return}
const nk=U[u].k;if(nk!==i.kind&&i.vessels.length){$('#er').textContent='Die Einheitenart lässt sich nicht ändern, solange Gefäße angelegt sind. Bitte zuerst die Gefäße entfernen.';return}
const tb=toB(t,u);
const chg=nk!==i.kind;if(chg){i.kind=nk;i.min=0;i.bezug.forEach(b=>b.kind=nk)}i.total=tb;i.unk=false;save();draw();if(chg)toast('Preise bitte prüfen')}
/* ---------- Gefäße ---------- */
let VS={typ:'dose',ort:''};
const ortBtn=()=>`<button type="button" class="selbtn" id="vo" onclick="pickOrt()"><span>${esc(VS.ort||'–')}</span><span style="color:var(--sub)">▾</span></button>`;
function pickOrt(){pick('Lagerort',[['','– kein Lagerort –']].concat(S.orte.map(o=>[o,o])),VS.ort,v=>{VS.ort=v;$('#vo').innerHTML=`<span>${esc(v||'–')}</span><span style="color:var(--sub)">▾</span>`})}
function sheetVessel(id,vid){const i=getI(id);const v=vid?i.vessels.find(x=>x.id===vid):null;
if(v){VS.ort=v.ort||'';const u=pickU(v.cap,i.kind);openSheet(`<h2>${vname(v)}</h2><div class="s" style="margin-bottom:6px">Nenninhalt ${fmt(v.cap,i.kind)}</div>
<label class="fld"><span>Füllstand (${u})</span><input id="fz" inputmode="decimal" value="${nf(v.amount/U[u].f,3)}"></label>
<input type="range" id="fr" min="0" max="${v.cap/U[u].f}" step="${v.cap/U[u].f>=20?1:.1}" value="${v.amount/U[u].f}" style="margin-top:12px">
<div class="fld"><span>Lagerort</span>${ortBtn()}</div>
<div class="hint">Wenn du den Füllstand änderst, passt sich der Gesamtbestand an.</div>
<div class="err" id="er"></div><div class="btns"><button class="btn" onclick="saveFill('${id}','${vid}','${u}')">Speichern</button><button class="btn danger" onclick="delVessel('${id}','${vid}')">Gefäß entfernen</button></div><div class="hint">Beim Entfernen bleibt der Inhalt im Vorrat.</div>`);
$('#fr').oninput=e=>$('#fz').value=nf(e.target.value,3);$('#fz').oninput=e=>{const n=num(e.target.value);if(n!=null)$('#fr').value=n};return}
const u=defUnit(i.kind);VS.typ=i.kind==='p'?'stueck':'dose';VS.ort='';
openSheet(`<h2>Gefäß hinzufügen</h2><div class="vt" id="vt">${Object.keys(VT).map(k=>`<button type="button" data-t="${k}" class="${k===VS.typ?'on':''}">${vic(k,'currentColor',26)}${VT[k].n}</button>`).join('')}</div>
<div class="two" style="align-items:end"><label class="fld"><span>Anzahl</span><input id="vn" inputmode="numeric" value="1"></label><label class="fld"><span>Nenninhalt</span><input id="vc" inputmode="decimal" placeholder="200"></label><label class="fld u" style="flex:0 0 28%"><span>Einheit</span><select id="vu">${unitSelD(i,u)}</select></label></div>
<label class="fld"><span>Aktueller Füllstand (je Gefäß)</span><input id="vf" inputmode="decimal" placeholder="voll"></label><input type="range" id="vr" min="0" max="100" value="100" style="margin-top:10px">
<div class="s" style="margin-top:2px">Leer lassen = voll. Der Regler setzt den Füllstand in Prozent.</div>
<div class="fld"><span>Lagerort</span>${ortBtn()}</div>
<div class="hint">Der Inhalt der neuen Gefäße wird zum Gesamtbestand addiert.</div>
<div class="err" id="er"></div><div class="btns"><button class="btn" onclick="saveVessel('${id}')">Speichern</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`);
document.querySelectorAll('#vt button').forEach(b=>b.onclick=()=>{VS.typ=b.dataset.t;document.querySelectorAll('#vt button').forEach(x=>x.classList.toggle('on',x===b))});
$('#vr').oninput=e=>{const c=num(val('vc'));if(c>0)$('#vf').value=nf(c*e.target.value/100,3);else $('#vf').value=''}}
function saveVessel(id){const i=getI(id);const n=Math.max(1,Math.round(num(val('vn'))||1));const u=val('vu');const c=num(val('vc'));if(!(c>0)){$('#er').textContent='Bitte den Nenninhalt eingeben.';return}
const cap=toB(c,u);let f=val('vf').trim()===''?cap:toB(num(val('vf'))||0,u);if(f>cap+1e-9){$('#er').textContent='Der Füllstand ist größer als der Nenninhalt.';return}
i.unk=false;i.total+=n*f;
let nr=Math.max(0,...i.vessels.filter(v=>v.typ===VS.typ).map(v=>v.nr));for(let k=0;k<n;k++)i.vessels.push({id:uid(),typ:VS.typ,nr:++nr,cap,amount:f,ort:VS.ort});
save();draw();toast(n+(n>1?' Gefäße':' Gefäß')+' hinzugefügt')}
function saveFill(id,vid,u){const i=getI(id);const v=i.vessels.find(x=>x.id===vid);const n=num(val('fz'));if(n==null||n<0){$('#er').textContent='Bitte einen Füllstand eingeben.';return}const nb=toB(n,u);if(nb>v.cap+1e-9){$('#er').textContent='Der Füllstand ist größer als der Nenninhalt ('+fmt(v.cap,i.kind)+').';return}
i.total=Math.max(0,i.total+(nb-v.amount));v.amount=nb;v.ort=VS.ort;save();draw()}
function delVessel(id,vid){const i=getI(id);i.vessels=i.vessels.filter(x=>x.id!==vid);save();draw()}
/* ---------- Bezug, Einkaufsliste ---------- */
function sheetBezug0(id,bid){const i=getI(id);const old=bid?i.bezug.find(x=>x.id===bid):null;const u=defUnit(i.kind);const ls=Object.keys(S.lief);
openSheet(`<h2>${old?'Neuer Preis / Bezug':'Bezugsquelle hinzufügen'}</h2>
<label class="fld"><span>Lieferant</span><select id="f1" onchange="if(this.value==='__n')newLiefFromBezug('${id}','${bid||''}')">${liefOpts(BZPRE||(old?old.lief:''))}</select></label>
<label class="fld"><span>Hersteller-/Artikelnummer (optional)</span><input id="f2" value="${esc(old?old.nr:'')}"></label>
<div class="two"><label class="fld"><span>Preis in €</span><input id="f3" inputmode="decimal"></label><label class="fld"><span>für Menge</span><input id="f4" inputmode="decimal" value="${old?nf(old.menge/U[u].f,3):''}"></label><label class="fld u" style="flex:0 0 28%"><span>Einheit</span><select id="f5">${allUnits(u)}</select></label></div>
<div class="err" id="er"></div><div class="btns"><button class="btn" onclick="saveBezug('${id}')">Speichern</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>
${old?tierHist(i,old):''}<div class="hint">Jeder Preis wird mit Datum gespeichert, so entsteht ein Preisverlauf. Die Einheit kann Gewicht, Volumen oder Stück sein. Der Preisvergleich berücksichtigt nur Angebote in der Einheitenart deines Bestands.</div>`)}
function saveBezug(id){const i=getI(id);const l=val('f1').trim(),p=num(val('f3')),m=num(val('f4'));if(!l||l==='__n'){$('#er').textContent='Bitte einen Lieferanten angeben.';return}if(!(p>=0)||!(m>0)){$('#er').textContent='Bitte Preis und Menge angeben.';return}
i.bezug.push({id:uid(),lief:l,nr:val('f2').trim(),preis:p,menge:bzM(i,m,val('f5')),kind:bzK(i,val('f5')),datum:today()});if(!S.lief[l])S.lief[l]={frei:0,versand:0};save();draw()}
function sheetShop(id){const i=getI(id);const u=defUnit(i.kind);const ls=[...new Set(i.bezug.map(x=>x.lief))];const ch=cheapest(i);
openSheet(`<h2>Auf Einkaufsliste</h2><div style="font-size:.9rem;font-weight:500;margin-bottom:2px">${esc(i.name)}</div><div class="s">Aktuell im Lager: ${fmt(i.total,i.kind)}. Du kannst den Rohstoff auch setzen, wenn noch etwas da ist.</div>
<div class="two"><label class="fld"><span>Menge</span><input id="f1" inputmode="decimal"></label><label class="fld u"><span>Einheit</span><select id="f2">${unitSelD(i,u)}</select></label></div>
<label class="fld"><span>Lieferant</span><select id="f3"><option value="">– offen –</option>${ls.map(l=>`<option ${ch&&ch.x.lief===l?'selected':''}>${esc(l)}</option>`).join('')}</select></label>
<div class="err" id="er"></div><div class="btns"><button class="btn" onclick="saveShop('${id}')">Hinzufügen</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}
function saveShop(id){const a=num(val('f1'));if(!(a>0)){$('#er').textContent='Bitte eine Menge eingeben.';return}S.shop.push({id:uid(),item:id,menge:densB(getI(id),a,val('f2')),lief:val('f3')});save();closeSheet();toast('Zur Einkaufsliste hinzugefügt')}
function sheetDel(id){const i=getI(id);openSheet(`<h2>Rohstoff entfernen?</h2><div style="font-size:.9rem">„${esc(i.name)}“ wird mit allen Gefäßen, Texten und Preisen aus deinem Lager gelöscht. Der Katalog bleibt unverändert.</div><div class="btns"><button class="btn danger" onclick="doDel('${id}')">Entfernen</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}
function doDel(id){S.items=S.items.filter(i=>i.id!==id);S.shop=S.shop.filter(s=>s.item!==id);save();tab('lager')}
/* ---------- Einkauf ---------- */
const cost=(s,l)=>{const i=getI(s.item);const b=tiers(i).filter(x=>x.lief===l&&x.kind===i.kind).sort((a,b)=>per(a).v-per(b).v)[0];return b?s.menge*b.preis/b.menge:null};
function einkauf(){const m=$('#main');const rows=S.shop.filter(s=>getI(s.item));
const sug=S.items.filter(needs);
const sugc=sug.length?`<div class="card" style="padding:12px 14px;margin-top:12px;display:flex;align-items:center;gap:12px">${ic('pie','var(--ambt)',24)}<div style="flex:1;font-size:.85rem"><b style="font-weight:600">${sug.length}</b> unter Mindestbestand, noch nicht auf der Liste</div><button class="btn" style="height:38px;font-size:.82rem" onclick="sheetSug()">Anzeigen</button></div>`:'';
const head=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="cap">${rows.length} Posten auf der Liste</span><span><button class="lnk" style="margin-right:16px" onclick="sheetExpShop()">Export</button><button class="lnk" onclick="sheetAddShop()">+ Rohstoff</button></span></div>
<div class="seg" style="margin-top:8px"><button class="${E.mode==='liste'?'on':''}" onclick="E.mode='liste';einkauf()">Alle Rohstoffe</button><button class="${E.mode==='lief'?'on':''}" onclick="E.mode='lief';einkauf()">Nach Lieferant</button></div>${sugc}`;
if(!rows.length){m.innerHTML=head+`<div class="card" style="padding:24px;text-align:center;color:var(--sub);margin-top:14px">Die Einkaufsliste ist leer.<br>Füge Rohstoffe über „+ Rohstoff“ oder auf der Rohstoff-Seite hinzu.</div>`;return}
let body='';
if(E.mode==='liste'){let est=0;
body=`<div class="card" style="margin-top:14px;overflow:hidden">${rows.map(s=>{const i=getI(s.item);const ls=[...new Set(i.bezug.map(x=>x.lief))];const c=s.lief?cost(s,s.lief):null;const pr=ls.map(x=>({x,c:cost(s,x)}));const valid=pr.filter(p=>p.c!=null).map(p=>p.c);const minc=valid.length?Math.min(...valid):Infinity;if(c!=null)est+=c;else if(isFinite(minc))est+=minc;
return `<div style="padding:12px 14px;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between;gap:8px"><div style="min-width:0;cursor:pointer" onclick="go('artikel','${i.id}')"><div style="font-weight:500;font-size:.92rem;overflow-wrap:anywhere">${esc(i.name)}</div><div class="s">${fmt(s.menge,i.kind)} · im Lager ${fmt(i.total,i.kind)}${c!=null?' · <b style="color:var(--txt);font-weight:600">'+eur(c)+'</b>':''}</div></div><div style="display:flex;flex:none"><button class="gk" onclick="sheetBought('${s.id}')">${ic('import','#fff',19)}Gekauft</button><button class="ib" style="width:34px;height:34px" onclick="delShop('${s.id}')" aria-label="Entfernen">${ic('trash','var(--sub)',22)}</button></div></div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${pr.map(p=>`<button class="pill ${p.x===s.lief?'on':''}" data-l="${esc(p.x)}" onclick="setLief('${s.id}',this.dataset.l)">${esc(p.x)}${p.c!=null?' · '+eur(p.c):''}${ls.length>1&&p.c===minc?' ✓':''}</button>`).join('')||'<span class="s">Kein Bezug erfasst</span>'}</div></div>`}).join('')}</div>
<div style="display:flex;justify-content:space-between;margin:12px 4px 0"><span class="s">Geschätzte Summe (ohne Versand)</span><b style="font-weight:600">${eur(est)}</b></div>`}
else{const groups={};rows.forEach(s=>{(groups[s.lief||'']=groups[s.lief||'']||[]).push(s)});const order=Object.keys(groups).sort((a,b)=>(a===''?1:0)-(b===''?1:0));
body=order.map(l=>{const g=groups[l];const sum=g.reduce((a,s)=>a+(cost(s,l)||0),0);const cfg=S.lief[l]||{frei:0,versand:0};let prog='';
if(l){if(cfg.frei>0){const rest=cfg.frei-sum;prog=`<div class="bar"><div style="width:${Math.min(100,sum/cfg.frei*100)}%"></div></div><div class="s" style="margin-top:6px;color:${rest>0?'var(--ambt)':'var(--pri)'}">${rest>0?`Noch ${eur(rest)} bis versandkostenfrei`:'Versandkostenfrei erreicht'}</div>`}else prog=`<div class="s" style="margin-top:6px">Versandregeln nicht hinterlegt</div>`}
const total=sum+(l&&cfg.frei>0&&sum<cfg.frei?cfg.versand:0);
return `<div class="card" style="margin-top:14px;overflow:hidden"><div style="padding:12px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center"><b style="font-weight:600">${l?esc(l):'Lieferant offen'}</b>${l?`<button class="lnk" data-l="${esc(l)}" onclick="sheetLief(this.dataset.l)">Versand ›</button>`:''}</div>
${g.map(s=>{const i=getI(s.item);const c=l?cost(s,l):null;return `<div style="padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px"><div style="font-size:.9rem;font-weight:500;min-width:0;overflow-wrap:anywhere">${esc(i.name)}<div class="s" style="font-weight:400">${fmt(s.menge,i.kind)}</div></div><div style="font-size:.88rem">${c!=null?eur(c):''}</div></div>`}).join('')}
<div style="padding:12px 14px"><div style="display:flex;justify-content:space-between"><span class="s">Summe${l&&cfg.frei>0&&sum<cfg.frei?' inkl. '+eur(cfg.versand)+' Versand':''}</span><b style="font-weight:600">${l?eur(total):''}</b></div>${prog}</div></div>`}).join('')}
m.innerHTML=head+body}
function sugAmount(i){return i.min>0?Math.max(i.min*2-i.total,i.min):(i.kind==='w'||i.kind==='v'?100:1)}
function sheetSug(){const sug=S.items.filter(needs);if(!sug.length){closeSheet();return}openSheet(`<h2>Unter Mindestbestand</h2><div class="s" style="margin-bottom:6px">Wähle aus, was auf die Einkaufsliste soll.</div>${sug.map(i=>`<label class="chk" style="padding:8px 0;border-bottom:1px solid var(--line);margin:0"><input type="checkbox" class="sg" value="${i.id}" checked><div style="flex:1;min-width:0"><div style="font-weight:500;overflow-wrap:anywhere">${esc(i.name)}</div><div class="s">${fmt(i.total,i.kind)}${i.min?' · Min. '+fmt(i.min,i.kind):''} · Vorschlag ${fmt(sugAmount(i),i.kind)}</div></div></label>`).join('')}<div class="btns"><button class="btn" onclick="addSelected()">Auf die Liste setzen</button></div>`)}
function addSelected(){const ids=[...document.querySelectorAll('.sg:checked')].map(e=>e.value);ids.forEach(id=>{const i=getI(id);const c=cheapest(i);S.shop.push({id:uid(),item:id,menge:sugAmount(i),lief:c?c.x.lief:''})});save();closeSheet();tab('einkauf');toast('Auf die Liste übernommen')}

function setLief(id,l){const s=S.shop.find(x=>x.id===id);s.lief=s.lief===l?'':l;save();einkauf()}
function delShop(id){S.shop=S.shop.filter(x=>x.id!==id);save();einkauf()}
function sheetLief(l){const c=S.lief[l]||{frei:0,versand:0};openSheet(`<h2>Versand: ${esc(l)}</h2><label class="fld"><span>Versandkostenfrei ab (€)</span><input id="f1" inputmode="decimal" value="${c.frei||''}"></label><label class="fld"><span>Versandkosten darunter (€)</span><input id="f2" inputmode="decimal" value="${c.versand||''}"></label><div class="btns"><button class="btn" id="sv">Speichern</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`);

function sheetAddShop(){openSheet(`<h2>Rohstoff zur Einkaufsliste</h2><input id="as" placeholder="Rohstoff im Lager suchen …" autocomplete="off" style="width:100%;height:46px;border:2px solid var(--pri);border-radius:12px;padding:0 14px;font:inherit"><div id="ah"></div>`);
const f=()=>{const q=val('as').trim().toLowerCase();const l=S.items.filter(i=>!q||i.name.toLowerCase().includes(q)).slice(0,8);$('#ah').innerHTML=l.map(i=>`<div class="hit" onclick="sheetShop('${i.id}')"><b>${esc(i.name)}</b><div class="s">${fmt(i.total,i.kind)} im Lager</div></div>`).join('')||'<div class="hint">Nichts gefunden.</div>'};$('#as').oninput=f;f()}
function sheetBought(sid){const s=S.shop.find(x=>x.id===sid);const i=getI(s.item);const u=pickU(s.menge,i.kind);openSheet(`<h2>Gekauft</h2><div style="font-size:.9rem;font-weight:500">${esc(i.name)}</div>
<div class="two"><label class="fld"><span>Gelieferte Menge</span><input id="b1" inputmode="decimal" value="${nf(s.menge/U[u].f,3)}"></label><label class="fld u"><span>Einheit</span><select id="b2">${unitSelD(i,u)}</select></label></div>
<label class="chk"><input type="checkbox" id="b3" checked> Zum Lagerbestand addieren</label><div class="hint">Setzt außerdem „Zuletzt bestellt“ auf heute und nimmt den Rohstoff von der Liste.</div>
<div class="btns"><button class="btn" onclick="doBought('${sid}')">Eintragen</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}

function crc32(u8){if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}let crc=-1;for(let i=0;i<u8.length;i++)crc=crc32.t[(crc^u8[i])&255]^(crc>>>8);return (crc^-1)>>>0}
function zipStore(files,mime){const enc=new TextEncoder();const parts=[],cd=[];let off=0;const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];

const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
parts.push(lh,nm,data);cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);off+=lh.length+nm.length+sz});
const cl=cd.reduce((a,b)=>a+b.length,0);const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cl),...u32(off),0,0]);

const xe=s=>String(s==null?'':s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function lineC(pts,h){if(!pts.length)return '';const w=300,pd=8;const xs=pts.map(p=>p.t),ys=pts.map(p=>p.v);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(x1===x0){x0-=864e5*15;x1+=864e5*15}if(y1===y0){y0*=.9;y1*=1.1}if(y1===y0){y0-=1;y1+=1}
const X=t=>pd+(t-x0)/(x1-x0)*(w-2*pd),Y=v=>h-pd-(v-y0)/(y1-y0)*(h-2*pd);return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block"><polyline points="${pts.map(p=>X(p.t)+','+Y(p.v)).join(' ')}" fill="none" stroke="#2D5A43" stroke-width="2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.2" fill="#fff" stroke="#2D5A43" stroke-width="1.8"/>`).join('')}</svg>`}

function pDate2(v){if(typeof v==='number'||/^\d{5}(\.\d+)?$/.test(String(v).trim())){const n=Math.floor(parseFloat(v));if(n>30000&&n<80000){const d=new Date(Date.UTC(1899,11,30)+n*864e5);return d.toISOString().slice(0,10)}}return pDate(v)}
const csvPlan0=csvPlan;
csvPlan=function(rows){const p=csvPlan0(rows);if(p.error)return p;
const head=rows[0].map(h=>FOLD(h).replace(/[^a-z0-9]/g,''));const col={};Object.keys(COLMAP).forEach(k=>{for(let i=0;i<head.length;i++)if(COLMAP[k].includes(head[i])&&col[k]==null)col[k]=i});
const byN={},byE={};S.items.forEach(i=>{byN[NK(i.name)]=i;if(i.ean)byE[i.ean]=i});
p.upd=[];p.dup=0;
for(let r=1;r<rows.length;r++){const row=rows[r];const g=k=>col[k]==null?'':String(row[col[k]]==null?'':row[col[k]]).trim();
const name=g('name');if(!name)continue;const ean=g('ean').replace(/\s+/g,'');const it=byN[NK(name)]||(ean&&byE[ean])||null;if(!it)continue;
const eh=g('einheit');const u=Object.keys(U).find(x=>FOLD(x)===FOLD(eh));const mg=pNum(g('menge'));const pr=pNum(g('preis').replace(/[€\s]/g,''));if(!u||!(mg>0)||pr==null)continue;
const q=g('quelle');const lief=q&&!/^https?:/i.test(q)?q:'Import';const dt=pDate2(col.datum==null?'':row[col.datum])||today();const kind=U[u].k;
if(kind!==it.kind){p.dup++;continue}
const m=toB(mg,u);const same=it.bezug.concat(p.upd.filter(x=>x.it===it).map(x=>x.b)).some(b=>b.lief===lief&&Math.round(b.menge*1000)===Math.round(m*1000)&&Math.abs(b.preis-pr)<0.005&&b.datum===dt);
if(same){p.dup++;continue}
p.upd.push({it,b:{id:uid(),lief,nr:'',preis:pr,menge:m,kind,datum:dt}})}
return p};

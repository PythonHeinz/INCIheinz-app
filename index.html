const OCRB=[['tesseract.min.js',0.05],['worker.min.js',0.11],['tesseract-core-simd-lstm.wasm.js',3.95]];const OCRL={deu:['deu.traineddata.gz',1.33],eng:['eng.traineddata.gz',2.95],spa:['spa.traineddata.gz',2.1]};
const ocrLangs=()=>({de:['deu','eng'],en:['eng','deu'],es:['spa','eng']})[S.lang]||['deu','eng'];
const ocrList=()=>OCRB.concat(ocrLangs().map(l=>OCRL[l]));
const OCR={get files(){return ocrList().map(x=>x[0])},get est(){return ocrList().map(x=>x[1])},get size(){return Math.round(ocrList().reduce((a,x)=>a+x[1],0)*10)/10}};
const ocrUrl=f=>new URL('ocr/'+f,location.href).href;
async function ocrHave(){try{if(!window.caches)return false;const c=await caches.open('inciheinz-ocr');for(const f of OCR.files)if(!await c.match(ocrUrl(f)))return false;return true}catch(e){return false}}
async function ocrFetchAll(prog){let done=0;const tot=OCR.est.reduce((a,b)=>a+b,0);for(let k=0;k<OCR.files.length;k++){const r=await fetch(ocrUrl(OCR.files[k]),{cache:'no-cache'});if(!r.ok)throw new Error('http '+r.status);const rd=r.clone().body.getReader();let got=0;for(;;){const x=await rd.read();if(x.done)break;got+=x.value.length;prog((done+Math.min(got/1048576,OCR.est[k]))/tot)}done+=OCR.est[k];prog(done/tot)}}
function ocrScript(){return new Promise((ok,no)=>{if(window.Tesseract)return ok();const s=document.createElement('script');s.src=ocrUrl('tesseract.min.js');s.onload=ok;s.onerror=()=>no(new Error('script'));document.head.appendChild(s)})}

function rzHave(z){const i=rzItem(z);if(!i)return z.cid?{k:'nein'}:{k:'frei'};if(i.unk)return {k:'unb',i};
let g=null;if(i.kind==='w')g=i.total;else if(i.kind==='v'&&i.dens>0)g=i.total*i.dens;if(g==null)return {k:'unb',i,dens:i.kind==='v'};return {k:'ok',g,i}}
function rzCheck(d,total){const sum=rzSum(d);const rows=[];let max=Infinity;const miss=[],low=[];
d.phasen.forEach((p,pi)=>p.z.forEach((z,zi)=>{const need=sum>0?(+z.g||0)/sum*total:0;const h=rzHave(z);let st='frei';
if(h.k==='ok'){st=h.g<=1e-9?'fehlt':h.g+1e-9<need?'knapp':'ok';if(z.g>0)max=Math.min(max,h.g/((+z.g)/sum));if(st==='fehlt')miss.push({z,need});else if(st==='knapp')low.push({z,need,fehlt:need-h.g})}
else if(h.k==='nein'){st='fehlt';miss.push({z,need})}else if(h.k==='unb')st=h.dens?'dens':'unb';
rows.push({z,pi,zi,need,have:h.k==='ok'?h.g:null,st,item:h.i||rzItem(z)})}));
return {rows,sum,miss,low,max:max===Infinity?null:max,ok:!miss.length&&!low.length}}

function rzBan(c){if(c.ok){const u=c.rows.filter(x=>x.st==='unb').length,dn=c.rows.filter(x=>x.st==='dens');return {cls:u?'':'ok',h:u?'Menge im Lager offen':'Mischbar mit deinem Lager',s:[c.max!=null?'Reicht für bis zu '+nf(Math.floor(c.max))+' g.':'',u?`Bei ${u} Zutat${u>1?'en':''} ist keine Menge eingetragen.`:'',dn.length?`Dichte fehlt bei: ${dn.map(x=>esc(x.item.name)).join(', ')}. Trag sie ein, dann wird die Menge geprüft.`:''].filter(Boolean).join('</div><div>')}}

<div class="s" style="margin-top:4px">Version ${vn} · ${dde(v.date.slice(0,10))}${nch?` · ${nch} ${nch===1?'Charge':'Chargen'}`:''}${v.st==='fav'?' · <b style="color:var(--pri)">Favorit</b>':v.st==='bad'?' · verworfen':''}</div>
${vn!==cur.n?`<div class="rz-old">Das ist eine ältere Version. <button class="lnk" onclick="rzOpen('${r.id}')">Zur aktuellen Version (v${cur.n})</button></div>`:''}
${v.note?`<div class="rz-note nm">${esc(v.note)}</div>`:''}

<div class="rz-lk" style="margin-top:6px"><button class="lnk" onclick="rzChgOf('${r.id}')">${nch?`Chargen (${nch})`:'Noch keine Chargen'}</button><button class="lnk" onclick="rzFork('${r.id}',${vn})">Als neues Rezept speichern</button>${r.photo?'':`<button class="lnk" onclick="rzPhotoMenu('${r.id}')">Foto hinzufügen</button>`}</div>
<div class="rz-ban ${ban.cls}" id="rzban"><b>${ban.h}</b><div>${ban.s}</div></div>
<div class="card rz-calc"><div style="padding:12px 14px 4px"><div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10px"><label class="fld" style="margin:0;flex:1"><span>Gesamtmenge (${ml?'ml':'g'})</span><input id="rz_tot" inputmode="decimal" value="${rzIv(rzTotShow(d))}" oninput="rzTot(this.value)"></label>${vok?`<div class="seg2" role="group" aria-label="Einheit"><button class="${ml?'':'on'}" onclick="rzUnit('g')">g</button><button class="${ml?'on':''}" onclick="rzUnit('ml')">ml</button></div>`:''}</div><div class="s" style="margin-top:6px">Tippe eine Menge an und ändere sie, zum Beispiel auf das, was du noch hast. Alle anderen Zutaten rechnen sich mit.${!vok&&vm.length&&rzSum(d)>0?` Anzeige in ml geht, sobald bei allen Zutaten die Dichte bekannt ist (fehlt bei ${esc(vm.map(x=>x.n).join(', '))}).`:''}</div></div>
${d.phasen.map((p,pi)=>`<div class="rz-ph-h">${p.typ?`<span class="rz-badge">${p.typ}</span>`:''}<span class="nm">${esc(p.name)}</span></div>${p.z.map((z,zi)=>rzCalcRow(c,pi,zi)).join('')}`).join('')}
<div class="rz-sum" id="rzsum">${rzSumTxt(c,cost)}</div></div>
${c.miss.concat(c.low).some(a=>rzItem(a.z))?`<div class="btns"><button class="btn sec" onclick="rzToShop()">Fehlendes auf die Einkaufsliste</button></div>`:''}
<details class="acc"><summary>INCI-Deklaration <small>Entwurf</small></summary><div class="in"><div class="rz-inci nm">${esc(inci.text)||'–'}</div>
${inci.un.length||inci.no.length?`<div class="hint" style="margin-top:8px">${inci.no.length?'Ohne INCI: '+esc(inci.no.join(', '))+'. ':''}${inci.un.length?'INCI nicht geprüft bei: '+esc(inci.un.join(', '))+'.':''}</div>`:''}
<div class="hint" style="margin-top:8px">Sortiert nach Anteil, größter zuerst. Prüfe vor dem Verkauf selbst, was für dein Produkt gilt.</div><div class="btns"><button class="btn sec" onclick="xtCopyStr(rzInci(rzCurD()).text)">${ic('copy','currentColor',18)} Kopieren</button></div></div></details>
${meta?`<details class="acc"><summary>Eckdaten</summary><div class="in">${meta}</div></details>`:''}
${d.mod.length?`<details class="acc"><summary>Ablauf und Hinweise <small>${d.mod.length}</small></summary><div class="in">${d.mod.map((x,n)=>`<div class="rz-mv"><div class="rz-mvh">${x.t==='schritt'?`<span class="rz-badge">${d.mod.slice(0,n+1).filter(y=>y.t==='schritt').length}</span>`:''}<b class="nm">${esc(x.titel||RZMT[x.t][0])}</b>${x.t!=='schritt'?`<span class="s"> · ${RZMT[x.t][0]}</span>`:''}</div>${x.text?`<div class="nm" style="white-space:pre-wrap;font-size:.92rem">${esc(x.text)}</div>`:''}</div>`).join('')}</div></details>`:''}
<div class="btns"><button class="btn sec" onclick="rzPrint('${r.id}',${vn})">Rezeptkarte drucken</button></div>`}
const rzUnitOn=d=>RC.unit==='ml'&&rzVolOk(d);
const rzTotShow=d=>{const s=rzSum(d)||1;return rzUnitOn(d)?RC.total/s*rzVolBase(d):RC.total};
function rzUnit(u){RC.unit=u;rzView()}
const rzCurD=()=>{const r=rzGet(R.id);return rzVer(r,R.ver||rzCurV(r).n).d};
function xtCopyStr(t){try{navigator.clipboard.writeText(t).then(()=>toast('Kopiert'),()=>toast('Kopieren nicht möglich'))}catch(e){toast('Kopieren nicht möglich')}}
function rzSumTxt(c,cost){const d=rzVer(rzGet(RC.id),RC.ver).d;const ml=rzUnitOn(d);return `<div class="kv"><span>Summe</span><span>${ml?rzIv(rzTotShow(d))+' ml · ':''}${rzG(RC.total)} g</span></div>${cost.c>0?`<div class="kv"><span>Kosten ca.</span><span>${eur(cost.c)}${RC.total>0?` · ${eur(cost.c/RC.total*100)} je 100 g`:''}</span></div>${cost.n?`<div class="s">${cost.n} Zutat${cost.n>1?'en':''} ohne Preis nicht eingerechnet.</div>`:''}`:''}`}
const rzShow=(z,need,ml)=>{if(ml){const dn=rzDensZ(z);return {v:rzIv(Math.round(need/dn*10)/10),u:'ml'}}return {v:rzIv(rzR(need)),u:'g'}};
function rzCalcRow(c,pi,zi){const x=c.rows.find(a=>a.pi===pi&&a.zi===zi);const z=x.z;const key=pi+'.'+zi;const d=rzVer(rzGet(RC.id),RC.ver).d;const sh=rzShow(z,x.need,rzUnitOn(d));
return `<div class="rz-r ${RC.anchor===key?'anc':''}" id="rzr_${pi}_${zi}"><div class="rz-n" ${x.item?(x.st==='dens'?`onclick="rzDens('${x.item.id}','draw()')"`:`onclick="go('artikel','${x.item.id}')"`):''}><span class="dot ${rzDot(x.st)}"></span><div style="min-width:0"><b class="nm">${esc(rzName(z)||'Zutat')}</b><div class="s" id="rzs_${pi}_${zi}">${rzStTxt(x)}</div></div></div><input class="rz-a" id="rza_${pi}_${zi}" inputmode="decimal" value="${sh.v}" oninput="rzAnch(${pi},${zi},this.value)"><span class="rz-u">${sh.u}</span></div>`}
const rzDot=st=>st==='ok'?'ok':st==='knapp'?'warn':st==='fehlt'?'err':'';
function rzStTxt(x){if(x.st==='ok')return 'Lager: '+fmt(x.item.total,x.item.kind);if(x.st==='knapp')return `Lager: ${rzG(x.have)} g · es fehlen ${rzG(x.need-x.have)} g`;
if(x.st==='fehlt')return x.item?'nicht vorrätig':'nicht im Lager';if(x.st==='unb')return 'Menge im Lager unbekannt';if(x.st==='dens')return 'Lager: '+fmt(x.item.total,'v')+' · Dichte fehlt, tippen zum Eintragen';return x.z.cid?'':''}
function rzUpd(skip){const r=rzGet(RC.id);if(!r)return;const d=rzVer(r,RC.ver).d;const c=rzCheck(d,RC.total);const cost=rzCost(c.rows);const ml=rzUnitOn(d);
c.rows.forEach(x=>{const k=x.pi+'_'+x.zi;const inp=document.getElementById('rza_'+k);if(inp&&('rza_'+k)!==skip)inp.value=rzShow(x.z,x.need,ml).v;const s=document.getElementById('rzs_'+k);if(s)s.textContent=rzStTxt(x);
const row=document.getElementById('rzr_'+k);if(row){const dot=row.querySelector('.dot');if(dot)dot.className='dot '+rzDot(x.st);row.classList.toggle('anc',RC.anchor===x.pi+'.'+x.zi)}});
const t=document.getElementById('rz_tot');if(t&&skip!=='rz_tot')t.value=rzIv(rzTotShow(d));const ban=rzBan(c);const b=document.getElementById('rzban');if(b){b.className='rz-ban '+ban.cls;b.innerHTML=`<b>${ban.h}</b><div>${ban.s}</div>`}
const s=document.getElementById('rzsum');if(s)s.innerHTML=rzSumTxt(c,cost)}
function rzTot(v){const n=num(v);if(!(n>0))return;const d=rzVer(rzGet(RC.id),RC.ver).d;RC.total=rzUnitOn(d)?n/rzVolBase(d)*rzSum(d):n;RC.anchor=null;rzUpd('rz_tot')}
function rzAnch(pi,zi,v){let n=num(v);const r=rzGet(RC.id);const d=rzVer(r,RC.ver).d;const z=d.phasen[pi].z[zi];if(rzUnitOn(d))n=n*rzDensZ(z);if(!(n>0)||!(z.g>0))return;RC.total=n/z.g*rzSum(d);RC.anchor=pi+'.'+zi;rzUpd('rza_'+pi+'_'+zi)}
function rzToShop(){const r=rzGet(RC.id);const d=rzVer(r,RC.ver).d;const c=rzCheck(d,RC.total);let n=0;
c.miss.concat(c.low).forEach(a=>{const i=rzItem(a.z);if(!i||!'wv'.includes(i.kind))return;let need=a.fehlt!=null?a.fehlt:a.need;if(i.kind==='v')need=i.dens>0?need/i.dens:0;if(!(need>0))return;
if(S.shop.some(s=>s.item===i.id))return;S.shop.push({id:uid(),item:i.id,menge:Math.ceil(need),lief:''});n++});save();toast(n?n+' Posten auf der Einkaufsliste':'Nichts hinzugefügt, die Zutaten stehen schon auf der Liste oder sind nicht im Lager')}

/* ---------- Editor ---------- */
function rzEdit(id,ver){const r=id?rzGet(id):null;const bn=r?(ver||rzCurV(r).n):0;
RE={id:id||null,base:bn,d:rzPoolFix(r?rzClone(rzVer(r,bn).d):rzEmpty()),dirty:false,photo:r?(r.photo||''):''};

/* ---------- Speichern als neue Version ---------- */
function rzClean(d){const c=rzClone(d);c.name=(c.name||'').trim();c.phasen.forEach(p=>{p.z=p.z.filter(z=>rzName(z).trim()||z.g>0)});c.phasen=c.phasen.filter(p=>p.z.length);{const only=c.phasen.length===1;c.phasen.forEach(p=>{if(p.pool){if(!only&&(!p.name||p.name==='Zutaten'))p.name='Weitere Zutaten';delete p.pool}})}c.mod=c.mod.filter(m=>(m.titel||'').trim()||(m.text||'').trim()).map(m=>{delete m.o;return m});return c}
const rzNorm=d=>JSON.stringify(Object.assign({},d,{phasen:d.phasen.map(p=>Object.assign({},p,{z:p.z.map(z=>{const x=Object.assign({},z);delete x.u;return x})})),mod:d.mod.map(m=>{const x=Object.assign({},m);delete x.o;return x})}));
function rzMap(d){const m={};d.phasen.forEach(p=>p.z.forEach(z=>{const n=rzName(z);if(!n)return;const k=z.item||(z.cid?'c'+z.cid:'n'+FOLD(z.name));(m[k]=m[k]||{n,p:0}).p+=(+z.g||0)}));return m}
function rzDiff(a,b){const L=[];if(a.name!==b.name)L.push('Name: '+a.name+' → '+b.name);const A=rzMap(a),B=rzMap(b);
Object.keys(B).forEach(k=>{if(!A[k])L.push('+ '+B[k].n+' '+nf(B[k].p,2)+' g');else if(Math.abs(A[k].p-B[k].p)>=0.005)L.push(B[k].n+': '+nf(A[k].p,2)+' → '+nf(B[k].p,2)+' g')});
Object.keys(A).forEach(k=>{if(!B[k])L.push('− '+A[k].n)});
const ka=Object.keys(A).filter(k=>B[k]).join(),kb=Object.keys(B).filter(k=>A[k]).join();if(ka!==kb)L.push('Reihenfolge der Zutaten geändert');
if(a.phasen.map(p=>p.name).join('|')!==b.phasen.map(p=>p.name).join('|'))L.push('Phasen geändert');
const s=m=>m.t+'\n'+m.titel+'\n'+m.text;const sa=a.mod.map(s);
b.mod.forEach(m=>{if(!sa.includes(s(m))){const nm=m.titel||RZMT[m.t][0];L.push((a.mod.some(o=>o.t===m.t&&o.titel===m.titel)?'Geändert: ':'Neu: ')+nm)}});
a.mod.forEach(m=>{if(!b.mod.some(o=>o.t===m.t&&o.titel===m.titel))L.push('Entfernt: '+(m.titel||RZMT[m.t][0]))});
Object.keys(RZF2).forEach(f=>{if((a[f]||'')!==(b[f]||''))L.push('Eckdaten: '+RZF2[f])});return L}
function rzSave(){const d=rzClean(RE.d);if(!d.name){toast('Bitte einen Rezeptnamen eingeben');const e=document.getElementById('re_name');if(e)e.focus();return}
if(!d.phasen.some(p=>p.z.length)){toast('Bitte mindestens eine Zutat eintragen');return}
const r=RE.id?rzGet(RE.id):null;const prev=r?rzCurV(r).d:null;
if(prev&&rzNorm(prev)===rzNorm(d)){if(r&&(r.photo||'')!==(RE.photo||'')){if(RE.photo)r.photo=RE.photo;else delete r.photo;save();const id=r.id;RE=null;draftClear();stack=[{name:'rez',id:null}];R={name:'rezv',id,ver:0};RC={id:null,ver:0,total:0,anchor:null};draw();toast('Foto gespeichert');return}toast('Keine Änderung zum Speichern');return}
let diff=prev?rzDiff(prev,d):[];if(prev&&!diff.length)diff=['Mengenbasis oder Anordnung angepasst'];
RE.pending={d,diff};const n=r?rzCurV(r).n+1:1;
openSheet(`<h2>${r?'Neue Version v'+n:'Rezept speichern'}</h2>${diff.length?`<div class="cap">Das hat sich geändert</div><div class="rz-diff nm">${diff.slice(0,10).map(x=>`<div>${esc(x)}</div>`).join('')}${diff.length>10?`<div class="s">und ${diff.length-10} weitere</div>`:''}</div>`:''}
<details class="acc" ${r?'open':''}><summary>${r?'Notiz zur Version':'Notiz zur ersten Fassung'} <small>optional</small></summary><div class="in"><textarea id="rn" placeholder="${r?'z. B. weniger Öl, damit es besser einzieht':'optional'}" style="width:100%;min-height:70px"></textarea></div></details>
<div class="hint">Jede Speicherung bleibt als eigene Version erhalten.</div>
<div class="btns"><button class="btn" onclick="rzDoSave()">${r?'Als v'+n+' speichern':'Speichern'}</button><button class="btn sec" onclick="closeSheet()">Zurück</button></div>`)}
function rzDoSave(){const {d,diff}=RE.pending;const note=val('rn').trim();let r=RE.id?rzGet(RE.id):null;const now=new Date().toISOString();
if(!r){r={id:uid(),created:now,vers:[]};rzAll().push(r)}
const n=r.vers.length?rzCurV(r).n+1:1;r.vers.push({n,date:now,note:note||(n===1?'Erste Fassung':''),diff:n===1?[]:diff,d,from:RE.base||0,st:''});if(RE.photo)r.photo=RE.photo;else delete r.photo;
save();const id=r.id;RE=null;draftClear();closeSheet();stack=[{name:'rez',id:null}];R={name:'rezv',id,ver:0};RC={id:null,ver:0,total:0,anchor:null};draw();toast(n===1?'Rezept gespeichert':'Version v'+n+' gespeichert')}

const fl=(v.note||'').split('\n')[0];

${v.note?`<div class="nm" style="margin-top:6px;white-space:pre-wrap">${esc(v.note)}</div>`:''}

<div class="rz-lk"><button class="lnk" onclick="rzOpen('${r.id}',${v.n})">Ansehen</button><button class="lnk" onclick="rzEdit('${r.id}',${v.n})">Als Ausgangspunkt bearbeiten</button><button class="lnk" onclick="rzFork('${r.id}',${v.n})">Als neues Rezept speichern</button>${v.n!==cur.n?`<button class="lnk" onclick="rzDiffSheet('${r.id}',${v.n})">Unterschied zur aktuellen</button>`:''}<button class="lnk" onclick="rzMarkMenu('${r.id}',${v.n})">Markieren</button></div></div></details>`}).join('')}</div>`}

openSheet(`<h2>v${n} → v${rzCurV(r).n}</h2><div class="rz-diff nm" style="border:0;padding:0">${L.length?L.map(x=>`<div>${esc(x)}</div>`).join(''):'<div class="s">Kein Unterschied.</div>'}</div>`)}

if(!RM||RM.id!==r.id||RM.ver!==v.n){RM={id:r.id,ver:v.n,total:(RC.id===r.id&&RC.ver===v.n)?RC.total:(Math.round(rzSum(d)*100)/100||100),ist:{},done:{},steps:{},touched:false};rzWake(true)}

m.innerHTML=`<div class="rz-t nm" style="font-size:1.3rem">${esc(d.name)}</div><div class="s">Version ${v.n} · Mischen</div>
<div class="card" style="padding:12px 14px;margin-top:12px"><label class="fld" style="margin:0"><span>Gesamtmenge (g)</span><input id="rm_tot" inputmode="decimal" value="${rzIv(RM.total)}" oninput="rmTot(this.value)"></label></div>
<div class="rz-prog" id="rm_prog"></div><div id="rm_list"></div>
${steps.length?`<div class="cap" style="margin:18px 0 8px">Arbeitsschritte</div><div class="card">${steps.map((x,n)=>`<label class="rm-s"><input type="checkbox" ${RM.steps[x.id]?'checked':''} onchange="rmStep('${x.id}',this.checked)"><div><b class="nm">${n+1}. ${esc(x.titel||'Schritt')}</b>${x.text?`<div class="nm" style="font-size:.9rem;white-space:pre-wrap">${esc(x.text)}</div>`:''}</div></label>`).join('')}</div>`:''}<div style="height:80px"></div>`;
rmList();
const old=document.getElementById('rzbar');if(old)old.remove();
$('#view').insertAdjacentHTML('beforeend',`<div class="rz-bar" id="rzbar"><button class="btn sec" onclick="back()">Abbrechen</button><button class="btn" onclick="rmFinish()">Fertig gemischt</button></div>`)}
function rmRows(){const r=rzGet(RM.id);const d=rzVer(r,RM.ver).d;return {d,c:rzCheck(d,RM.total)}}
function rmList(){const {d,c}=rmRows();const box=document.getElementById('rm_list');if(!box)return;
box.innerHTML=d.phasen.map((p,pi)=>`<div class="cap nm" style="margin:16px 0 8px;text-transform:none;letter-spacing:0;font-size:.9rem">${esc(p.name)}</div><div class="card">${p.z.map((z,zi)=>{const x=c.rows.find(a=>a.pi===pi&&a.zi===zi);const soll=rzR(x.need);const ist=RM.ist[z.id];
return `<div class="rm-r"><input type="checkbox" id="rmc_${z.id}" ${RM.done[z.id]?'checked':''} onchange="rmChk('${z.id}',this.checked)" aria-label="Eingewogen"><div class="t" ${x.st==='dens'?`onclick="rzDens('${x.item.id}','draw()')"`:''}><b class="nm">${esc(rzName(z)||'Zutat')}</b><div class="s"><span class="dot ${rzDot(x.st)}"></span>${rzStTxt(x)||'&nbsp;'}</div></div><div class="rm-soll">${rzG(soll)}<small> g</small></div><input class="rm-ist" inputmode="decimal" enterkeyhint="next" placeholder="${rzIv(soll)}" value="${ist!=null?rzIv(ist):''}" oninput="rmIst('${z.id}',this.value)" onfocus="rmFoc(this)" onkeydown="rmKey(event,this)" aria-label="Ist-Einwaage"></div>`}).join('')}</div>`).join('');rmProg()}
function rmProg(){const {d}=rmRows();const all=d.phasen.flatMap(p=>p.z);const n=all.filter(z=>RM.done[z.id]).length;const e=document.getElementById('rm_prog');if(e)e.innerHTML=`<div class="s" style="margin:12px 0 4px">${n} von ${all.length} Zutaten eingewogen</div><div class="bar" style="margin-top:0"><div style="width:${all.length?n/all.length*100:0}%"></div></div>`}
function rmTot(v){const n=num(v);if(!(n>0))return;RM.total=n;RM.ist={};rmList()}
function rmChk(zid,on){RM.done[zid]=on;RM.touched=true;rmProg()}
function rmIst(zid,v){const n=num(v);if(n>=0&&String(v).trim()!=='')RM.ist[zid]=n;else delete RM.ist[zid];RM.touched=true;if(n>0&&!RM.done[zid]){RM.done[zid]=true;const c=document.getElementById('rmc_'+zid);if(c)c.checked=true;rmProg()}}
function rmFoc(e){setTimeout(()=>{try{e.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},320)}
function rmKey(ev,e){if(ev.key!=='Enter')return;ev.preventDefault();const a=[...document.querySelectorAll('.rm-ist')];const j=a.indexOf(e)+1;if(a[j])a[j].focus();else e.blur()}
function rmStep(id,on){RM.steps[id]=on;RM.touched=true}
function rzBase(i,g){if(!i||i.unk||!(g>0))return null;if(i.kind==='w')return g;if(i.kind==='v'&&i.dens>0)return g/i.dens;return null}
function rzTake(i,g){const b=rzBase(i,g);if(b==null)return;i.total=Math.max(0,i.total-b);let ex=vsum(i)-i.total;if(ex>1e-9)for(const v of i.vessels){if(ex<=0)break;const t=Math.min(v.amount,ex);v.amount-=t;ex-=t}}
function rmFinish(){const {d,c}=rmRows();const lines=c.rows.map(x=>({x,use:RM.ist[x.z.id]!=null?RM.ist[x.z.id]:rzR(x.need)}));
const undone=lines.filter(l=>!RM.done[l.x.z.id]).length;
const anyAb=lines.some(l=>l.x.item&&rzBase(l.x.item,l.use)!=null);
const prev=lines.filter(l=>l.x.item).map(l=>{const i=l.x.item;const b=rzBase(i,l.use);
if(b==null)return anyAb?`<div class="rz-dl"><span class="nm">${esc(i.name)}</span><span class="s">${i.unk?'Menge unbekannt':`<button class="lnk" onclick="rzDens('${i.id}','rmFinish()')">Dichte eintragen</button>`}</span></div>`:'';
return `<div class="rz-dl"><span class="nm">${esc(i.name)}</span><span>−${rzG(l.use)} g${b>i.total+1e-9?' <small class="amb">Lager reicht nicht</small>':''}</span></div>`}).join('');
openSheet(`<h2>Fertig gemischt</h2>${undone?`<div class="hint" style="margin:0 0 8px">${undone} Zutat${undone>1?'en sind':' ist'} noch nicht abgehakt. Es gelten die Sollwerte, wenn du keine Ist-Einwaage eingetragen hast.</div>`:''}
<div class="cap">Lagerabzug</div>${anyAb?prev:'<div class="s">Im Lager sind für diese Zutaten keine abziehbaren Mengen bekannt. Es wird nichts abgezogen.</div>'}
<label class="chk"><input type="radio" name="rmab" value="1" ${anyAb?'checked':''} ${anyAb?'':'disabled'}> Menge vom Lager abziehen</label><label class="chk"><input type="radio" name="rmab" value="0" ${anyAb?'':'checked'}> Nur die Charge speichern, nichts abziehen</label>
<label class="fld"><span>Notiz zur Charge</span><textarea id="rmnote" placeholder="optional, z. B. Konsistenz, Duft"></textarea></label>
<div class="btns"><button class="btn" onclick="rmDone()">Charge speichern</button><button class="btn sec" onclick="closeSheet()">Zurück</button></div>`)}
function rmDone(){const {d,c}=rmRows();const r=rzGet(RM.id);const lines=c.rows.map(x=>({x,use:RM.ist[x.z.id]!=null?RM.ist[x.z.id]:rzR(x.need)}));
const ab=(document.querySelector('input[name=rmab]:checked')||{}).value==='1';const note=val('rmnote').trim();const snap=JSON.stringify(S);
const ch={id:uid(),rez:r.id,ver:RM.ver,date:new Date().toISOString(),total:RM.total,note,stars:0,abz:ab,lines:lines.map(l=>({n:rzName(l.x.z),item:l.x.item?l.x.item.id:'',soll:rzR(l.x.need),ist:l.use}))};
if(ab)lines.forEach(l=>rzTake(l.x.item,l.use));rzChgAll().push(ch);save();RM=null;draftClear();rzWake(false);closeSheet();stack=[{name:'chgs',id:null}];R={name:'chg',id:ch.id};draw();

function rzStar(id,n){const c=rzChgAll().find(x=>x.id===id);c.stars=c.stars===n?0:n;save();const e=document.getElementById('rzst');if(e)e.innerHTML=[1,2,3,4,5].map(k=>`<button onclick="rzStar('${id}',${k})" aria-label="${k} Sterne">${k<=c.stars?'★':'☆'}</button>`).join('')}
let rzNT=null;function rzChgNote(id,v){const c=rzChgAll().find(x=>x.id===id);c.note=v;clearTimeout(rzNT);rzNT=setTimeout(save,500)}
function rzChgDel(id){rzAsk('Charge löschen?','Der Eintrag wird entfernt. Mengen, die vom Lager abgezogen wurden, kommen nicht zurück.','Löschen',()=>{S.chg=rzChgAll().filter(x=>x.id!==id);save();back()})}

/* Testdaten: Rezepte + Lager laden/entfernen (nur Expertenmodus, nie automatisch) */
const DEMO_NOTE='Testdaten – Zusammensetzung nicht geprüft, nicht zum Nachmischen';
function demoCount(){return {r:(S.rez||[]).filter(x=>x.demo).length,i:S.items.filter(x=>x.demo).length}}
function demoBlockHtml(){if(!S.expert)return '';const c=demoCount();
return `<div style="height:22px"></div><div class="cap" style="font-size:1rem;font-weight:700;color:var(--pri);letter-spacing:0;text-transform:none;border-bottom:2px solid var(--muted);padding-bottom:6px;margin-bottom:8px">Testdaten</div><div class="s" style="margin-bottom:8px">${DEMO.rez.length} Beispielrezepte mit passendem Lager zum Ausprobieren. Deine eigenen Daten bleiben unberührt.${c.r||c.i?` Geladen: ${c.r} Rezepte, ${c.i} Rohstoffe.`:''}</div><div class="btns"><button class="btn" onclick="demoAsk()">Testdaten laden</button>${c.r||c.i?'<button class="btn sec" onclick="demoRmAsk()">Testdaten entfernen</button>':''}</div>`}
const sheetSettings2=sheetSettings;
sheetSettings=function(){sheetSettings2();const s=shEl();if(!s||!S.expert)return;s.insertAdjacentHTML('beforeend',demoBlockHtml())};
function demoAsk(){openSheet(`<h2>Testdaten laden?</h2><div style="font-size:.92rem">Es werden ${DEMO.rez.length} Beispielrezepte angelegt und die dafür nötigen Rohstoffe in üblichen Packungsgrößen als vorhanden eingetragen. Bei Rohstoffen, die du schon hast, wird höchstens eine fehlende Dichte ergänzt. Die Zusammensetzungen sind nicht geprüft und nicht zum Nachmischen gedacht. Du kannst alles wieder entfernen.</div><div class="btns"><button class="btn" onclick="demoLoad()">Laden</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}
function demoLoad(){const snap=JSON.stringify(S);if(!S.rez)S.rez=[];const ex=new Set(S.rez.filter(r=>r.demo).map(r=>r.demo));
const today10=new Date().toISOString().slice(0,10);const mh=new Date();mh.setMonth(mh.getMonth()+20);const mhd=mh.toISOString().slice(0,10);
const idOf={};DEMO.stock.forEach(s=>{const c=CM[s.cid];if(!c)return;let it=S.items.find(x=>x.cid===s.cid)||S.items.find(x=>FOLD(x.name)===FOLD(c.n));
if(!it){it=mk(c,{kind:s.kind,total:s.total,dens:s.dens||0,min:Math.round(s.total*0.2),mhd,demo:true,vessels:[{id:uid(),typ:s.kind==='v'?'flasche':'dose',nr:1,cap:s.pack,amount:s.total,ort:'Regal'}],verw:'Testdaten'});S.items.push(it)}
else if(it.kind==='v'&&!(it.dens>0)&&s.dens)it.dens=s.dens;
idOf[s.cid]=it.id});
let nr=0;DEMO.rez.forEach(r=>{if(ex.has(r.key))return;const now=new Date().toISOString();
const d={name:r.name,zweck:r.zweck,ph:r.ph,ergibt:r.ergibt,zeit:r.zeit,grad:r.grad,phasen:r.phasen.map(p=>({id:uid(),typ:p.typ,name:p.name,z:p.z.map(z=>({id:uid(),item:z.cid?idOf[z.cid]||'':'',cid:z.cid||'',name:z.name||'',g:z.g}))})),mod:r.mod.map(m=>({id:uid(),t:m.t,titel:m.titel,text:m.text}))};
S.rez.push({id:uid(),created:now,demo:r.key,vers:[{n:1,date:now,note:DEMO_NOTE,diff:[],from:0,st:'',d}]});nr++});
save();closeSheet();undoOffer('Testdaten geladen',snap,JSON.stringify(S),true);tab('rez');toast(nr+' Rezepte geladen')}
function demoRmAsk(){const c=demoCount();openSheet(`<h2>Testdaten entfernen?</h2><div style="font-size:.92rem">Entfernt ${c.r} Testrezepte samt ihren Chargen und ${c.i} Testrohstoffe. Alles, was du selbst angelegt hast, bleibt.</div><div class="btns"><button class="btn danger" onclick="demoRm()">Entfernen</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}
function demoRm(){const snap=JSON.stringify(S);const ids=new Set(S.rez.filter(r=>r.demo).map(r=>r.id));S.rez=S.rez.filter(r=>!r.demo);if(S.chg)S.chg=S.chg.filter(c=>!ids.has(c.rez));
const mine=new Set();S.rez.forEach(r=>r.vers.forEach(v=>v.d.phasen.forEach(p=>p.z.forEach(z=>z.item&&mine.add(z.item)))));
S.items=S.items.filter(i=>!i.demo||mine.has(i.id));
save();closeSheet();undoOffer('Testdaten entfernt',snap,JSON.stringify(S),true);tab('rez');toast('Testdaten entfernt')}

/* Dichte nachtragen (aus Rezeptrechner, Werkbank, Abschluss) */
let RZDN=null;
function rzDens(id,after){const i=getI(id);if(!i)return;RZDN={id,after};
openSheet(`<h2 class="nm">${esc(i.name)}</h2><div style="font-size:.92rem;line-height:1.45">Mit der Dichte rechnet die App Gramm im Rezept in Milliliter im Lager um. Du findest sie auf dem Datenblatt, bei Ölen liegt sie meist bei 0,91 bis 0,93 g/ml.</div>
<label class="fld"><span>Dichte (g/ml)</span><input id="dn" inputmode="decimal" placeholder="z. B. 0,92" value="${i.dens>0?nf(i.dens,3):''}"></label>
<div class="btns"><button class="btn" onclick="rzDensSave()">Speichern</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}
function rzDensSave(){const i=getI(RZDN.id);const n=num(val('dn'));if(!(n>0.3&&n<3)){toast('Bitte eine Dichte zwischen 0,3 und 3 eintragen');return}
i.dens=n;i.chg=today();save();closeSheet();const a=RZDN.after;RZDN=null;toast('Dichte gespeichert');if(a)new Function(a)()}

function sheetVessel(id,vid){const i=getI(id);const v=vid?i.vessels.find(x=>x.id===vid):null;

openSheet(`<h2>${vname(v)}</h2><div class="two" style="align-items:end"><label class="fld"><span>Nenninhalt</span><input id="vc" inputmode="decimal" value="${nf(v.cap/U[u].f,3)}"></label><label class="fld u" style="flex:0 0 28%"><span>Einheit</span><select id="vu">${unitSelD(i,u)}</select></label></div>

<div class="err" id="er"></div><div class="btns"><button class="btn" onclick="saveVessEdit('${id}','${vid}')">Speichern</button><button class="btn danger" onclick="delVessel('${id}','${vid}')">Gefäß entfernen</button></div>`);return}

const RZI_U='kg|g|gr|mg|ml|l|%|prozent|tropfen|tr\\.?|el|tl|msp\\.?|prise|stk\\.?|stück';
const rzNum='\\d+(?:[.,]\\d+)?';
const rziA=new RegExp('^(?:[-•*·–]\\s*)?('+rzNum+')\\s*('+RZI_U+')\\s*(?:von\\s+|[:\\-–]\\s*)?(.+?)\\s*$','i');
const rziB=new RegExp('^(?:[-•*·–]\\s*)?([^\\d].*?)[\\s.:–\\-]*\\s('+rzNum+')\\s*('+RZI_U+')\\s*$','i');
const rziPhaseTyp=t=>{t=FOLD(t);if(/wasser|aqua|hydro/.test(t))return 'A';if(/oel|fett|lipid|butter|wachs|heiss|hei(ss|ß)/.test(t))return 'B';if(/kalt|abkuehl|wirkstoff|duft|konserv|waermeempfind/.test(t))return 'C';if(/\bph\b|ph-?einstell/.test(t))return 'D';return ''};
function rziAmount(n,u,name){u=u.toLowerCase().replace(/\.$/,'');let g=num(n)||0,warn='',un='';
if(u==='kg')g*=1000;else if(u==='mg')g/=1000;else if(u==='g'||u==='gr'){}else if(u==='%'||u==='prozent'){warn='Prozentwert als Gramm übernommen'}else if(u==='ml'||u==='l'){if(u==='l')g*=1000;un='ml'}
else{warn='Menge in „'+n+' '+u+'“ bitte in Gramm eintragen';g=0}
return {g,warn,un}}
function rziMatch(n){const f=FOLD(n);if(!f)return {k:'t'};const own=S.items.find(x=>FOLD(x.name)===f)||S.items.find(x=>{const o=FOLD(x.name);return o.length>=4&&(o.startsWith(f+' ')||f.startsWith(o+' '))});if(own)return {k:'i',i:own};
const c=CAT.find(c=>FOLD(c.n)===f)||CAT.find(c=>FOLD(c.n).startsWith(f+' '));if(c)return {k:'c',c};return {k:'t'}}
function rzParse(raw){const lines=String(raw||'').replace(/\r/g,'').split('\n').map(l=>l.replace(/[\u00a0\t]+/g,' ').trim()).filter(Boolean);
const d={name:'',zweck:'',ph:'',ergibt:'',zeit:'',grad:'',phasen:[],mod:[]};const warn=[];let cur=null,mode='z',ing=0;
const newPh=(typ,name)=>{cur={id:uid(),typ,name:name||(typ?'Phase '+typ+' · '+RZPH[typ]:'Zutaten'),z:[]};d.phasen.push(cur);return cur};
const addZ=(name,g,warnTxt,un)=>{if(!cur)newPh('','Zutaten');const m=rziMatch(name);const z={id:uid(),item:m.k==='i'?m.i.id:'',cid:m.k==='i'?(m.i.cid||''):m.k==='c'?m.c.id:'',name:m.k==='i'?m.i.name:m.k==='c'?m.c.n:name,g};
if(un==='ml'){const dn=m.k==='i'&&m.i.dens>0?m.i.dens:(/^(wasser|aqua|dest)/i.test(name)?1:0);if(dn>0)z.g=Math.round(g*dn*1000)/1000;else warn.push(name+': ml ohne Dichte als Gramm übernommen')}
if(warnTxt)warn.push(name+': '+warnTxt);cur.z.push(z);ing++};
for(let line of lines){let m;
if(/^(summe|gesamt|gesamtmenge|total|insgesamt)\b/i.test(line))continue;
if(/^(zutaten|inhaltsstoffe|zutatenliste)\s*:?$/i.test(line)){mode='z';continue}
if(/^(zubereitung|anleitung|herstellung|vorgehen|vorgehensweise|arbeitsschritte|ablauf|so geht['’]?s)\s*:?$/i.test(line)){mode='s';continue}
if(m=line.match(/^(?:rezept|name|titel)\s*:\s*(.+)$/i)){d.name=m[1].trim();continue}
if((m=line.match(/^(?:ergibt|menge|ausbeute)\s*:\s*(.+)$/i))&&!/^\d/.test(line)){d.ergibt=m[1].trim();continue}
if(m=line.match(/^(?:dauer|zeit|zeitaufwand)\s*:\s*(.+)$/i)){d.zeit=m[1].trim();continue}
if(m=line.match(/^(?:ziel-?)?ph(?:-wert)?\s*:\s*(.+)$/i)){d.ph=m[1].trim();continue}
if(m=line.match(/^(?:einsatz(?:zweck)?|zweck|verwendung)\s*:\s*(.+)$/i)){d.zweck=m[1].trim();continue}
if(m=line.match(/^haltbarkeit\s*:\s*(.+)$/i)){d.mod.push({id:uid(),t:'halt',titel:'Haltbarkeit',text:m[1].trim()});continue}
if(m=line.match(/^(achtung|tipp|hinweis|sicherheit|wichtig)\s*:\s*(.+)$/i)){const k=m[1].toLowerCase();d.mod.push({id:uid(),t:'hinweis',titel:k==='tipp'?'Tipp':k==='sicherheit'?'Sicherheit':'Achtung',text:m[2].trim()});continue}
if(m=line.match(/^abf(?:ü|ue)llung\s*:\s*(.+)$/i)){d.mod.push({id:uid(),t:'abfuell',titel:'Abfüllung',text:m[1].trim()});continue}
/* Zutat? */
const bare=line.replace(/^\d+\s*[.)]\s+/,'');let a=line.match(rziA)||bare.match(rziA),b=null;if(!a)b=line.match(rziB)||bare.match(rziB);
if(a&&mode==='z'){const r=rziAmount(a[1],a[2],a[3]);addZ(a[3].replace(/[.,;:]+$/,''),r.g,r.warn,r.un);continue}
if(b&&mode==='z'){const r=rziAmount(b[2],b[3],b[1]);addZ(b[1].replace(/[.,;:\-–]+$/,'').trim(),r.g,r.warn,r.un);continue}
/* Phase? */
if(m=line.match(/^phase\s*([a-d1-4])\b\s*[:.\-–·)]*\s*(.*)$/i)){const t=/[a-d]/i.test(m[1])?m[1].toUpperCase():'ABCD'[+m[1]-1];newPh(t,m[2]?'Phase '+t+' · '+m[2].replace(/:$/,'').trim():'');mode='z';continue}
if(m=line.match(/^([a-d])\s*[:.)]\s*(.{0,40})$/i)){const t=m[1].toUpperCase();newPh(t,m[2]?'Phase '+t+' · '+m[2].replace(/:$/,'').trim():'');mode='z';continue}
if(m=line.match(/^(wasser|öl|oel|fett|heiß|heiss|kalt|wirkstoff|abkühl|duft|konservier)[\wäöüß\- \/]{0,24}?(phase)\s*:?\s*$/i)){const t=rziPhaseTyp(line);newPh(t,line.replace(/:$/,''));mode='z';continue}
if(/^[^\d]{2,40}:$/.test(line)&&mode==='z'&&!/^(rezept|name|titel)/i.test(line)){const nm=line.slice(0,-1).trim();newPh(rziPhaseTyp(nm),nm);continue}
/* Schritt */
const sm=line.match(/^(?:schritt\s*)?\d+\s*[.)\-:]\s+(.+)$/i);
if(sm||mode==='s'||(ing>0&&line.length>25)){d.mod.push({id:uid(),t:'schritt',titel:'',text:(sm?sm[1]:line.replace(/^[-•*·–]\s*/,'')).trim()});continue}
if(!d.name&&!ing&&!cur){d.name=line.replace(/^#+\s*/,'');continue}
d.mod.push({id:uid(),t:'notiz',titel:'',text:line})}
d.phasen=d.phasen.filter(p=>p.z.length);
return {d,warn,ing}}

/* Vorverarbeitung: Fließtext in Zeilen zerlegen (Trenner |, Phasen mitten im Satz, Zutaten per Komma, Schritte als Sätze) */
function rzPre(raw){let t=String(raw||'').replace(/\r/g,'').replace(/[ \t]+/g,' ').replace(/\s*[|¦]\s*/g,'\n');
const AMT=/\d[\d.,]*\s*(?:g|kg|mg|ml|l|%)(?![a-zäöü])/i;
t=t.replace(/(phase\s*[a-d1-4]\s*:)([^\n]*?)(?=phase\s*[a-d1-4]\s*:|\n|$)/gi,(m,h,r)=>AMT.test(r)?'\n'+h+'\n'+r.trim()+'\n':'\n'+h+r+'\n');
const HD=/^(zutaten|inhaltsstoffe|zutatenliste|zubereitung|anleitung|herstellung|vorgehen|vorgehensweise|arbeitsschritte|ablauf)\s*:\s*(.+)$/i;
let mode='z';const out=[];
const qs=x=>!AMT.test(x.replace(/\d+\s*%/g,''))&&/\b(nach bedarf|nach wunsch|q\.?\s?s\.?|tropfenweise)\b/i.test(x)&&x.length<70?'0 g '+x:x;
const splitC=l=>{const parts=[];let dp=0,cur='';for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='(')dp++;if(ch===')')dp=Math.max(0,dp-1);if((ch===','||ch===';')&&!dp&&!(ch===','&&/\d$/.test(cur)&&/\d/.test(l[i+1]||''))){parts.push(cur);cur=''}else cur+=ch}parts.push(cur);return parts};
for(let l of t.split('\n')){l=l.trim();if(!l)continue;let m;
if(m=l.match(/^rezeptur\s*:\s*(.+)$/i)||l.match(/^rezept\s*:\s*(.+)$/i)){let n=m[1].trim();const q=n.match(/^(.*?)\s*\((\d[\d.,]*\s*(?:g|kg|ml))\)\s*$/i);if(q){n=q[1].trim();out.push('Rezept: '+n);out.push('Ergibt: '+q[2]);}else out.push('Rezept: '+n);continue}
if(m=l.match(HD)){out.push(m[1]+':');l=m[2].trim();mode=/^zut|^inh/i.test(m[1])?'z':'s'}
else if(/^(zubereitung|anleitung|herstellung|vorgehen|vorgehensweise|arbeitsschritte|ablauf|so geht['’]?s)\s*:?$/i.test(l)){mode='s';out.push(l);continue}
else if(/^(zutaten|inhaltsstoffe|zutatenliste)\s*:?$/i.test(l)){mode='z';out.push(l);continue}
if(mode==='s'&&l.length>40){l.split(/(?<!\b\d\.)(?<=[.!?])\s+(?=[A-ZÄÖÜ0-9])/).forEach(x=>{if(x.trim())out.push(x.trim())});continue}
if(mode==='z'&&(l.match(new RegExp(AMT.source,'gi'))||[]).length>=2&&!/^(achtung|tipp|hinweis|haltbarkeit)/i.test(l)){splitC(l).forEach(x=>{x=x.trim().replace(/[.]+$/,'');if(x)out.push(qs(x))});continue}
if(mode==='z'&&qs(l)!==l){out.push(qs(l.replace(/[.]+$/,'')));continue}
out.push(mode==='z'?l.replace(/(\d)\.$/,'$1'):l)}
return out.join('\n')}
{const _p=rzParse;rzParse=function(raw){const r=_p(rzPre(raw));r.d.phasen.forEach(p=>p.z.forEach(z=>{if(!z.g){r.warn.push(z.name+': keine feste Menge, bitte ergänzen')}}));return r}}

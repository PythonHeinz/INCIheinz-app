ssung übernehmen.": "Tick = take the catalog version.", "Aktualisieren": "Update", "Es ist gerade kein Katalog-Update erreichbar. Prüfe die Internetverbindung und versuche es später noch einmal.": "No catalog update is reachable right now. Check your internet connection and try again later.", "Katalog aktualisiert": "Catalog updated", "Etiketten &amp; Druck": "Labels &amp; print", "Keine Rohstoffe": "No raw materials", "Lege zuerst Rohstoffe an, dann kannst du Etiketten drucken.": "Add raw materials first, then you can print labels.", "Größe": "Size", "Vorschau": "Preview", "Rohstoffe wählen": "Choose raw materials", "Keine": "None", "Noch nicht gedruckt": "Not yet printed", "Danach als gedruckt markieren": "Mark as printed afterwards", "Drucken": "Print", "Bitte Rohstoffe auswählen": "Please select raw materials", "Klein 38×21 mm": "Small 38×21 mm", "Mittel 48×25 mm": "Medium 48×25 mm", "Groß 63×38 mm": "Large 63×38 mm", "Der Druckdialog deines Geräts öffnet sich. Wähle dort „Tatsächliche Größe“ bzw. 100 %, damit die Etiketten maßgetreu bleiben.": "Your device’s print dialog opens. Choose “Actual size” or 100 % there so the labels keep their exact size.", "Code lesen oder ein Bild für einen Rohstoff aufnehmen.": "Read a code or take a picture for a raw material.", "Barcode / QR-Code": "Barcode / QR code", "Etikett oder Verpackung scannen": "Scan a label or packaging", "Foto aufnehmen": "Take photo", "Als Bild für einen Rohstoff": "As picture for a raw material", "Foto aus Galerie": "Photo from gallery", "Vorhandenes Bild zuordnen": "Assign an existing picture", "Code von Hand eingeben": "Enter code manually", "Artikelcode oder EAN": "Article code or EAN", "Öffnen": "Open", "Unbekannter Code": "Unknown code", "Dieser Code gehört noch zu keinem Rohstoff. Neu anlegen?": "This code does not belong to any raw material yet. Create a new one?", "Neuen Rohstoff anlegen": "Create new raw material", "Vorhandenem Rohstoff zuordnen": "Assign to existing raw material", "Zu welchem Rohstoff gehört der Code?": "Which raw material does the code belong to?", "Code gespeichert": "Code saved", "Zu welchem Rohstoff?": "Which raw material?", "Das Bild wird für diesen Rohstoff verwendet.": "The picture is used for this raw material.", "Code in den Rahmen halten": "Hold the code inside the frame", "Automatisches Scannen ist hier nicht möglich – bitte Code von Hand eingeben": "Automatic scanning is not possible here – please enter the code manually", "Kamera nicht erlaubt oder nicht verfügbar": "Camera not allowed or not available", "Ausschnitt wählen": "Choose crop", "Bild mit dem Finger verschieben, mit dem Regler vergrößern.": "Drag the picture with your finger, zoom with the slider.", "Weiter": "Next", "Bild nicht lesbar": "Image not readable", "Foto gespeichert": "Photo saved", "Foto entfernen": "Remove photo", "Überblick": "Overview", "Rohstoffe anlegen": "Add raw materials", "Bestand, Gefäße und Preise": "Stock, containers and prices", "Einkaufsliste": "Shopping list", "Etiketten drucken": "Printing labels", "Scannen und Fotos": "Scanning and photos", "Sichern und Import": "Backup and import", "Wenn etwas nicht klappt": "If something does not work", "INCIheinz ist dein privates Rohstofflager für Naturkosmetik: Du siehst, was da ist, was knapp wird, was bald abläuft und was du nachkaufen willst. Alle Daten bleiben auf diesem Gerät. Die App verwaltet nur dein Lager. Verwendung, Notizen und Beschreibungen schreibst du selbst.": "INCIheinz is your private raw-material store for natural cosmetics: you see what you have, what is running low, what expires soon and what you want to reorder. All data stays on this device. The app only manages your stock. You write usage, notes and descriptions yourself.", "Tippe in der Mitte auf „Neu“. Gib einen Namen ein und wähle einen Katalogtreffer, dann kommen INCI und Kategorie automatisch mit. Findest du nichts, legst du einen eigenen Rohstoff an. Die Menge darf leer bleiben. Alles Weitere ergänzt du auf der Rohstoff-Seite über den Stift.": "Tap “New” in the middle. Enter a name and pick a catalog match; INCI and category come along automatically. If you find nothing, create your own raw material. The quantity may stay empty. Add everything else on the raw material page with the pencil.", "Unter „Lager“ findest du den Regal-Check: Kategorie wählen, Regal durchgehen und antippen, was du hast. Die Mengen sind dann zunächst „?“ und werden nachgetragen, wenn du sie kennst.": "Under “Stock” you find the shelf check: choose a category, go through your shelf and tap what you have. Quantities show “?” at first and can be added later.", "Mit „Bestand ändern“ buchst du Zu- und Abgänge. Gefäße sind optional und nur nötig, wenn du Teilmengen getrennt verwalten willst. Bei „Bezugsquelle“ trägst du Lieferant, Preis und Menge ein. Jeder Preis wird mit Datum gespeichert, daraus entstehen Preisverlauf und Preis je 100 g/ml.": "Use “Change stock” to book additions and withdrawals. Containers are optional and only needed if you want to track partial quantities separately. Under “Source” you enter supplier, price and quantity. Every price is saved with a date, which gives you a price history and the price per 100 g/ml.", "Unter Mehr › Einstellungen verwaltest du deine Lieferanten mit Versandkosten, Grenze für kostenfreien Versand und Webseite. Neue Lieferanten legst du auch direkt bei der Bezugsquelle an. Die Lieferanten aus bereits erfassten Preisen werden automatisch übernommen.": "Under More › Settings you manage your suppliers with shipping costs, free-shipping threshold and website. You can also add new suppliers directly in the source dialog. Suppliers from prices already entered are adopted automatically.", "Rohstoffe setzt du über „Auf Einkaufsliste“ oder die Kachel „Knapp“. Die Liste ist nach Lieferant gruppiert und zeigt Versandkosten. Mit „Gekauft“ wird die Menge im Lager gebucht.": "Add raw materials via “Add to shopping list” or the “Low” tile. The list is grouped by supplier and shows shipping costs. “Bought” books the quantity into your stock.", "Unter Mehr › Etiketten & Druck wählst du eine Größe (klein 38×21, mittel 48×25, groß 63×38 mm) und die Rohstoffe. Auf jedem Etikett stehen QR-Code, Artikelcode, Name und INCI. Gedruckt wird über den Druckdialog deines Geräts, am besten mit „Tatsächliche Größe“ auf Etikettenbogen oder Papier zum Ausschneiden.": "Under More › Labels & print you choose a size (small 38×21, medium 48×25, large 63×38 mm) and the raw materials. Each label shows QR code, article code, name and INCI. Printing uses your device’s print dialog, best with “Actual size” on label sheets or paper to cut out.", "Im Tab „Scannen“ liest du QR- und Barcodes. Ein eigenes Etikett öffnet sofort den Rohstoff. Einen fremden Code, etwa den Barcode einer Verpackung, kannst du einem Rohstoff zuordnen oder dafür einen neuen anlegen. Mit „Foto aufnehmen“ oder „Foto aus Galerie“ gibst du einem Rohstoff ein kleines quadratisches Bild. Fotos bleiben auf dem Gerät.": "In the “Scan” tab you read QR codes and barcodes. One of your own labels opens the raw material immediately. A foreign code, such as a packaging barcode, can be assigned to a raw material or used to create a new one. With “Take photo” or “Photo from gallery” you give a raw material a small square picture. Photos stay on the device.", "Unter Mehr › Sicherung speicherst du eine Datei mit allen Daten inklusive Fotos. Mache das regelmäßig und vor einem Handywechsel. Zum Wiederherstellen wählst du Mehr › Import und die Datei. Mit dem Import kannst du auch eine Tabelle (CSV) einlesen. Sie braucht Überschriften, mindestens „Name“, gern auch INCI, Menge, Einheit, Preis, Quelle oder EAN. Doppelte Einträge werden übersprungen, vor dem Einlesen siehst du eine Vorschau.": "Under More › Backup you save a file with all data including photos. Do this regularly and before changing phones. To restore, choose More › Import and the file. Import can also read a table (CSV). It needs headings, at least “Name”, optionally INCI, quantity, unit, price, source or EAN. Duplicates are skipped, and you see a preview before importing.", "Unter Mehr › Katalog aktualisieren holt die App neue Katalogeinträge und INCI-Korrekturen. Deine Mengen, Preise, Texte und Fotos werden dabei nie verändert. Hast du eine INCI selbst geändert, fragt die App nach.": "Under More › Update catalog the app fetches new catalog entries and INCI corrections. Your quantities, prices, texts and photos are never changed. If you changed an INCI yourself, the app asks.", "Kamera geht nicht: Erlaube den Kamerazugriff in den Browser- oder App-Einstellungen oder gib den Code von Hand ein. Die Daten liegen im Browser dieses Geräts: Lösche keine Browserdaten, ohne vorher eine Sicherung zu machen. Zum Installieren wählst du im Browsermenü „Zum Startbildschirm hinzufügen“.": "Camera does not work: allow camera access in the browser or app settings, or enter the code by hand. The data lives in this device’s browser: do not delete browser data without making a backup first. To install, choose “Add to home screen” in the browser menu.", "Einkaufsliste exportieren": "Export shopping list", "Bestandstabelle exportieren": "Export stock table", "Aufbau": "Layout", "sortiert und gruppiert je Lieferant": "sorted and grouped by supplier", "eine Liste, alphabetisch": "one list, alphabetical", "Format": "Format", "Excel (.xlsx)": "Excel (.xlsx)", "empfohlen, öffnet sich überall korrekt": "recommended, opens correctly everywhere", "CSV (.csv)": "CSV (.csv)", "für Tabellen-Programme, UTF-8 mit Semikolon": "for spreadsheet programs, UTF-8 with semicolon", "Text": "Text", "zum Kopieren oder Teilen, z. B. per Messenger": "to copy or share, e.g. via messenger", "Nach Lieferant oder als ganze Liste": "By supplier or as one list", "Bestandstabelle": "Stock table", "Mit Filter, als Excel, CSV oder Text": "With filter, as Excel, CSV or text", "Sicherung der ganzen App": "Backup of the whole app", "Zum Wiederherstellen, z. B. auf ewhere, for example to your Google Drive, by email to yourself or to your PC. On a new phone you install the app, choose More › Import and the file, then “Replace everything”.", "Unter Mehr › Export bekommst du die Einkaufsliste (nach Lieferant oder als ganze Liste) und die Bestandstabelle. Du wählst vorher das Format: Excel (empfohlen), CSV oder Text zum Kopieren und Teilen. Bei der Bestandstabelle filterst du, welche Rohstoffe und welche Spalten dabei sein sollen, zum Beispiel nur abgelaufene oder nur Rohstoffe über einem Preis. Das ist etwas anderes als die Sicherung, die immer die ganze App enthält.": "Under More › Export you get the shopping list (by supplier or as one list) and the stock table. You choose the format first: Excel (recommended), CSV or text to copy and share. For the stock table you filter which raw materials and columns to include, for example only expired ones or only raw materials above a price. This is different from the backup, which always contains the whole app.", "Aus Produktseite übernehmen": "Take from product page", "Produktseite einfügen": "Paste product page", "Text einer Lieferantenseite übernehmen": "Take over text from a supplier page", "Stammdaten": "Master data", "Auslesen": "Read", "Das wurde gefunden": "This was found", "Abgewählte Angaben werden nicht übernommen.": "Deselected items are not applied.", "Artikelnummer (beim Bezug)": "Article number (at source)", "Link (Quelle)": "Link (source)", "Preise": "Prices", "Lieferant für diese Preise": "Supplier for these prices", "Rohstoff anlegen": "Create raw material", "Übernommen – bitte kurz prüfen": "Applied – please check briefly", "Rohstoff angelegt – bitte kurz prüfen": "Raw material created – please check briefly", "Bitte einen Lieferanten für die Preise wählen oder die Preise abwählen.": "Please choose a supplier for the prices or deselect the prices.", "Es wurden keine verwertbaren Angaben gefunden. Kopiere bitte etwas mehr Text der Seite, z. B. mit Produktname, INCI und Preisen.": "No usable details found. Please copy more text from the page, e.g. with product name, INCI and prices.", "Öffne die Produktseite deines Lieferanten, kopiere den Text (oder die wichtigen Teile) und füge ihn hier ein. Die App liest nur Fakten aus: Name, INCI, Artikelnummer, Form und Preise. Beschreibungstexte werden nicht übernommen. Du siehst vorher eine Vorschau.": "Open your supplier’s product page, copy the text (or the important parts) and paste it here. The app only reads facts: name, INCI, article number, form and prices. Description texts are not taken over. You see a preview first.", "Achtung: Haltbarkeit abgelaufen": "Warning: expired", "Produktseite übernehmen": "Import product page", "Text einfügen oder Foto/Screenshot lesen": "Paste text or read a photo/screenshot", "Menge unter Mindestbestand": "Below minimum stock", "Menge über Mindestbestand": "Above minimum stock", "Menge in Ordnung": "Quantity OK", "Nicht vorrätig": "Out of stock", "Vorrätig": "In stock", "Kein Haltbarkeitsdatum": "No expiry date"},pats:[["^Haltbar bis (.*)$", "Best before $1"], ["^Haltbarkeit abgelaufen \\((.*)\\)$", "Expired ($1)"], ["^Läuft bald ab \\((.*)\\)$", "Expires soon ($1)"], ["^Achtung: Haltbarkeit abgelaufen \\((.*)\\)$", "Warning: expired ($1)"], ["^Platz (\\d)$", "Slot $1"], ["^Katalog (\\S+) vom (.*) · (\\d+) Einträge$", "Catalog $1 of $2 · $3 entries"], ["^geprüft am (.*)$", "checked on $1"], ["^Quelle: (.*)$", "Source: $1"], ["^Quelle: (.*) · geprüft am (.*)$", "Source: $1 · checked on $2"], ["^Installiert: (.*) · (\\d+) Einträge$", "Installed: $1 · $2 entries"], ["^(.*) · zum Lager hinzufügen$", "$1 · add to stock"], ["^Zum Lesen von Bildern lädt die App einmalig ein kleines Lesemodul \\(ca\\. (\\d+,\\d) MB\\) und speichert es auf dem Gerät\\. Danach funktioniert das Lesen auch ohne Internet\\. Dein Bild wird nur auf dem Gerät verarbeitet und nirgendwohin gesendet\\.$", "To read images, the app downloads a small reader module once (approx. $1 MB) and stores it on your device. After that, reading also works offline. Your image is processed only on your device and never sent anywhere."], ["^Text wird gelesen … (\\d+) %$", "Reading text … $1 %"], ["^Letzte Sicherung: (.+)$", "Last backup: $1"], ["^(\\d+) Etikett drucken$", "Print $1 label"], ["^(\\d+) Codes erkannt$", "$1 codes detected"], ["^(\\d+) Rohstoffe? (?:wird|werden) exportiert$", "$1 raw materials will be exported"], ["^(\\d+) Rohstoffe sind leer oder unter dem Mindestbestand\\.$", "$1 raw materials are empty or below the minimum stock."], ["^(\\d+) Rohstoffe? haben nur einen Lieferanten, dort gibt es keinen Vergleich\\.$", "$1 raw materials have only one supplier, so there is no comparison."], ["^Noch ([\\d.,]+ €) bis versandkostenfrei$", "$1 more until free shipping"], ["^(\\d+) abgelaufen · (\\d+) in 30 Tagen$", "$1 expired · $2 within 30 days"], ["^(\\d+) Kategorien$", "$1 categories"], ["^(\\d+) auf der Liste$", "$1 on the list"], ["^(\\d+) auf der Liste · (\\d+) knapp$", "$1 on the list · $2 low"], ["^(\\d+) von (\\d+) Rohstoffen mit Preis$", "$1 of $2 raw materials with price"], ["^Verfolge bis zu 5 Rohstoffe \\((\\d+) / 5\\)\\. Mit einem Rohstoff siehst du den Preis je 100 g/ml\\.$", "Follow up to 5 raw materials ($1 / 5). With one raw material you see the price per 100 g/ml."], ["^Verfolge bis zu 5 Rohstoffe \\((\\d+) / 5\\)\\. Mehrere Linien werden als Änderung in Prozent seit dem ersten Preis verglichen\\.$", "Follow up to 5 raw materials ($1 / 5). Several lines are compared as percentage change since the first price."], ["^Katalog: (.+)$", "Catalog: $1"], ["^Deine: (.+)$", "Yours: $1"], ["^Katalog (.*) · (\\d+) Einträge$", "Catalog $1 · $2 entries"], ["^· gedruckt (.+)$", "· printed $1"], ["^frei ab (.+)$", "free from $1"], ["^Versand (.+)$", "Shipping $1"], ["^Versand (.+) · frei ab (.+)$", "Shipping $1 · free from $2"], ["^… und (\\d+) weitere$", "… and $1 more"], ["^(\\d+) neuer? Eintr(?:ag|äge), (\\d+) INCI-Korrekturen?$", "$1 new entries, $2 INCI corrections"], ["^Alle (\\d+) Einträge sind schon im Lager\\.$", "All $1 entries are already in stock."], ["^Du hast aktuell (\\d+) Rohstoffe\\. Wähle, wie die Sicherung übernommen werden soll\\.$", "You currently have $1 raw materials. Choose how to apply the backup."], ["^(\\d+) Rohstoffe in der Datei$", "$1 raw materials in the file"], ["^(\\d+) Etiketten drucken$", "Print $1 labels"], ["^(\\d+) Rohstoffe ergänzt$", "$1 raw materials added"], ["^(\\d+) Rohstoffe hinzugefügt$", "$1 raw materials added"], ["^(\\d+) hinzufügen$", "Add $1"], ["^(\\d+) neu, (\\d+) schon vorhanden$", "$1 new, $2 already there"], ["^(\\d+) Posten auf der Liste$", "$1 items on the list"], ["^Noch (.+) bis versandkostenfrei$", "$1 more to free shipping"], ["^Summe inkl\\. (.+) Versand$", "Total incl. $1 shipping"], ["^Aktuell im Lager: (.+)\\. Du kannst den Rohstoff auch setzen, wenn noch etwas da ist\\.$", "Currently in stock: $1. You can also add it while some is left."], ["^Nenninhalt (.+)$", "Nominal volume $1"], ["^Füllstand \\((.+)\\)$", "Fill level ($1)"], ["^Mindestmenge \\((.+)\\)$", "Minimum quantity ($1)"], ["^Versand: (.+)$", "Shipping: $1"], ["^Nur (.+)$", "Only $1"], ["^(\\d+) Posten$", "$1 items"], ["^„(.+)“ neu anlegen$", "Create “$1”"], ["^„(.+)“ wird mit allen Gefäßen, Texten und Preisen aus deinem Lager gelöscht\\. Der Katalog bleibt unverändert\\.$", "“$1” will be deleted from your stock together with all containers, texts and prices. The catalog stays unchanged."], ["^(\\d+) Gefäße? hinzugefügt$", "$1 container(s) added"], ["^Die Gesamtmenge liegt unter der Summe der Gefäße \\((.+)\\)\\. Bitte zuerst den Füllstand eines Gefäßes anpassen\\.$", "The total is below the sum of the containers ($1). Please adjust a container's fill level first."], ["^Der Füllstand ist größer als der Nenninhalt \\((.+)\\)\\.$", "The fill level is larger than the nominal volume ($1)."], ["^Tippe einen Namen – der Katalog enthält (\\d+) Einträge\\.$", "Type a name – the catalog contains ffe wählen": "Elegir materias primas", "Keine": "Ninguna", "Noch nicht gedruckt": "Aún no impresas", "Danach als gedruckt markieren": "Marcar como impresa después", "Drucken": "Imprimir", "Bitte Rohstoffe auswählen": "Selecciona materias primas", "Klein 38×21 mm": "Pequeña 38×21 mm", "Mittel 48×25 mm": "Mediana 48×25 mm", "Groß 63×38 mm": "Grande 63×38 mm", "Der Druckdialog deines Geräts öffnet sich. Wähle dort „Tatsächliche Größe“ bzw. 100 %, damit die Etiketten maßgetreu bleiben.": "Se abre el diálogo de impresión de tu dispositivo. Elige allí „Tamaño real“ o 100 % para que las etiquetas mantengan su medida.", "Code lesen oder ein Bild für einen Rohstoff aufnehmen.": "Lee un código o toma una foto para una materia prima.", "Barcode / QR-Code": "Código de barras / QR", "Etikett oder Verpackung scannen": "Escanea una etiqueta o un envase", "Foto aufnehmen": "Tomar foto", "Als Bild für einen Rohstoff": "Como imagen de una materia prima", "Foto aus Galerie": "Foto de la galería", "Vorhandenes Bild zuordnen": "Asignar una imagen existente", "Code von Hand eingeben": "Introducir código a mano", "Artikelcode oder EAN": "Código de artículo o EAN", "Öffnen": "Abrir", "Unbekannter Code": "Código desconocido", "Dieser Code gehört noch zu keinem Rohstoff. Neu anlegen?": "Este código aún no pertenece a ninguna materia prima. ¿Crear una nueva?", "Neuen Rohstoff anlegen": "Crear materia prima nueva", "Vorhandenem Rohstoff zuordnen": "Asignar a una materia prima existente", "Zu welchem Rohstoff gehört der Code?": "¿A qué materia prima pertenece el código?", "Code gespeichert": "Código guardado", "Zu welchem Rohstoff?": "¿A qué materia prima?", "Das Bild wird für diesen Rohstoff verwendet.": "La imagen se usará para esta materia prima.", "Code in den Rahmen halten": "Sitúa el código dentro del marco", "Automatisches Scannen ist hier nicht möglich – bitte Code von Hand eingeben": "Aquí no se puede escanear automáticamente: introduce el código a mano", "Kamera nicht erlaubt oder nicht verfügbar": "Cámara no permitida o no disponible", "Ausschnitt wählen": "Elegir recorte", "Bild mit dem Finger verschieben, mit dem Regler vergrößern.": "Mueve la imagen con el dedo y amplíala con el control.", "Weiter": "Siguiente", "Bild nicht lesbar": "Imagen ilegible", "Foto gespeichert": "Foto guardada", "Foto entfernen": "Quitar foto", "Überblick": "Resumen", "Rohstoffe anlegen": "Añadir materias primas", "Bestand, Gefäße und Preise": "Existencias, recipientes y precios", "Einkaufsliste": "Lista de la compra", "Etiketten drucken": "Imprimir etiquetas", "Scannen und Fotos": "Escanear y fotos", "Sichern und Import": "Copia e importación", "Wenn etwas nicht klappt": "Si algo no funciona", "INCIheinz ist dein privates Rohstofflager für Naturkosmetik: Du siehst, was da ist, was knapp wird, was bald abläuft und was du nachkaufen willst. Alle Daten bleiben auf diesem Gerät. Die App verwaltet nur dein Lager. Verwendung, Notizen und Beschreibungen schreibst du selbst.": "INCIheinz es tu almacén privado de materias primas para cosmética natural: ves lo que tienes, lo que se acaba, lo que caduca pronto y lo que quieres volver a comprar. Todos los datos se quedan en este dispositivo. La app solo gestiona tus existencias. El uso, las notas y las descripciones los escribes tú.", "Tippe in der Mitte auf „Neu“. Gib einen Namen ein und wähle einen Katalogtreffer, dann kommen INCI und Kategorie automatisch mit. Findest du nichts, legst du einen eigenen Rohstoff an. Die Menge darf leer bleiben. Alles Weitere ergänzt du auf der Rohstoff-Seite über den Stift.": "Toca „Nuevo“ en el centro. Escribe un nombre y elige una coincidencia del catálogo; el INCI y la categoría se añaden solos. Si no encuentras nada, crea tu propia materia prima. La cantidad puede quedar vacía. Lo demás lo añades en la página de la materia prima con el lápiz.", "Unter „Lager“ findest du den Regal-Check: Kategorie wählen, Regal durchgehen und antippen, was du hast. Die Mengen sind dann zunächst „?“ und werden nachgetragen, wenn du sie kennst.": "En „Almacén“ está la revisión de estantes: elige una categoría, repasa tu estante y toca lo que tienes. Las cantidades aparecen primero como „?“ y las añades cuando las sepas.", "Mit „Bestand ändern“ buchst du Zu- und Abgänge. Gefäße sind optional und nur nötig, wenn du Teilmengen getrennt verwalten willst. Bei „Bezugsquelle“ trägst du Lieferant, Preis und Menge ein. Jeder Preis wird mit Datum gespeichert, daraus entstehen Preisverlauf und Preis je 100 g/ml.": "Con „Cambiar existencias“ registras entradas y salidas. Los recipientes son opcionales y solo hacen falta si quieres gestionar cantidades parciales por separado. En „Fuente de compra“ introduces proveedor, precio y cantidad. Cada precio se guarda con fecha; así se crea el historial de precios y el precio por 100 g/ml.", "Unter Mehr › Einstellungen verwaltest du deine Lieferanten mit Versandkosten, Grenze für kostenfreien Versand und Webseite. Neue Lieferanten legst du auch direkt bei der Bezugsquelle an. Die Lieferanten aus bereits erfassten Preisen werden automatisch übernommen.": "En Más › Ajustes gestionas tus proveedores con gastos de envío, límite de envío gratis y página web. También puedes añadir proveedores nuevos directamente en la fuente de compra. Los proveedores de precios ya introducidos se adoptan automáticamente.", "Rohstoffe setzt du über „Auf Einkaufsliste“ oder die Kachel „Knapp“. Die Liste ist nach Lieferant gruppiert und zeigt Versandkosten. Mit „Gekauft“ wird die Menge im Lager gebucht.": "Añade materias primas con „A la lista de la compra“ o con el icono „Poco“. La lista está agrupada por proveedor y muestra los gastos de envío. Con „Comprado“ se registra la cantidad en el almacén.", "Unter Mehr › Etiketten & Druck wählst du eine Größe (klein 38×21, mittel 48×25, groß 63×38 mm) und die Rohstoffe. Auf jedem Etikett stehen QR-Code, Artikelcode, Name und INCI. Gedruckt wird über den Druckdialog deines Geräts, am besten mit „Tatsächliche Größe“ auf Etikettenbogen oder Papier zum Ausschneiden.": "En Más › Etiquetas e impresión eliges un tamaño (pequeña 38×21, mediana 48×25, grande 63×38 mm) y las materias primas. Cada etiqueta lleva código QR, código de artículo, nombre e INCI. Se imprime con el diálogo de impresión del dispositivo, mejor con „Tamaño real“ en hojas de etiquetas o papel para recortar.", "Im Tab „Scannen“ liest du QR- und Barcodes. Ein eigenes Etikett öffnet sofort den Rohstoff. Einen fremden Code, etwa den Barcode einer Verpackung, kannst du einem Rohstoff zuordnen oder dafür einen neuen anlegen. Mit „Foto aufnehmen“ oder „Foto aus Galerie“ gibst du einem Rohstoff ein kleines quadratisches Bild. Fotos bleiben auf dem Gerät.": "En la pestaña „Escanear“ lees códigos QR y de barras. Una etiqueta propia abre la materia prima al instante. Un código ajeno, por ejemplo el de un envase, puedes asignarlo a una materia prima o crear una nueva. Con „Tomar foto“ o „Foto de la galería“ das a una materia prima una pequeña imagen cuadrada. Las fotos se quedan en el dispositivo.", "Unter Mehr › Sicherung speicherst du eine Datei mit allen Daten inklusive Fotos. Mache das regelmäßig und vor einem Handywechsel. Zum Wiederherstellen wählst du Mehr › Import und die Datei. Mit dem Import kannst du auch eine Tabelle (CSV) einlesen. Sie braucht Überschriften, mindestens „Name“, gern auch INCI, Menge, Einheit, Preis, Quelle oder EAN. Doppelte Einträge werden übersprungen, vor dem Einlesen siehst du eine Vorschau.": "En Más › Copia guardas un archivo con todos los datos, fotos incluidas. Hazlo con regularidad y antes de cambiar de móvil. Para restaurar, elige Más › Importar y el archivo. La importación también lee tablas (CSV). Necesita encabezados, como mínimo „Name“, y opcionalmente INCI, cantidad, unidad, precio, fuente o EAN. Los duplicados se omiten y antes de importar ves una vista previa.", "Unter Mehr › Katalog aktualisieren holt die App neue Katalogeinträge und INCI-Korrekturen. Deine Mengen, Preise, Texte und Fotos werden dabei nie verändert. Hast du eine INCI selbst geändert, fragt die App nach.": "En Más › Actualizar catálogo la app descarga entradas nuevas e correcciones de INCI. Tus cantidades, precios, textos y fotos nunca se modifican. Si cambiaste un INCI tú mismo, la app pregunta.", "Kamera geht nicht: Erlaube den Kamerazugriff in den Browser- oder App-Einstellungen oder gib den Code von Hand ein. Die Daten liegen im Browser dieses Geräts: Lösche keine Browserdaten, ohne vorher eine Sicherung zu machen. Zum Installieren wählst du im Browsermenü „Zum Startbildschirm hinzufügen“.": "La cámara no funciona: permite el acceso a la cámara en los ajustes del navegador o de la app, o introduce el código a mano. Los datos están en el navegador de este dispositivo: no borres los datos del navegador sin hacer antes una copia. Para instalarla, elige „Añadir a la pantalla de inicio“ en el menú del navegador.", "Einkaufsliste exportieren": "Exportar lista de la compra", "Bestandstabelle exportieren": "Exportar tabla de existencias", "Aufbau": "Estructura", "sortiert und gruppiert je Lieferant": "ordenada y agrupada por proveedor", "eine Liste, alphabetisch": "una lista, alfabética", "Format": "Formato", "Excel (.xlsx)": "Excel (.xlsx)", "empfohlen, öffnet sich überall korrekt": "recomendado, se abre bien en todas partes", "CSV (.csv)": "CSV (.csv)", "für Tabellen-Programme, UTF-8 mit Semikolon": "para programas de hojas de cálculo, UTF-8 con punto y coma", "Text": "Texto", "zum Kopieren oder Teilen, z. B. per Messenger": "para copiar o compartir, p. ej. por mensajería", "Nach Lieferant oder als ganze Liste": "Por proveedor o como una sola lista", "Bestandstabelle": "Tabla de existencias", "Mit Filter, als Excel, CSV oder Text": "Con filtro, como Excel, CSV o texto", "Sicherung der ganzen App": "Copia de seguridad de toda la app", "Zum Wiederherstellen, z. B. auf einem neuen Handy": "Para restaurar, p. ej. en un móvil nuevo", "Welche Rohstoffe?": "¿Qué materias primas?", "Alle (auch aufgebrauchte)": "Todas (también las agotadas)", "Nur mit Bestand": "Solo con existencias", "Nur knappe (unter Mindestmenge)": "Solo las escasas (bajo el mínimo)", "Läuft in 30 Tagen ab oder abgelaufen": "Caduca en 30 días o ya caducada", "Nur abgelaufene": "Solo caducadas", "Nur aufgebrauchte": "Solo agotadas", "Preis ab (€)": "Precio desde (€)", "Preis bis (€)": "Precio hasta (€)", "Der Preis bezieht sich auf den zuletzt erfassten Bezug.": "El precio se refiere a la última compra registrada.", "Exportieren": "Exportar", "Kein Rohstoff passt zum Filter": "Ninguna materia prima coincide con el filtro", "Bitte mindestens eine Spalte wählen": "Elige al menos una columna", "Einkaufsliste leer": "Lista de la compra vacía", "Es gibt nichts zu exportieren.": "No hay nada que exportar.", "Excel-Datei gespeichert": "Archivo Excel guardado", "CSV-Datei gespeichert": "Archivo CSV guardado", "Teilen": "Compartir", "Sicherung jetzt speichern": "Guardar copia ahora", "Noch keine Sicherung erstellt.": "Aún no se ha creado ninguna copia.", "Sicherung im Ordner „Downloads“ gespeichert": "Copia guardada en la carpeta „Descargas“", "Aus Galerie": "De la galería", "Wo liegt meine Sicherung?": "¿Dónde está mi copia de seguridad?", "Export als Excel, CSV oder Text": "Exportar como Excel, CSV o texto", "Die Sicherung ist eine .json-Datei und landet im Download-Ordner deines Handys. Die Daten der App selbst liegen nur im Browser dieses Handys und sind weg, wenn du die App deinstallierst oder Browserdaten löschst. Kopiere die Sicherungsdatei deshalb nach außen, zum Beispiel in dein Google Drive, per E-Mail an dich selbst oder auf den PC. Auf einem neuen Handy installierst du die App, wählst Mehr › Import und die Datei und dann „Alles ersetzen“.": "La copia es un archivo .json y se guarda en la carpeta de descargas del móvil. Los datos de la app solo están en el navegador de este móvil y se pierden si desinstalas la app o borras los datos del navegador. Por eso copia el archivo a otro sitio, por ejemplo a tu Google Drive, por correo a ti mismo o al PC. En un móvil nuevo instalas la app, eliges Más › Importar y el archivo, y luego „Reemplazarlo todo“.", "Unter Mehr › Export bekommst du die Einkaufsliste (nach Lieferant oder als ganze Liste) und die Bestandstabelle. Du wählst vorher das Format: Excel (empfohlen), CSV oder Text zum Kopieren und Teilen. Bei der Bestandstabelle filterst du, welche Rohstoffe und welche Spalten dabei sein sollen, zum Beispiel nur abgelaufene oder nur Rohstoffe über einem Preis. Das ist etwas anderes als die Sicherung, die immer die ganze App enthält.": "En Más › Exportar obtienes la lista de la compra (por proveedor o como una lista) y la tabla de existencias. Primero eliges el formato: Excel (recomendado), CSV o texto para copiar y compartir. En la tabla de existencias filtras qué materias primas y columnas incluir, por ejemplo solo caducadas o solo por encima de un precio. Es distinto de la copia de seguridad, que siempre contiene toda la app.", "Aus Produktseite übernehmen": "Tomar de la página del producto", "Produktseite einfügen": "Pegar página del producto", "Text einer Lieferantenseite übernehmen": "Usar el texto de la página de un proveedor", "Stammdaten": "Datos básicos", "Auslesen": "Leer", "Das wurde gefunden": "Esto se encontró", "Abgewählte Angaben werden nicht übernommen.": "Lo desmarcado no se aplica.", "Artikelnummer (beim Bezug)": "Número de artículo (en la compra)", "Link (Quelle)": "Enlace (fuente)", "Preise": "Precios", "Lieferant für diese Preise": "Proveedor para estos precios", "Rohstoff anlegen": "Crear materia prima", "Übernommen – bitte kurz prüfen": "Aplicado: revísalo un momento", "Rohstoff angelegt – bitte kurz prüfen": "Materia prima creada: revísala un momento", "Bitte einen Lieferanten für die Preise wählen oder die Preise abwählen.": "Elige un proveedor para los precios o desmarca los precios.", "Es wurden keine verwertbaren Angaben gefunden. Kopiere bitte etwas mehr Text der Seite, z. B if(nm.startsWith(t))b=100;else if(wst(f.n,t))b=80;else if(wst(f.a,t))b=60;
else if(L>=2&&L<=5&&inits(f).includes(t))b=55;else if(ABBR[t]&&String(f.i||'').toLowerCase().includes(ABBR[t]))b=55;else if(L>=3&&wst(f.i,t))b=50;else if(L>=3&&wst(f.k,t))b=20;
else if(L>=3&&(wst(f.v,t)||wst(f.b,t)||wst(f.z,t)))b=10;else if(L>=4&&((f.v||'')+(f.b||'')+(f.z||'')).toLowerCase().includes(t))b=6;
if(!b)return 0;tot+=b}return tot}
function fields(i){const c=i.cid?CM[i.cid]:null;return {n:i.name,i:i.inci,k:i.kat,a:c?c.a:'',v:i.verw,b:i.beschr,z:i.notiz+' '+i.quelle}}
function match(i,q){const terms=q.toLowerCase().split(/\s+/).filter(Boolean);if(!terms.length)return {ok:true,s:0};const f=fields(i);const s=score(f,terms);if(!s)return {ok:false};
let hit='';const t=terms.find(t=>t.length>=3&&!wst(f.n,t)&&!wst(f.i,t)&&!wst(f.a,t));
if(t){for(const [lb,tx] of [['Verwendung',i.verw],['Beschreibung',i.beschr],['Notiz',i.notiz]]){const p=String(tx||'').toLowerCase().indexOf(t);if(p>=0){hit=lb+': …'+tx.slice(Math.max(0,p-14),p+30)+'…';break}}}
return {ok:true,s,hit}}

$('#pg').onclick=()=>{const r=parseInci(val('pt'));if(!r){$('#er').textContent='Keine INCI-Zeile gefunden. Bitte von Hand eintragen.';return}closeSheet();$('#f_inci').value=r;$('#f_ok').checked=false;dirty();toast('INCI übernommen – bitte prüfen')}}

const tb=toB(t,u);if(tb<vsum(i)-1e-9){$('#er').textContent=`Die Gesamtmenge liegt unter der Summe der Gefäße (${fmt(vsum(i),i.kind)}). Bitte zuerst den Füllstand eines Gefäßes anpassen.`;return}
const chg=nk!==i.kind;if(chg){i.kind=nk;i.min=0;i.bezug.forEach(b=>b.kind=nk)}i.total=tb;i.unk=false;save();draw();if(chg)toast('Preise bitte prüfen')}

function saveVessel(id){const i=getI(id);const n=Math.max(1,Math.round(num(val('vn'))||1));const u=val('vu');const c=num(val('vc'));if(!(c>0)){$('#er').textContent='Bitte den Nenninhalt eingeben.';return}

i.unk=false;i.total+=n*f;

i.total=Math.max(0,i.total+(nb-v.amount));v.amount=nb;v.ort=VS.ort;save();draw()}

let out=k;for(const [re,rep] of d.fb)out=out.replace(re,()=>rep);return out===k?s:s.replace(k,()=>out)}
function trWalk(root){if(LANG==='de'||!root)return;if(root.nodeType===3){trNode(root);return}if(root.nodeType!==1)return;
const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let n;const l=[];while(n=w.nextNode())l.push(n);l.forEach(trNode);
const els=root.matches&&root.matches('[placeholder],[aria-label],[title],optgroup')?[root]:[];root.querySelectorAll('[placeholder],[aria-label],[title],optgroup').forEach(e=>els.push(e));
els.forEach(e=>['placeholder','aria-label','title','label'].forEach(a=>{if(e.hasAttribute(a)){const v=e.getAttribute(a),r=trStr(v);if(r!==v)e.setAttribute(a,r)}}))}

function dlFile(name,text,mime){const b=new Blob([text],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function doBackup(){closeSheet();dlFile('inciheinz-sicherung-'+today()+'.json',JSON.stringify(Object.assign({app:'inciheinz',v:1},S)),'application/json');toast('Sicherung gespeichert')}
function sheetExport(){openSheet(`<h2>Export</h2>`+[['shield','Sicherung (Datei)','Alles inklusive Fotos, zum Wiederherstellen','sheetBackup()'],['export','Bestandsliste (Tabelle)','CSV für Excel oder Tabellen','doCsv()']].map(x=>`<div class="row" style="padding:0 2px" onclick="${x[3]}"><div style="width:32px;display:flex;justify-content:center">${ic(x[0],'var(--pri)')}</div><div class="t"><b>${x[1]}</b><div class="s">${x[2]}</div></div>${ic('chev','var(--sub)',18)}</div>`).join(''))}
function doCsv(){closeSheet();const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';const rows=[['Name','INCI','Kategorie','Menge','Einheit','EAN','MHD','Verwendung','Notiz','Lieferant','Preis','Preis für Menge']];
S.items.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(i=>{const b=i.bezug.slice().reverse().sort((x,y)=>x.datum<y.datum?1:x.datum>y.datum?-1:0)[0];rows.push([i.name,i.inci,i.kat,i.unk?'':nf(i.total,3),BASE[i.kind],i.ean||'',i.mhd||'',i.verw,i.notiz,b?b.lief:'',b?nf(b.preis,2):'',b?nf(b.menge,3):''])});
dlFile('inciheinz-bestand-'+today()+'.csv','﻿'+rows.map(r=>r.map(q).join(';')).join('\r\n'),'text/csv');toast('Tabelle gespeichert')}
function parseCSV(text){text=String(text||'').replace(/^﻿/,'');const first=text.split(/\r?\n/,1)[0]||'';let d=';',best=-1;[';',',','\t'].forEach(c=>{const n=first.split(c).length;if(n>best){best=n;d=c}});
const rows=[];let row=[],cell='',q=false;for(let i=0;i<text.length;i++){const ch=text[i];if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}else if(ch==='"')q=true;else if(ch===d){row.push(cell);cell=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';rows.push(row);row=[]}else cell+=ch}
if(cell!==''||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(c=>String(c).trim()!==''))}
const COLMAP={name:['name','bezeichnung','produkt','produktname','zutat','rohstoff','artikel'],inci:['inci','incibezeichnung','incideklaration'],kategorie:['kategorie','gruppe','typ'],form:['form','konsistenz'],menge:['menge','bestand','anzahl'],einheit:['einheit'],preis:['preis','kosten'],quelle:['quelle','lieferant','shop','link','bezugsquelle'],verwendung:['verwendung','wirkweise','wirkung','anwendung'],mhd:['mhd','haltbarkeit','mindesthaltbarbis'],notiz:['notiz','bemerkung','anmerkung','kommentar'],beschreibung:['beschreibung','info'],ean:['ean','barcode','gtin','ean13']};
function pNum(s){s=String(s||'').replace(/[^\d,.\-]/g,'');if(!s)return null;if(s.includes(',')&&s.includes('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(',','.');const n=parseFloat(s);return isNaN(n)?null:n}
function pDate(v){v=String(v||'').trim();const m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m)return m[3]+'-'+('0'+m[2]).slice(-2)+'-'+('0'+m[1]).slice(-2);return /^\d{4}-\d{2}-\d{2}$/.test(v)?v:''}
let IMP=null;
function csvPlan(rows){if(rows.length<2)return {error:'Die Datei enthält keine Datenzeilen.'};
const head=rows[0].map(h=>FOLD(h).replace(/[^a-z0-9]/g,''));const col={};Object.keys(COLMAP).forEach(k=>{for(let i=0;i<head.length;i++)if(COLMAP[k].includes(head[i])&&col[k]==null)col[k]=i});
if(col.name==null)return {error:'Keine Spalte „Name“ gefunden. Die erste Zeile braucht Überschriften, zum Beispiel: Name; INCI; Menge.'};
const haveN={},haveC={},haveE={};S.items.forEach(i=>{haveN[FOLD(i.name)]=1;if(i.cid)haveC[i.cid]=1;if(i.ean)haveE[i.ean]=1});
const kats=[...new Set(CAT.map(c=>c.k))];const neu=[];let schon=0,leer=0;const seen={};
for(let r=1;r<rows.length;r++){const row=rows[r];const g=k=>col[k]==null?'':String(row[col[k]]==null?'':row[col[k]]).trim();
const name=g('name');if(!name){leer++;continue}const key=FOLD(name);const c=CAT.find(x=>FOLD(x.n)===key)||null;const ean=g('ean').replace(/\s+/g,'');
if(haveN[key]||seen[key]||(c&&haveC[c.id])||(ean&&haveE[ean])){schon++;continue}seen[key]=1;
const eh=g('einheit');const u=Object.keys(U).find(x=>FOLD(x)===FOLD(eh))||'g';const mg=pNum(g('menge'));const kind=U[u].k;const total=mg>0?toB(mg,u):0;
const inci=g('inci');const kt=FOLD(g('kategorie'));const kat=kt?kats.find(k=>{const x=FOLD(k);return x===kt||x.startsWith(kt)||kt.startsWith(x)}):null;
let note=g('notiz');if(g('kategorie')&&!kat&&!c)note=(note?note+' · ':'')+'Kategorie (Import): '+g('kategorie');
const pr=pNum(g('preis').replace(/[€\s]/g,''));const q=g('quelle');
const o={kind,total,unk:mg==null,verw:g('verwendung'),beschr:g('beschreibung'),mhd:pDate(g('mhd')),ean,quelle:q};
let it;if(c){it=mk(c,o);if(inci&&FOLD(inci)!==FOLD(c.i)){it.inci=inci;it.ist='ungeprüft'}}else{it=mk(null,Object.assign(o,{name,inci,ist:inci?'ungeprüft':'eigen',kat:kat||'Eigene',form:FORMS_OK(g('form'))}))}
if(pr!=null&&mg>0){it.bezug.push({id:uid(),lief:q&&!/^https?:/i.test(q)?q:'Import',nr:'',preis:pr,menge:total,kind,datum:today()})}else if(pr!=null){note=(note?note+' · ':'')+'Preis (Import): '+nf(pr,2)+' €'}
it.notiz=note;neu.push(it)}
return {neu,schon,leer,cols:Object.keys(col).length}}
function FORMS_OK(f){return ['flüssig','fest','pulver','pastös'].find(x=>FOLD(x)===FOLD(f))||''}
function doImport(inp){const f=inp.files[0];if(!f)return;if(/\.xlsx$/i.test(f.name)){f.arrayBuffer().then(b=>{inp.value='';return xlsxRows(b)}).then(rows=>{const p=csvPlan(rows);if(p.error){sheetMsg('Einlesen nicht möglich',p.error);return}IMP={plan:p};sheetImpPrev()}).catch(()=>sheetMsg('Datei nicht lesbar','Die Excel-Datei konnte nicht gelesen werden. Speichere sie als .xlsx oder .csv.'));return}
f.text().then(t=>{inp.value='';t=t.replace(/^﻿/,'');
if(/^\s*\{/.test(t)){try{const d=JSON.parse(t);if(!Array.isArray(d.items))throw 0;IMP={json:d};sheetRestore()}catch(e){sheetMsg('Datei nicht lesbar','Das ist keine gültige Sicherungsdatei.')}return}
const p=csvPlan(parseCSV(t));if(p.error){sheetMsg('Einlesen nicht möglich',p.error);return}IMP={plan:p};sheetImpPrev()})}
function sheetMsg(h,t){openSheet(`<h2>${h}</h2><div style="font-size:.9rem">${esc(t)}</div><div class="btns"><button class="btn" onclick="closeSheet()">OK</button></div>`)}
function sheetImpPrev(){const p=IMP.plan;if(!p.neu.length){sheetMsg('Nichts Neues','Alle '+p.schon+' Einträge sind schon im Lager.');return}
openSheet(`<h2>Tabelle einlesen</h2><div style="font-size:1rem;font-weight:600">${p.neu.length} neu, ${p.schon} schon vorhanden</div><div class="s" style="margin-top:4px">Schon vorhandene Rohstoffe werden nicht verändert. Fehlende Angaben ergänzt du später in der App.</div>
<div class="card" style="margin-top:10px;padding:4px 14px">${p.neu.slice(0,8).map(i=>`<div class="kv"><span>${esc(i.name)}</span><span class="s">${i.unk?'Menge offen':fmt(i.total,i.kind)}</span></div>`).join('')}${p.neu.length>8?`<div class="s" style="padding:8px 0">… und ${p.neu.length-8} weitere</div>`:''}</div>
<div class="btns"><button class="btn" onclick="impGo()">${p.neu.length} hinzufügen</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}
function impGo(){const p=IMP.plan;p.neu.forEach(i=>S.items.push(i));adoptLief();save();closeSheet();tab('lager');toast(p.neu.length+' Rohstoffe hinzugefügt')}
function sheetRestore(){const d=IMP.json;const n=d.items.length;openSheet(`<h2>Sicherung einlesen</h2><div style="font-size:1rem;font-weight:600">${n} Rohstoffe in der Datei</div><div class="s" style="margin-top:4px">Du hast aktuell ${S.items.length} Rohstoffe. Wähle, wie die Sicherung übernommen werden soll.</div>
<div class="btns col"><button class="btn" onclick="restoreMerge()">Nur neue Rohstoffe ergänzen</button><button class="btn danger" onclick="restoreAll()">Alles ersetzen</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`)}
function restoreAll(){const d=IMP.json;delete d.app;delete d.v;S=d;S.items=S.items.map(normI);S.shop=S.shop||[];S.lief=S.lief||{};if(!S.orte)S.orte=['Regal','Schrank','Schublade','Kühlschrank'];S.seeded=true;adoptLief();loadCatX();save();closeSheet();tab('lager');toast('Sicherung eingelesen')}
function restoreMerge(){const d=IMP.json;const hn={},hc={};S.items.forEach(i=>{hn[FOLD(i.name)]=1;if(i.cid)hc[i.cid]=1});let n=0;d.items.map(normI).forEach(i=>{if((i.cid&&hc[i.cid])||hn[FOLD(i.name)])return;S.items.push(i);n++});
Object.keys(d.lief||{}).forEach(l=>{if(!S.lief[l])S.lief[l]=d.lief[l]});(d.orte||[]).forEach(o=>{if(!S.orte.includes(o))S.orte.push(o)});adoptLief();save();closeSheet();tab('lager');toast(n+' Rohstoffe ergänzt')}
/* ---------- Katalog aktualisieren ---------- */
let CU=null;
async function sheetCatUpd(){openSheet(`<h2>Katalog aktualisieren</h2><div class="s" style="margin-bottom:8px">Installiert: ${S.catmeta&&S.catmeta.version?'Katalog '+esc(S.catmeta.version)+(S.catmeta.date?' vom '+dde(S.catmeta.date):''):'Grundkatalog der App'} · ${CAT.length} Einträge</div><div id="cu" class="s">Suche nach einer neuen Katalogversion …</div>`);
try{const r=await fetch('katalog.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();if(!Array.isArray(d.items))throw 0;
const neu=d.items.filter(c=>!CM[c.id]);const fix=[],conf=[];
d.items.forEach(c=>{const o=CM[c.id];if(!o)return;const ch=['n','i','k','h','a','u','s','q','p'].some(k=>c[k]!=null&&c[k]!==o[k]);if(!ch)return;
fix.push(c);if(c.i!=null&&c.i!==o.i)S.items.forEach(it=>{if(it.cid===c.id&&it.inci&&it.inci!==o.i&&it.inci!==c.i)conf.push({it,c})})});
const inciN=fix.filter(c=>c.i!=null&&c.i!==CM[c.id].i).length;CU={neu,fix,conf,meta:{version:d.version||'',date:d.date||''}};
if(!neu.length&&!fix.length){$('#cu').innerHTML=`<div style="font-size:1rem;font-weight:600">Dein Katalog ist aktuell.</div><div class="s" style="margin-top:4px">Katalog ${esc(d.version||'')}${d.date?' vom '+dde(d.date):''} · ${CAT.length} Einträge</div><div class="btns"><button class="btn" onclick="closeSheet()">OK</button></div>`;return}
$('#cu').innerHTML=`<div style="font-size:1rem;font-weight:600">${neu.length} ${neu.length===1?'neuer Eintrag':'neue Einträge'}, ${inciN} ${inciN===1?'INCI-Korrektur':'INCI-Korrekturen'}</div><div class="s" style="margin-top:4px">Deine Mengen, Preise, Texte, Fotos und eigenen Änderungen bleiben unverändert.</div>
${conf.length?`<div class="cap" style="margin:14px 0 4px">Du hast die INCI selbst geändert</div><div class="s">Haken setzen = Katalog-Fassung übernehmen.</div>${conf.map((x,n)=>`<label class="chk" style="margin:8px 0 0;align-items:flex-start"><input type="checkbox" id="cf${n}"> <span><b>${esc(x.it.name)}</b><br><span class="s">Deine: ${esc(x.it.inci)}<br>Katalog: ${esc(x.c.i)}</span></span></label>`).join('')}`:''}
<div class="btns"><button class="btn" onclick="catApply()">Aktualisieren</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`}
catch(e){$('#cu').innerHTML=`<div style="font-size:.9rem">Es ist gerade kein Katalog-Update erreichbar. Prüfe die Internetverbindung und versuche es später noch einmal.</div><div class="btns"><button class="btn" onclick="closeSheet()">OK</button></div>`}}
function catApply(){const {neu,fix,conf}=CU;const ok=new Set();conf.forEach((x,n)=>{if($('#cf'+n)&&$('#cf'+n).checked)ok.add(x.it.id)});
const confIds=new Set(conf.map(x=>x.it.id));
fix.forEach(c=>{const o=CM[c.id];S.items.forEach(it=>{if(it.cid!==c.id||c.i==null||c.i===o.i)return;if(it.inci===o.i||!it.inci||ok.has(it.id)){it.inci=c.i}});
const f={};['n','i','k','h','a','u','s','q','p'].forEach(k=>{if(c[k]!=null)f[k]=c[k]});S.catfix[c.id]=Object.assign(S.catfix[c.id]||{},f);Object.assign(o,f)});
neu.forEach(c=>{S.catadd.push(c);CAT.push(c);CM[c.id]=c});S.catmeta=CU.meta;save();closeSheet();draw();toast('Katalog aktualisiert')}

const LFIT={S:12,M:15,L:15};

function sheetLabels(){if(!S.items.length){sheetMsg('Keine Rohstoffe','Lege zuerst Rohstoffe an, dann kannst du Etiketten drucken.');return}
openSheet(`<h2>Etiketten &amp; Druck</h2><div class="cap" style="margin:6px 0">Größe</div><div id="lbs" style="display:flex;gap:8px;flex-wrap:wrap"></div>

function ownId(raw){const s=String(raw||'').trim();const m=s.match(/^INCIHEINZ:([A-Za-z0-9]+)$/i)||s.match(/#\/i\/([A-Za-z0-9]{3,10})\s*$/);const id=(m?m[1]:s).toLowerCase();return S.items.find(i=>i.id.toLowerCase()===id)||null}

async function camStart(){if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!('BarcodeDetector' in window)){toast('Automatisches Scannen ist hier nicht möglich – bitte Code von Hand eingeben');const e=$('#mc');if(e)e.focus();return}
$('#app').insertAdjacentHTML('beforeend',`<div id="camov" class="camov"><video id="camv" playsinline muted></video><div class="camfr"></div><div class="camtx">Code in den Rahmen halten</div><div class="cambt"><button class="btn sec" style="flex:1" onclick="camStop()">Schließen</button></div></div>`);
try{const want=['qr_code','ean_13','ean_8','upc_a','upc_e','code_128','code_39'];let sup=want;try{const s=await BarcodeDetector.getSupportedFormats();sup=want.filter(f=>s.includes(f))}catch(_){}
CAM={st:await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false}),det:new BarcodeDetector({formats:sup}),on:true,seen:{},t0:0};
const v=$('#camv');v.srcObject=CAM.st;await v.play();
const tick=async()=>{if(!CAM||!CAM.on)return;try{const r=await CAM.det.detect(v);const now=Date.now();r.forEach(x=>{const c=String(x.rawValue||'').trim();if(c&&!CAM.seen[c]){CAM.seen[c]=1;if(!CAM.t0)CAM.t0=now;if(navigator.vibrate)try{navigator.vibrate(30)}catch(_){}}});if(CAM.t0){const cs=Object.keys(CAM.seen);const fr=document.querySelector('.camfr'),tx=document.querySelector('.camtx');if(fr)fr.classList.add('ok');if(tx)tx.innerHTML=cs.map(c=>'✓ '+esc(codeLabel(c))).join('<br>');if(now-CAM.t0>=1500){camStop();camDone(cs);return}}}catch(e){}setTimeout(tick,150)};tick()}
catch(e){camStop();toast('Kamera nicht erlaubt oder nicht verfügbar')}}
function camStop(){if(CAM){CAM.on=false;try{CAM.st.getTracks().forEach(t=>t.stop())}catch(_){}CAM=null}const o=document.getElementById('camov');if(o)o.remove()}
function photoPick(mode,itemId){PH={item:itemId||null};const inp=document.createElement('input');inp.type='file';inp.accept='image/*';if(mode==='cam')inp.setAttribute('capture','environment');window._pi=inp;inp.onchange=()=>{const f=inp.files[0];if(f)photoLoad(f)};inp.click()}
function photoLoad(f){const url=URL.createObjectURL(f);const im=new Image();im.onload=()=>{PH.img=im;PH.url=url;PH.z=1;PH.cx=im.width/2;PH.cy=im.height/2;cropSheet()};im.onerror=()=>toast('Bild nicht lesbar');im.src=url}
function cropSide(){return Math.min(PH.img.width,PH.img.height)/PH.z}
function cropClamp(){const s=cropSide();PH.cx=Math.max(s/2,Math.min(PH.img.width-s/2,PH.cx));PH.cy=Math.max(s/2,Math.min(PH.img.height-s/2,PH.cy))}
function cropDraw(o){const cv=o||$('#cv');const c=cv.getContext('2d');const s=cropSide();c.fillStyle='#fff';c.fillRect(0,0,cv.width,cv.height);c.drawImage(PH.img,PH.cx-s/2,PH.cy-s/2,s,s,0,0,cv.width,cv.height)}
function cropSheet(){openSheet(`<h2>Ausschnitt wählen</h2><div class="s">Bild mit dem Finger verschieben, mit dem Regler vergrößern.</div><canvas id="cv" width="360" height="360" style="width:100%;max-width:300px;aspect-ratio:1;display:block;margin:10px auto;border-radius:14px;background:#000;touch-action:none"></canvas><input type="range" id="cz" min="1" max="4" step="0.05" value="1" style="width:100%"><div class="btns"><button class="btn" onclick="cropOk()">Weiter</button><button class="btn sec" onclick="closeSheet()">Abbrechen</button></div>`);
const cv=$('#cv');cropDraw();$('#cz').oninput=e=>{PH.z=+e.target.value;cropClamp();cropDraw()};let d=null;
cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);d={x:e.clientX,y:e.clientY}};
cv.onpointermove=e=>{if(!d)return;const k=cropSide()/cv.getBoundingClientRect().width;PH.cx-=(e.clientX-d.x)*k;PH.cy-=(e.clientY-d.y)*k;d={x:e.clientX,y:e.clientY};cropClamp();cropDraw()};cv.onpointerup=cv.onpointercancel=()=>{d=null}}

function crc32(u8){if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}let crc=-1;for(let i=0;i<u8.length;i++)crc=crc32.t[(crc^u8[i])&255]^(crc>>>8);return (crc^-1)>>>0}
function zipStore(files,mime){const enc=new TextEncoder();const parts=[],cd=[];let off=0;const u16=n=>[n&255,(n>>8)&255],u32=n=>[n&255,(n>>8)&255,(n>>16)&255,(n>>>24)&255];
files.forEach(f=>{const nm=enc.encode(f.name),data=enc.encode(f.text),crc=crc32(data),sz=data.length;
const lh=new Uint8Array([0x50,0x4b,3,4,...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0)]);
parts.push(lh,nm,data);cd.push(new Uint8Array([0x50,0x4b,1,2,...u16(20),...u16(20),...u16(0x0800),...u16(0),...u16(0),...u16(0x21),...u32(crc),...u32(sz),...u32(sz),...u16(nm.length),...u16(0),...u16(0),...u16(0),...u16(0),...u32(0),...u32(off)]),nm);off+=lh.length+nm.length+sz});
const cl=cd.reduce((a,b)=>a+b.length,0);const end=new Uint8Array([0x50,0x4b,5,6,0,0,0,0,...u16(files.length),...u16(files.length),...u32(cl),...u32(off),0,0]);
return new Blob([...parts,...cd,end],{type:mime})}
const xe=s=>String(s==null?'':s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

function parseInci(text){const lines=String(text||'').split(/\r?\n/);
for(let n=0;n<lines.length;n++){const m=lines[n].match(/^\s*(?:INCI(?:[- ](?:Deklaration|Bezeichnung|Name|Liste))?|Inhaltsstoffe|Ingredients|Ingredientes|Composición|Zusammensetzung)\s*[:：]\s*(.*)$/i);if(!m)continue;
let acc=m[1].trim();for(let k=n+1;k<lines.length&&k<n+8;k++){const l=lines[k].trim();if(!l)break;if(LBLRE.test(l))break;if(acc&&/[.;]$/.test(acc)&&!/,$/.test(acc))break;acc+=(acc?' ':'')+l;const cut=acc.search(/[.;]\s+[A-ZÄÖÜ][a-zäöü]/);if(cut>0){acc=acc.slice(0,cut+1);break}if(acc.length>700)break}

function parseProduct(text){const t=String(text||'').replace(/ /g,' ');const r={name:'',inci:parseInci(t),nr:'',form:'',ean:'',url:'',offers:[]};
let m=t.match(/Produktname\s*[:：]\s*(.+)/i);if(m)r.name=m[1].trim();
m=t.match(/Artikel(?:nummer|-?\s?Nr\.?)\s*[:：]\s*([^\s|]+)/i);if(m)r.nr=m[1].trim();
if(!r.name){const ls=t.split(/\r?\n/).map(x=>x.trim());const k=ls.findIndex(x=>/^Artikel(?:nummer|-?\s?Nr)/i.test(x));if(k>0){for(let j=k-1;j>=0;j--){if(ls[j]&&ls[j].length<80){r.name=ls[j];break}}}}
m=t.match(/(?:EAN|GTIN)\s*[:：]?\s*(\d{8,14})/i);if(m)r.ean=m[1];
m=t.match(/https?:\/\/[^\s)>"']+/);if(m)r.url=m[0];
m=t.match(/(?:Erscheinungsbild|Aussehen|Konsistenz)\s*[:：]\s*(.+)/i);const ap=m?m[1]:'';
if(ap){if(/pulver/i.test(ap))r.form='Pulver';else if(/granulat/i.test(ap))r.form='Granulat';else if(/wachs|pellet/i.test(ap))r.form='Wachs/Pellets';else if(/paste|gel|creme|pastös/i.test(ap))r.form='Paste/Gel';else if(/öl\b/i.test(ap))r.form='Öl';else if(/flüssig|viskos|klar/i.test(ap))r.form='flüssig';else if(/fest|butter/i.test(ap))r.form='fest'}
const re=/(\d+(?:[.,]\d+)?)\s?(kg|mg|ml|g|l)(?![a-zäöüA-Z])\s*[|:\-–—]?\s*(\d+(?:[.,]\d+)?)\s*(?:€|EUR)/gi;const seen={};let x;
while((x=re.exec(t))){const mg=pNum(x[1]),pr=pNum(x[3]);const u=x[2].toLowerCase();if(!(mg>0)||pr==null||!U[u])continue;const k=mg+u+pr;if(seen[k])continue;seen[k]=1;r.offers.push({m:mg,u,p:pr})}
if(!r.name){const ls=t.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);const f=ls.find(x=>x.length<110&&!/[:：]\s*$/.test(x)&&!/^(inci|artikel|auswahl|produkt|preis|angebot|grundpreis|inkl|zzgl|€)/i.test(x));if(f){const q=f.match(/^(.*?)[\s,–-]+(\d+(?:[.,]\d+)?)\s?(kg|mg|ml|g|l)\s*$/i);if(q&&q[1].length>2){r.name=q[1].trim();r.fq={m:pNum(q[2]),u:q[3].toLowerCase()}}else r.name=f}}

async function inflRaw(u8){const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(u8);w.close();return new Uint8Array(await new Response(ds.readable).arrayBuffer())}
async function unzipFiles(buf){const u=new Uint8Array(buf),dv=new DataView(buf);let e=u.length-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw 0;const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const out={};

function xmlText(s){return s.replace(/<[^>]+>/g,'').replace(/&#(x?)([0-9a-fA-F]+);/g,(m,x,n)=>String.fromCodePoint(parseInt(n,x?16:10))).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&')}
function colIx(r){let n=0;for(const c of r.replace(/\d/g,''))n=n*26+c.charCodeAt(0)-64;return n-1}
async function xlsxRows(buf){const f=await unzipFiles(buf);const sh=Object.keys(f).filter(k=>/worksheets\//.test(k)).sort()[0];if(!sh)throw 0;
const ss=[];(f['xl/sharedStrings.xml']||'').replace(/<si>([\s\S]*?)<\/si>/g,(m,a)=>{ss.push(xmlText(a.replace(/<rPh[\s\S]*?<\/rPh>/g,'')));return m});
const rows=[];f[sh].replace(/<row\b[^>]*>([\s\S]*?)<\/row>/g,(m,a)=>{const r=[];a.replace(/<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/g,(mm,at,b)=>{const ref=(at.match(/\br="([A-Z]+\d+)"/)||[])[1];const t=(at.match(/\bt="(\w+)"/)||[])[1];let v='';b=b||'';if(t==='inlineStr')v=xmlText(b);else{const x=(b.match(/<v>([\s\S]*?)<\/v>/)||[])[1];if(x!=null){v=t==='s'?ss[+x]||'':xmlText(x);if(!t||t==='n')v=v.replace('.',',')}}

function camDone(cs){if(cs.length===1){handleCode(cs[0]);return}openSheet(`<h2>${cs.length} Codes erkannt</h2><div class="s" style="margin-bottom:6px">Wähle, welcher Code gelten soll.</div>`+cs.map(c=>`<div class="hit" onclick="closeSheet();handleCode(${attr(c)})"><b>${esc(codeLabel(c))}</b><div class="s" style="font-family:ui-monospace,Menlo,Consolas,monospace">${esc(c)}</div></div>`).join('')+`<div class="btns"><button class="btn sec" onclick="closeSheet();camStart()">Nochmal scannen</button></div>`)}
function tierHist(i,o){const a=i.bezug.filter(y=>y.lief===o.lief&&(y.nr||'')===(o.nr||'')&&Math.round(y.menge*1000)===Math.round(o.menge*1000)).sort((x,y)=>x.datum<y.datum?-1:x.datum>y.datum?1:0).reverse();if(a.length<2)return '';return `<div class="cap" style="margin:14px 0 2px">Bisherige Preise</div>`+a.map(y=>`<div class="kv"><span>${dde(y.datum)}</span><span>${eur(y.preis)}</span></div>`).join('')}

/* ---------- Statistik (v1.1) ---------- */
P.stat='<path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/>';
const PAL=['#2D5A43','#5F9174','#98BBA6','#C8DBCE','#D9A441','#B7AE9C','#7A8F85'];
const WC=['#2D5A43','#D9A441','#4F86C6','#B5535C','#8C6BB1'];
function watchList(D){if(!Array.isArray(S.watch))return D.series.filter(x=>x.s.length>1).slice(0,3).map(x=>x.i);return S.watch.map(getI).filter(Boolean).slice(0,5)}
function watchSet(a){S.watch=a.map(i=>i.id).slice(0,5);save()}
function wMode(n){return n>1?(S.wmode||'rel'):'abs'}
function wPts(i,mode){const ps=priceSeries(i);if(!ps.length)return [];const b=ps[0].v;return ps.map(p=>({t:p.t,v:mode==='rel'?(b?(p.v/b-1)*100:0):p.v,raw:p.v}))}
function lineM(items,mode,h){const all=items.map((i,k)=>({c:WC[k],p:wPts(i,mode)})).filter(x=>x.p.length);if(!all.length)return '';const w=300,pd=8;const xs=all.flatMap(x=>x.p.map(p=>p.t)),ys=all.flatMap(x=>x.p.map(p=>p.v));let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(mode==='rel'){y0=Math.min(y0,0);y1=Math.max(y1,0)}if(x1===x0){x0-=864e5*15;x1+=864e5*15}if(y1===y0){y0-=1;y1+=1}const X=t=>pd+(t-x0)/(x1-x0)*(w-2*pd),Y=v=>h-pd-(v-y0)/(y1-y0)*(h-2*pd);return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${mode==='rel'?`<line x1="0" x2="${w}" y1="${Y(0)}" y2="${Y(0)}" stroke="#CFD9D2" stroke-dasharray="3 3"/>`:''}${all.map(x=>`<polyline points="${x.p.map(p=>X(p.t)+','+Y(p.v)).join(' ')}" fill="none" stroke="${x.c}" stroke-width="2" stroke-linejoin="round"/>${x.p.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="2.8" fill="#fff" stroke="${x.c}" stroke-width="1.6"/>`).join('')}`).join('')}</svg>`}
function wLegend(items,mode){return items.map((i,k)=>{const p=wPts(i,mode);const l=p[p.length-1];const t=!l?'kein Preis':mode==='rel'?pctT(l.v):eur(l.raw);return `<div style="display:flex;align-items:center;gap:6px;font-size:.78rem;margin-top:3px"><span style="width:10px;height:10px;border-radius:50%;background:${WC[k]};flex:none"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${esc(i.name)}</span><b style="font-weight:600">${t}</b></div>`}).join('')}
const MONS={de:['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'],en:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],es:['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic']};
const MON=new Proxy([],{get:(t,k)=>(MONS[LANG]||MONS.de)[k]});
function valOf(i){if(i.unk||!(i.total>0))return null;const c=cheapest(i);return c?i.total*c.x.preis/c.x.menge:null}
function priceSeries(i){const bs=i.bezug.filter(b=>b.kind===i.kind&&b.datum);const ds=[...new Set(bs.map(b=>b.datum))].sort();const out=[];ds.forEach(d=>{const cur={};bs.forEach((b,ix)=>{if(b.datum>d)return;const k=b.lief+'|'+(b.nr||'')+'|'+Math.round(b.menge*1000);if(!cur[k]||b.datum>=cur[k].datum)cur[k]=b});const v=Math.min(...Object.values(cur).map(b=>per(b).v));out.push({d,t:new Date(d).getTime(),v})});return out}
function statData(){const items=S.items,D={};const now=new Date();const t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
D.vals=items.map(i=>({i,v:valOf(i)})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);D.total=D.vals.reduce((a,x)=>a+x.v,0);D.nItems=items.length;D.nPrice=D.vals.length;
const kc={};items.forEach(i=>{const k=kc[i.kat]=kc[i.kat]||{n:0,v:0};k.n++;const x=D.vals.find(y=>y.i===i);if(x)k.v+=x.v});D.kat=Object.keys(kc).map(k=>({k,n:kc[k].n,v:kc[k].v})).sort((a,b)=>b.n-a.n);
D.months=[];for(let k=0;k<12;k++){const d=new Date(t0.getFullYear(),t0.getMonth()+k,1);D.months.push({y:d.getFullYear(),m:d.getMonth(),n:0})}
D.expired=[];D.mhdList=[];items.filter(i=>i.mhd).forEach(i=>{const d=new Date(i.mhd);D.mhdList.push(i);if(d<t0)D.expired.push(i);else{const k=(d.getFullYear()-t0.getFullYear())*12+d.getMonth()-t0.getMonth();if(k>=0&&k<12)D.months[k].n++}});
D.mhdList.sort((a,b)=>a.mhd<b.mhd?-1:1);D.soon=items.filter(i=>i.mhd&&new Date(i.mhd)>=t0&&(new Date(i.mhd)-t0)/864e5<=30).length;
D.series=items.map(i=>({i,s:priceSeries(i)})).filter(x=>x.s.length).sort((a,b)=>b.s.length-a.s.length);
D.watch=watchList(D);
D.chg=[];items.forEach(i=>{const g={};i.bezug.filter(b=>b.kind===i.kind).forEach(b=>{const k=b.lief+'|'+(b.nr||'')+'|'+Math.round(b.menge*1000);(g[k]=g[k]||[]).push(b)});Object.values(g).forEach(a=>{a.sort((x,y)=>x.datum<y.datum?-1:x.datum>y.datum?1:0);if(a.length>1){const f=a[0],l=a[a.length-1];if(f.preis>0&&l.preis!==f.preis)D.chg.push({i,lief:l.lief,m:l.menge,from:f.preis,to:l.preis,pct:(l.preis-f.preis)/f.preis*100,d0:f.datum,d1:l.datum})}})});D.chg.sort((a,b)=>Math.abs(b.pct)-Math.abs(a.pct));
const lc={};let single=0;items.forEach(i=>{const c=cheapest(i);if(c){lc[c.x.lief]=(lc[c.x.lief]||0)+1;if(new Set(i.bezug.map(b=>b.lief)).size===1)single++}});D.lief=Object.keys(lc).map(k=>({l:k,n:lc[k]})).sort((a,b)=>b.n-a.n);D.single=single;
D.crit=[['inci','INCI geprüft',i=>i.ist==='geprüft','inciOpen'],['preis','Preis erfasst',i=>i.bezug.length>0,'bezug'],['menge','Menge bekannt',i=>!i.unk,'unk'],['mhd','MHD eingetragen',i=>!!i.mhd,'mhd'],['ort','Lagerort',i=>i.vessels.some(v=>v.ort),'ort'],['foto','Foto',i=>!!i.foto,'']].map(c=>({k:c[0],l:c[1],n:items.filter(c[2]).length,gap:c[3]}));
D.pct=items.length?Math.round(D.crit.reduce((a,c)=>a+c.n,0)/(D.crit.length*items.length)*100):0;
const g={};S.shop.forEach(s=>{const i=getI(s.item);if(!i)return;(g[s.lief||'']=g[s.lief||'']||[]).push({s,i})});
D.shop=Object.keys(g).sort().map(l=>{let sum=0,miss=0;g[l].forEach(({s,i})=>{const b=l?tiers(i).filter(x=>x.lief===l&&x.kind===i.kind).sort((a,c)=>per(a).v-per(c).v)[0]:null;if(b)sum+=s.menge*b.preis/b.menge;else miss++});const cfg=S.lief[l]||{frei:0,versand:0};return {l,n:g[l].length,sum,miss,frei:cfg.frei||0,versand:cfg.versand||0}});
D.shopSum=D.shop.reduce((a,x)=>a+x.sum,0);D.shopN=S.shop.filter(s=>getI(s.item)).length;D.low=items.filter(low).length;return D}
/* ---- SVG ---- */
function donut(parts,size){const tot=parts.reduce((a,p)=>a+p.v,0);if(!tot)return '';let off=25;return `<svg width="${size}" height="${size}" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#E8F2EC" stroke-width="6"/>${parts.map(p=>{const pc=p.v/tot*100;const e=`<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${p.c}" stroke-width="6" stroke-dasharray="${pc} ${100-pc}" stroke-dashoffset="${off}"/>`;off-=pc;return e}).join('')}</svg>`}
function ring(pc,size){return `<svg width="${size}" height="${size}" viewBox="0 0 42 42"><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#E8F2EC" stroke-width="5"/><circle cx="21" cy="21" r="15.9155" fill="none" stroke="#2D5A43" stroke-width="5" stroke-linecap="round" stroke-dasharray="${pc} ${100-pc}" stroke-dashoffset="25"/><text x="21" y="23.5" text-anchor="middle" font-size="8.5" font-weight="600" fill="#1E2621">${pc}%</text></svg>`}
function colsV(vals,labels,h){const mx=Math.max(1,...vals);const w=300,bw=w/vals.length;return `<svg viewBox="0 -12 ${w} ${h+30}" width="100%" style="display:block">${vals.map((v,k)=>{const bh=v/mx*h;return `<rect x="${k*bw+3}" y="${h-bh}" width="${bw-6}" height="${Math.max(bh,v?2:0)}" rx="3" fill="${k===0&&labels[0]==='!'?'#D9A441':'#2D5A43'}"/>${v?`<text x="${k*bw+bw/2}" y="${h-bh-3}" text-anchor="middle" font-size="9" fill="#4B5A51">${v}</text>`:''}<text x="${k*bw+bw/2}" y="${h+13}" text-anchor="middle" font-size="8.5" fill="#4B5A51">${labels[k]==='!'?'alt':labels[k]}</text>`}).join('')}</svg>`}
function lineC(pts,h){if(!pts.length)return '';const w=300,pd=8;const xs=pts.map(p=>p.t),ys=pts.map(p=>p.v);let x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);if(x1===x0){x0-=864e5*15;x1+=864e5*15}if(y1===y0){y0*=.9;y1*=1.1}if(y1===y0){y0-=1;y1+=1}
const X=t=>pd+(t-x0)/(x1-x0)*(w-2*pd),Y=v=>h-pd-(v-y0)/(y1-y0)*(h-2*pd);return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block"><polyline points="${pts.map(p=>X(p.t)+','+Y(p.v)).join(' ')}" fill="none" stroke="#2D5A43" stroke-width="2" stroke-linejoin="round"/>${pts.map(p=>`<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.2" fill="#fff" stroke="#2D5A43" stroke-width="1.8"/>`).join('')}</svg>`}
function hbars(rows){const mx=Math.max(1,...rows.map(r=>r.v));return rows.map(r=>`<div style="margin-top:7px"><div style="display:flex;justify-content:space-between;font-size:.78rem"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:70%">${esc(r.l)}</span><b style="font-weight:600">${r.t!=null?r.t:r.v}</b></div><div class="bar" style="margin-top:3px"><div style="width:${r.v/mx*100}%"></div></div></div>`).join('')}
const pctT=p=>(p>0?'+':'')+nf(Math.round(p*10)/10,1)+' %';
/* ---- Seite ---- */
function stat(){const D=statData();window.SD=D;const W=(k,t,body,w2)=>`<div class="card wg${w2?' w2':''}" onclick="sheetStat('${k}')"><h3>${t}</h3>${body}</div>`;const none=t=>`<div class="s">${t}</div>`;
$('#main').innerHTML=`<div style="font-size:1.2rem;font-weight:600;letter-spacing:-.02em">Statistik</div><div class="s" style="margin:6px 0 14px">Alles wird auf diesem Gerät berechnet. Tippe eine Kachel für Details.</div>
<div class="wgs">
${W('wert','Lagerwert',D.nPrice?`<div class="big">${eur(D.total)}</div><div class="s" style="margin-top:6px">${D.nPrice} von ${D.nItems} Rohstoffen mit Preis</div>`:none('Noch keine Preise erfasst'))}
${W('einkauf','Einkauf',D.shopN?`<div class="big">${eur(D.shopSum)}</div><div class="s" style="margin-top:6px">${D.shopN} auf der Liste${D.low?' · '+D.low+' knapp':''}</div>`:`<div class="big">0</div><div class="s" style="margin-top:6px">Liste leer${D.low?' · '+D.low+' knapp':''}</div>`)}
${W('kat','Kategorien',D.kat.length?`<div style="display:flex;align-items:center;gap:10px">${donut(D.kat.slice(0,7).map((k,n)=>({v:k.n,c:PAL[n]})),76)}<div class="s" style="font-size:.8rem">${D.kat.length} Kategorien</div></div>`:none('Noch keine Rohstoffe'))}
${W('voll','Vollständigkeit',D.nItems?`<div style="display:flex;align-items:center;gap:10px">${ring(D.pct,76)}<div class="s" style="font-size:.8rem">ausgefüllt</div></div>`:none('Noch keine Rohstoffe'))}
${W('ablauf','Ablaufkalender',D.mhdList.length?colsV([D.expired.length].concat(D.months.map(m=>m.n)),['!'].concat(D.months.map(m=>MON[m.m])),64)+`<div class="s" style="margin-top:4px">${D.expired.length} abgelaufen · ${D.soon} in 30 Tagen</div>`:none('Noch kein MHD eingetragen'),1)}
${W('preis','Preisentwicklung',D.watch.length?lineM(D.watch,wMode(D.watch.length),84)+wLegend(D.watch,wMode(D.watch.length))+(D.watch.every(i=>priceSeries(i).length<2)?`<div class="s" style="margin-top:6px">Preise von nur einem Tag. Die Linie entsteht, wenn an weiteren Tagen Preise dazukommen.</div>`:''):none('Wähle bis zu 5 Rohstoffe, deren Preis du verfolgen willst. Tippe hier.'),1)}
${W('chg','Preisänderungen',D.chg.length?D.chg.slice(0,2).map(c=>`<div style="margin-top:4px;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.i.name)}<span style="opacity:.65"> · ${esc(c.lief)} ${fmt(c.m,c.i.kind)}</span></div><b style="font-size:1rem;color:${c.pct>0?'var(--ambt)':'var(--pri)'}">${pctT(c.pct)}</b>`).join(''):none('Noch keine Änderung. Trage neue Preise ein, dann siehst du hier den Trend.'))}
${W('lief','Günstigster Lieferant',D.lief.length?hbars(D.lief.slice(0,3).map(x=>({l:x.l,v:x.n}))):none('Noch keine Preise erfasst'))}
</div>`}
function listRows(rows){return rows.map(r=>`<div class="kv" ${r.id?`style="cursor:pointer" onclick="go('artikel','${r.id}')"`:''}><span>${esc(r.l)}</span><span>${r.r}</span></div>`).join('')}
function sheetStat(k){const D=window.SD||statData();let h='';
if(k==='wert'){h=`<h2>Lagerwert</h2><div class="s">Menge × günstigster erfasster Preis. Nur Rohstoffe mit bekannter Menge und Preis.</div><div class="big" style="margin:8px 0">${eur(D.total)}</div><div class="cap">Die wertvollsten Rohstoffe</div>${listRows(D.vals.slice(0,10).map(x=>({id:x.i.id,l:x.i.name,r:eur(x.v)})))||'<div class="s">Noch keine Daten.</div>'}<div class="cap" style="margin-top:12px">Nach Kategorie</div>${hbars(D.kat.filter(x=>x.v>0).sort((a,b)=>b.v-a.v).map(x=>({l:x.k,v:x.v,t:eur(x.v)})))}`}
else if(k==='kat'){h=`<h2>Kategorien</h2>${hbars(D.kat.map(x=>({l:x.k,v:x.n,t:x.n+(x.v?' · '+eur(x.v):'')})))}`}
else if(k==='ablauf'){h=`<h2>Ablaufkalender</h2>${D.expired.length?`<div class="cap">Abgelaufen</div>${listRows(D.expired.map(i=>({id:i.id,l:i.name,r:dde(i.mhd)})))}`:''}<div class="cap" style="margin-top:12px">Demnächst</div>${listRows(D.mhdList.filter(i=>!D.expired.includes(i)).map(i=>({id:i.id,l:i.name,r:dde(i.mhd)}))).slice(0,6000)||'<div class="s">Nichts.</div>'}`}
else if(k==='preis'){const W5=D.watch||[];const md=wMode(W5.length);h=`<h2>Preisentwicklung</h2><div class="s">Verfolge bis zu 5 Rohstoffe (${W5.length} / 5). ${W5.length>1?'Mehrere Linien werden als Änderung in Prozent seit dem ersten Preis verglichen.':'Mit einem Rohstoff siehst du den Preis je 100 g/ml.'}</div>${W5.length>1?`<div style="display:flex;gap:8px;margin:10px 0"><button class="pill" style="${md==='rel'?'background:var(--pri);color:#fff;border-color:var(--pri)':''}" onclick="S.wmode='rel';save();sheetStat('preis')">Änderung in %</button><button class="pill" style="${md==='abs'?'background:var(--pri);color:#fff;border-color:var(--pri)':''}" onclick="S.wmode='abs';save();sheetStat('preis')">Preis in €</button></div>`:''}${W5.length?lineM(W5,W5.length>1?md:'abs',140):''}<div style="margin-top:8px">${W5.map((i,k)=>{const p=wPts(i,'abs');const f=p[0],l=p[p.length-1];return `<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)"><span style="width:12px;height:12px;border-radius:50%;background:${WC[k]};flex:none"></span><div style="flex:1;min-width:0" onclick="go('artikel','${i.id}')"><div style="font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(i.name)}</div><div class="s">${p.length?(p.length>1?eur(f.raw)+' → '+eur(l.raw):eur(l.raw))+' '+per({preis:1,menge:1,kind:i.kind}).u+' · '+p.length+' Preis'+(p.length>1?'e':''):'Noch kein Preis erfasst'}</div></div><button class="ib" aria-label="Entfernen" onclick="watchDel('${i.id}')">${ic('x','currentColor',18)}</button></div>`}).join('')||'<div class="s" style="margin-top:8px">Noch kein Rohstoff gewählt.</div>'}</div>${W5.length===1?curPrices(W5[0]):''}${W5.every(i=>priceSeries(i).length<2)&&W5.length?`<div class="hint" style="margin-top:8px">Alle Preise sind von einem Tag. Der Verlauf entsteht, sobald an einem anderen Tag ein neuer Preis eingetragen wird.</div>`:''}${W5.length<5?`<div class="btns"><button class="btn" onclick="watchAdd()">Rohstoff hinzufügen</button></div>`:''}`}
else if(k==='chg'){h=`<h2>Preisänderungen</h2><div class="s" style="margin-bottom:6px">Gleiche Packungsgröße beim gleichen Lieferanten, erster gegen letzten Preis.</div>${D.chg.length?D.chg.map(c=>`<div class="kv" style="cursor:pointer" onclick="go('artikel','${c.i.id}')"><span>${esc(c.i.name)}<div class="s">${esc(c.lief)} · ${fmt(c.m,c.i.kind)} · ${eur(c.from)} → ${eur(c.to)}</div></span><b style="font-weight:600;color:${c.pct>0?'var(--ambt)':'var(--pri)'}">${pctT(c.pct)}</b></div>`).join(''):'<div class="s">Noch keine Änderungen erfasst.</div>'}`}
